<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>twolastnames project log</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Archivo:wght@500;600;700;800&display=swap');

  :root{
    --bg: #ffffff;
    --panel: #f3f3f2;
    --panel-2: #e8e8e6;
    --line: #dcdcda;
    --text: #17181a;
    --text-dim: #6c6f70;
    --mono: 'IBM Plex Mono', monospace;
    --display: 'Archivo', sans-serif;
    --in: #275D38;
    --out: #D6001C;
    --amber: #009CDE;
    --pre: #C9821E;
    --yellow: #D9A404;
    --radius: 10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: var(--display);
    min-height:100vh;
    padding-bottom: 20px;
  }
  #app{max-width:640px;margin:0 auto;padding:0 16px; transition:max-width .18s ease, margin .18s ease;}
  body.has-side-panel #app{max-width:420px; margin:0 0 0 24px; padding:0;}
  @media (max-width:700px){
    body.has-side-panel #app{max-width:640px; margin-left:auto; margin-right:auto;}
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 0 14px 0;
    border-bottom: 1px solid var(--line);
    margin-bottom: 16px;
    position: sticky; top:0; background:var(--bg); z-index: 5;
  }
  .wordmark{display:flex; align-items:center; gap:10px;}
  .wordmark h1{font-size:17px; letter-spacing:0.14em; margin:0; font-weight:800; text-transform:uppercase;}
  .wordmark span{color:var(--text-dim); font-size:11px; display:block; letter-spacing:0.08em; font-family:var(--mono); margin-top:2px;}

  .notify{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:var(--radius); padding:12px 14px; margin-bottom:16px; cursor:pointer;}
  .notify:active{background:var(--panel-2);}
  .notify-dot{width:8px;height:8px;border-radius:50%; background:var(--amber); flex:none; box-shadow:0 0 7px 1px rgba(0,156,222,0.5);}
  .notify-body{flex:1; min-width:0;}
  .notify-title{font-size:13px; font-weight:700;}
  .notify-text{font-size:12.5px; color:var(--text-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .notify-time{font-family:var(--mono); font-size:11px; color:var(--text-dim); flex:none;}
  .notify-ack{
    background:var(--panel-2); border:1px solid var(--line); border-radius:50%; width:28px; height:28px;
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer; flex:none; padding:0;
  }
  .notify-ack:hover{color:var(--in); border-color:var(--in);}

  .toolbar{display:flex; gap:8px; margin-bottom:16px; align-items:center;}
  input[type=text], input[type=search], select, textarea{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius: var(--radius); padding:11px 12px; font-family:var(--display); font-size:14px; width:100%;
  }
  textarea{resize:vertical; min-height:44px; overflow:hidden;}
  .script-textarea{
    font-family:var(--mono); font-size:12.5px; line-height:1.6; min-height:400px; max-height:55vh;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:11px 12px; width:100%; white-space:pre-wrap; word-wrap:break-word;
    outline:none; overflow-y:auto; color:var(--text);
  }
  .script-textarea:focus{outline:2px solid var(--amber); outline-offset:1px;}
  .script-toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  .script-toolbar-label{font-family:var(--mono); font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em;}
  .script-hint{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:10px;}

  .budget-modal{max-width:420px;}
  .budget-row{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:8px 10px; margin-bottom:8px;}
  .budget-row-fixed{background:var(--panel-2);}
  .budget-row-main{display:flex; align-items:center; gap:6px;}
  .budget-chevron{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:12px; width:18px; flex:none; padding:0;}
  .budget-chevron-spacer{width:18px; flex:none;}
  input.budget-label{flex:1; min-width:0; border:none; background:transparent; font-size:13px; font-weight:600; padding:4px 2px; color:var(--text); width:100%; border-radius:0;}
  .budget-label:focus{outline:none;}
  .budget-label-static{flex:1; font-size:13px; font-weight:600;}
  .budget-amount{
    width:88px; flex:none; border:1px solid var(--line); border-radius:6px; background:var(--bg);
    padding:5px 6px; font-family:var(--mono); font-size:12.5px; text-align:right;
  }
  .budget-amount-computed{width:88px; flex:none; text-align:right; font-family:var(--mono); font-size:12.5px; font-weight:700;}
  input.budget-details{
    width:100%; border:none; border-top:1px dashed var(--line); background:transparent; border-radius:0;
    font-size:12px; color:var(--text-dim); padding:6px 2px 2px; margin-top:4px;
  }
  .budget-details:focus{outline:none;}
  .budget-subitems{margin-top:8px; padding-left:24px; display:flex; flex-direction:column; gap:6px;}
  .budget-subitems-title{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim); margin-bottom:2px;}
  .budget-daytoggle{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-top:6px; cursor:pointer;}
  .budget-daytoggle input{margin:0;}
  .budget-op-fields{display:flex; gap:8px; margin-top:8px;}
  .budget-op-field{flex:1; min-width:0;}
  .budget-op-field label{display:block; font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim); margin-bottom:3px;}
  .budget-op-field input{
    width:100%; border:1px solid var(--line); border-radius:6px; background:var(--bg);
    padding:6px 7px; font-family:var(--mono); font-size:12.5px; text-align:center;
  }
  .budget-readonly-display{
    width:100%; border:1px solid var(--line); border-radius:6px; background:var(--panel-2);
    padding:6px 7px; font-family:var(--mono); font-size:12.5px; text-align:center; color:var(--text-dim);
    box-sizing:border-box;
  }
  .budget-subitem{display:flex; align-items:center; gap:6px;}
  .budget-subitem-op{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:8px; margin-bottom:4px;}
  .budget-subitem-row1{display:flex; align-items:center; gap:6px;}
  .budget-subitem-row2{display:flex; align-items:center; gap:6px; margin-top:6px;}
  .budget-subitem-row2 .budget-subamount{width:64px;}
  .budget-subitem-row2 .dfield{padding:7px 8px; font-size:12px;}
  .budget-sublabel{flex:1; min-width:0; border:1px solid var(--line); border-radius:6px; background:var(--bg); padding:5px 8px; font-size:12.5px;}
  .budget-subamount{width:80px; flex:none; border:1px solid var(--line); border-radius:6px; background:var(--bg); padding:5px 6px; font-family:var(--mono); font-size:12px; text-align:right;}
  .budget-subdays{width:52px; flex:none; border:1px solid var(--line); border-radius:6px; background:var(--bg); padding:5px 4px; font-family:var(--mono); font-size:12px; text-align:center;}
  .budget-subtotal{font-family:var(--mono); font-size:12px; color:var(--text-dim); text-align:right; margin:-4px 0 14px;}
  .budget-total{display:flex; justify-content:space-between; align-items:center; font-size:16px; font-weight:800; padding:12px 4px; border-top:2px solid var(--text); margin:10px 0 4px;}

  .shotlist-modal{max-width:900px !important;}
  .modal-bg.side-right .shotlist-modal, .modal-bg.side-left .shotlist-modal{width:min(900px, calc(100vw - 60px)) !important;}
  .sl-tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); -webkit-overflow-scrolling:touch;}
  .sl-table{border-collapse:collapse; width:100%;}
  .sl-table td.sl-donecell{text-align:center; vertical-align:middle;}
  .sl-table td.sl-donecell input{width:18px; height:18px; margin:0; cursor:pointer;}
  .sl-table th{
    text-align:left; font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--text-dim); background:var(--panel-2); padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  .sl-table td{padding:5px; border-bottom:1px solid var(--line); vertical-align:top;}
  .sl-input{
    width:130px; border:1px solid var(--line); border-radius:6px; background:var(--panel);
    padding:6px 7px; font-family:var(--display); font-size:12.5px; box-sizing:border-box;
  }
  .sl-hint{font-family:var(--mono); font-size:9.5px; color:var(--out); margin-top:3px; width:130px;}
  .sched-day{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:14px;}
  .sched-day-head{display:flex; align-items:baseline; gap:8px; margin-bottom:10px;}
  .sched-bar{display:flex; height:14px; border-radius:7px; overflow:hidden; margin:12px 0 10px; border:1px solid var(--line);}
  .sched-seg{background:var(--amber); border-right:1px solid var(--bg); min-width:2px;}
  .sched-seg:nth-child(odd){background:var(--pre);}
  .sched-seg-lunch{background:repeating-linear-gradient(45deg, var(--yellow), var(--yellow) 4px, var(--panel) 4px, var(--panel) 8px) !important;}
  .sched-list{display:flex; flex-direction:column; gap:6px;}
  .sched-item-wrap{display:flex; flex-direction:column;}
  .sched-item{display:flex; align-items:baseline; justify-content:space-between; gap:8px; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:7px 10px;}
  .sched-item.sched-lunch{background:rgba(217,164,4,0.12); border-color:var(--yellow); border-style:dashed;}
  .sched-item.sched-drive{background:rgba(9,124,124,0.1); border-color:var(--in);}
  .sched-seg-drive{background:repeating-linear-gradient(45deg, var(--in), var(--in) 3px, var(--panel) 3px, var(--panel) 6px) !important;}
  .sched-shooter-badge{font-family:var(--mono); font-size:10px; font-weight:700; color:var(--pre); background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:1px 6px; margin-left:6px;}
  .sched-other-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .sched-cc-block{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:18px;}
  .sched-cc-line{font-size:13px; line-height:1.6;}
  .sched-cc-line + .sched-cc-line{margin-top:4px;}
  .sched-item-scene{font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sched-item-meta{font-family:var(--mono); font-size:11px; color:var(--text-dim); flex:none;}
  .sched-info-box{
    font-family:var(--mono); font-size:11px; color:var(--text); background:var(--panel-2);
    border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-top:4px;
  }
  .sched-morning{display:flex; flex-direction:column; gap:6px;}
  .sched-morning .sched-item-meta{font-weight:700; color:var(--text);}
  .timeline-hint{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:14px;}
  .meeting-row{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:10px; margin-bottom:10px;}
  .loc-row{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:10px; margin-bottom:10px;}
  .loc-row-head{display:flex; align-items:baseline; gap:8px; margin-bottom:8px;}
  .loc-day{font-weight:700; font-size:13px;}
  .loc-date{font-family:var(--mono); font-size:11px; color:var(--text-dim);}
  .loc-label{display:block; font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim); margin:6px 0 3px;}
  .loc-scene-select{width:100%; border:1px solid var(--line); border-radius:6px; background:var(--bg); padding:8px 6px; font-size:12.5px;}
  .loc-entry{background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px;}
  .loc-entry-top{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .loc-entry-top select, .loc-entry-top input{flex:1;}
  .loc-scene-input, .loc-address{width:100%; border:1px solid var(--line); border-radius:6px; background:var(--bg); padding:8px 10px; font-size:12.5px; box-sizing:border-box;}
  .meeting-row-top{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .meeting-row-top .dfield{flex:1;}
  .meeting-row textarea{width:100%;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--amber); outline-offset:1px;}
  .gantt-modal{max-width:900px;}
  .modal-bg.side-right .gantt-modal, .modal-bg.side-left .gantt-modal{width:min(900px, calc(100vw - 60px)) !important;}
  .gantt-auto-btns{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .gantt-body{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); -webkit-overflow-scrolling:touch;}
  .gantt-inner{position:relative;}
  .gantt-axis-row{display:flex; position:sticky; top:0; z-index:3; background:var(--panel-2); border-bottom:1px solid var(--line);}
  .gantt-axis-spacer{width:110px; flex:none; position:sticky; left:0; background:var(--panel-2); z-index:4; border-right:1px solid var(--line);}
  .gantt-axis-days{display:flex;}
  .gantt-axis-day{
    flex:none; text-align:center; font-family:var(--mono); font-size:9px; color:var(--text-dim);
    padding:6px 2px; border-right:1px dashed var(--line); white-space:nowrap; overflow:hidden;
  }
  .gantt-rows{position:relative;}
  .gantt-row{display:flex; border-bottom:1px solid var(--line); cursor:pointer;}
  .gantt-row:hover .gantt-row-label{background:var(--panel-2);}
  .gantt-row-label{
    width:110px; flex:none; position:sticky; left:0; background:var(--panel); z-index:2; border-right:1px solid var(--line);
    padding:0 10px; font-size:11.5px; font-weight:600; display:flex; align-items:center;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .gantt-row-track{position:relative; height:34px; flex:none;}
  .gantt-marker{
    position:absolute; top:50%; transform:translate(-50%,-50%); width:12px; height:12px; border-radius:50%;
    border:2px solid var(--bg); box-sizing:border-box;
  }
  .gantt-marker.status-prod{box-shadow:0 0 0 2px var(--out);}
  .gantt-marker.status-wrap{box-shadow:0 0 0 2px var(--in);}
  .gantt-marker.status-wip{box-shadow:0 0 0 2px var(--yellow);}
  .gantt-bar{position:absolute; top:50%; transform:translateY(-50%); height:14px; border-radius:7px; opacity:0.85;}
  .gantt-bar.status-prod{box-shadow:0 0 0 2px var(--out) inset;}
  .gantt-bar.status-wrap{box-shadow:0 0 0 2px var(--in) inset;}
  .gantt-bar.status-wip{box-shadow:0 0 0 2px var(--yellow) inset;}
  .gantt-bar-ghost{
    position:absolute; top:50%; transform:translateY(-50%); height:14px; border-radius:7px;
    background:transparent; border:2px dashed var(--text-dim); box-sizing:border-box; opacity:0.7;
  }
  .gantt-delay-marker{
    position:absolute; top:2px; bottom:2px; width:0; border-left:2px dashed var(--out); z-index:2; transform:translateX(-1px);
  }
  .gantt-today-line{position:absolute; top:0; bottom:0; width:0; border-left:2px dashed var(--amber); z-index:1;}
  .gantt-today-label{
    position:absolute; top:-2px; left:4px; background:var(--amber); color:#181818; font-family:var(--mono);
    font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; padding:1px 5px; border-radius:4px; white-space:nowrap;
  }
  .btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:var(--radius); padding:11px 16px; font-family:var(--display); font-weight:600; font-size:14px;
    cursor:pointer; white-space:nowrap;
  }
  .btn:active{transform:scale(0.98);}
  .btn.primary{background:var(--amber); color:#181818; border-color:var(--amber);}
  .btn.ghost{background:transparent;}
  .btn.full{width:100%;}
  .btn.danger{color:var(--out); border-color:var(--out); background:transparent;}
  .btn.small{padding:7px 11px; font-size:12px;}
  .sq-btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:var(--radius); width:38px; height:38px; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; padding:0;
  }
  .sq-btn:active{transform:scale(0.96);}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:10px; display:flex; align-items:flex-start; gap:12px; cursor:pointer;
  }
  .card:active{background:var(--panel-2);}
  .dot{width:10px;height:10px;border-radius:50%; flex:none; margin-top:4px;}
  .dot.pre{background:var(--pre); box-shadow:0 0 7px 1px rgba(201,130,30,0.55);}
  .dot.prod{background:var(--out); box-shadow:0 0 7px 1px rgba(214,0,28,0.55);}
  .dot.post{background:var(--amber); box-shadow:0 0 7px 1px rgba(0,156,222,0.55);}
  .dot.wrap{background:var(--in); box-shadow:0 0 7px 1px rgba(39,93,56,0.55);}
  .dot.wip{background:var(--yellow); box-shadow:0 0 7px 1px rgba(217,164,4,0.55);}
  .dot.none{background:var(--text-dim); box-shadow:none;}
  .dot.blank{background:transparent; box-shadow: inset 0 0 0 2px var(--text-dim);}
  .card-body{flex:1; min-width:0;}
  .card-name{font-weight:700; font-size:15px; margin-bottom:3px; display:flex; align-items:center; gap:6px;}
  .card-meta{font-family:var(--mono); font-size:12px; color:var(--text-dim); display:flex; gap:8px; flex-wrap:wrap;}
  .tag-chip{background:var(--panel-2); border-radius:5px; padding:1px 6px; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em;}
  .tag-chip.pre{background:rgba(201,130,30,0.16); color:var(--pre);}
  .tag-chip.prod{background:rgba(214,0,28,0.16); color:var(--out);}
  .tag-chip.post{background:rgba(0,156,222,0.16); color:var(--amber);}
  .tag-chip.wrap{background:rgba(39,93,56,0.16); color:var(--in);}
  .tag-chip.wip{background:rgba(217,164,4,0.16); color:var(--yellow);}
  .tag-chip.blank{background:var(--panel-2); color:var(--text-dim);}
  .card-loc{font-size:13px; color:var(--text); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .card-side{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none;}
  .card-time{font-family:var(--mono); font-size:11px; color:var(--text-dim);}

  .empty{text-align:center; padding:60px 20px; color:var(--text-dim); font-family:var(--mono); font-size:13px;}

  .back{
    display:inline-flex; align-items:center; gap:6px; color:var(--text-dim); font-family:var(--mono);
    font-size:12px; text-decoration:none; margin-bottom:16px; cursor:pointer; background:none; border:none; padding:0;
  }

  .detail-header{display:flex; align-items:center; gap:14px; margin-bottom:22px;}
  .tally-big{width:16px;height:16px;border-radius:50%; flex:none;}
  .tally-big.pre{background:var(--pre); box-shadow:0 0 14px 3px rgba(201,130,30,0.6);}
  .tally-big.prod{background:var(--out); box-shadow:0 0 14px 3px rgba(214,0,28,0.6);}
  .tally-big.post{background:var(--amber); box-shadow:0 0 14px 3px rgba(0,156,222,0.6);}
  .tally-big.wrap{background:var(--in); box-shadow:0 0 14px 3px rgba(39,93,56,0.6);}
  .tally-big.wip{background:var(--yellow); box-shadow:0 0 14px 3px rgba(217,164,4,0.6);}
  .tally-big.none{background:var(--text-dim); box-shadow:none;}
  .tally-big.blank{background:transparent; box-shadow: inset 0 0 0 2.5px var(--text-dim);}
  .detail-title h2{margin:0 0 3px 0; font-size:22px; font-weight:800;}
  .detail-title .status-word{font-family:var(--mono); font-size:12px; letter-spacing:0.1em; text-transform:uppercase;}
  .client-line{font-size:13px; color:var(--text-dim); margin-top:2px;}
  .status-word.pre{color:var(--pre);} .status-word.prod{color:var(--out);}
  .status-word.post{color:var(--amber);} .status-word.wrap{color:var(--in);} .status-word.none{color:var(--text-dim);}

  .deadline-item.status-wip{border-left-color:var(--yellow);}
  .deadline-item.status-wip .deadline-days{color:var(--yellow);}

  .deadline-item.done .deadline-days{color:var(--in);}
  .deadline-days{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--pre); flex:none; min-width:70px;}
  .deadline-title{font-size:13px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .stat-label{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim);}
  .stat-value{font-family:var(--mono); font-size:19px; font-weight:700; margin-top:4px; color:var(--text);}
  .stat-value.warn{color:var(--pre);}
  .stat-value.late{color:var(--out);}
  .stat-value.unset{color:var(--text-dim); font-weight:400; font-size:14px;}
  .stat-date{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:2px;}

  .section-label{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); margin:22px 0 10px 0; display:flex; justify-content:space-between; align-items:center;}
  .current-loc-box{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; font-size:15px; font-weight:600; line-height:1.4;}
  .current-loc-box .ts{font-family:var(--mono); font-weight:400; font-size:11px; color:var(--text-dim); margin-top:6px;}

  .note-history{margin-top:10px;}
  .note-history summary{cursor:pointer; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); padding:6px 0; list-style:none;}
  .note-history summary::-webkit-details-marker{display:none;}
  .note-history summary::before{content:'▸'; display:inline-block; margin-right:6px; transition:transform 0.15s;}
  .note-history[open] summary::before{transform:rotate(90deg);}
  .note-history-list{padding:6px 0 2px;}
  .note-history-item{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; margin-bottom:8px; font-size:13px;}
  .nh-meta{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px;}
  .nh-text{color:var(--text);}
  .nh-empty{font-family:var(--mono); font-size:11px; color:var(--text-dim); padding:4px 0;}

  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:9px 14px; font-size:13px; cursor:pointer; color:var(--text);}
  .chip.selected{background:var(--amber); color:#181818; border-color:var(--amber); font-weight:700;}

  .segmented{display:inline-flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; flex:none;}
  .segmented button{
    background:var(--panel); border:none; border-right:1px solid var(--line); color:var(--text-dim);
    width:38px; height:38px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  .segmented button:last-child{border-right:none;}
  .segmented button.active{background:var(--amber); color:#181818;}

  .contents-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:11px 12px; margin-bottom:8px;
  }
  .contents-row .name{font-size:14px; font-weight:600; flex:1; min-width:0;}
  .contents-row .name small{display:block; font-family:var(--mono); font-weight:400; font-size:11px; color:var(--text-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .contents-row.tracked{cursor:pointer;}
  .contents-row.tracked:active{background:var(--panel-2);}
  .contents-row.row-done{background:rgba(39,93,56,0.08); border-color:rgba(39,93,56,0.35);}
  .contents-row.row-done small{color:rgba(39,93,56,0.75) !important;}
  .contents-row.row-hidden{opacity:0.55; border-style:dashed;}

  .icon-btn{background:none;border:none;color:var(--text-dim); cursor:pointer; font-family:var(--mono); font-size:11px; padding:4px 8px; border:1px solid var(--line); border-radius:6px;}

  .mo-btn{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    width:30px; height:30px; flex:none; display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0; color:var(--text-dim);
  }
  .mo-btn:hover{border-color:var(--amber); color:var(--amber);}
  .step-actions{display:flex; align-items:center; gap:6px; flex:none;}
  .dot-btn{background:none; border:none; padding:8px 4px; margin:-8px -4px -8px 0; cursor:pointer; display:flex; align-items:center; justify-content:center;}

  /* moodboard editor */
  .mboard-toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid var(--line);}
  .mboard-title{font-weight:800; font-size:16px;}
  .mboard-hint{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:10px; min-height:2.4em;}
  .mboard-wrap{
    overflow:hidden; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--panel); height:65vh; position:relative; touch-action:none; cursor:grab;
  }
  .mboard-wrap.panning{cursor:grabbing;}
  .mboard-canvas{
    position:absolute; top:0; left:0; width:1300px; height:950px;
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 22px 22px;
    will-change: transform; touch-action:none;
  }
  .mboard-empty{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-family:var(--mono); font-size:12.5px; text-align:center; padding:20px;
    pointer-events:none;
  }
  .mboard-canvas.placing{cursor:crosshair;}
  .mboard-canvas.drawing{cursor:crosshair;}
  .mboard-ink{position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:visible;}
  .pen-panel{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:10px;}
  .pen-swatches{display:flex; gap:10px;}
  .pen-swatch{
    width:28px; height:28px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0;
    box-shadow:0 1px 2px rgba(0,0,0,0.15);
  }
  .pen-swatch.active{border-color:var(--text); box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--text);}
  .clear-swatch{background:var(--panel); color:var(--text-dim); display:flex; align-items:center; justify-content:center;}
  .pen-sizes{display:flex; align-items:center; gap:8px;}
  .pen-size{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--panel);
    cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center;
  }
  .pen-size span{border-radius:50%; background:var(--text); display:block;}
  .pen-size.active{border-color:var(--amber); background:var(--panel-2);}
  .mobj{position:absolute; box-sizing:border-box; border:1.5px solid transparent; touch-action:none;}
  .mobj.selected{border-color:var(--amber);}
  .mobj img{width:100%; height:100%; display:block; object-fit:cover; border-radius:3px; pointer-events:none;}
  .mobj-text{
    width:100%; height:100%; overflow:hidden; word-break:break-word; outline:none;
    font-family:var(--display); line-height:1.3; padding:2px;
  }
  .mobj-del{
    position:absolute; top:-11px; right:-11px; width:22px; height:22px; border-radius:50%;
    background:var(--out); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:14px; line-height:1; cursor:pointer; border:2px solid var(--bg); z-index:5;
  }
  .mobj-handle{
    position:absolute; right:-7px; bottom:-7px; width:15px; height:15px; border-radius:50%;
    background:var(--amber); border:2px solid var(--bg); cursor:nwse-resize; z-index:5;
  }

  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:20; overflow-y:auto;}
  .modal-bg.picker-overlay{z-index:30;}
  .modal-bg.side-left{inset:0 auto 0 0; justify-content:flex-start; align-items:stretch; background:transparent;}
  .modal-bg.side-right{inset:0 0 0 auto; justify-content:flex-end; align-items:stretch; background:transparent;}
  .modal-bg.side-left .modal, .modal-bg.side-right .modal{
    width:calc(100vw - 464px); max-width:900px; min-width:340px; height:100%; max-height:100vh; border-radius:0; margin:0; box-sizing:border-box;
  }

    .modal-bg.side-left .modal, .modal-bg.side-right .modal{ width:100vw; max-width:100vw; }
  }
  .modal-bg.side-left .modal{ box-shadow:4px 0 24px rgba(0,0,0,0.18); }
  .modal-bg.side-right .modal{ box-shadow:-4px 0 24px rgba(0,0,0,0.18); }
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:16px 16px 0 0;
    padding:20px 16px 28px 16px; width:100%; max-width:640px;
    max-height:85vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .modal h3{margin:0 0 14px 0; font-size:16px;}
  .modal.fullbleed{padding:0 16px;}

  }
  .modal-bg.inline-panel .modal{

    margin:8px 0 14px; box-shadow:none; border:1.5px solid var(--amber);
  }

  .field{margin-bottom:12px;}
  .field label{display:block; font-family:var(--mono); font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px;}
  .field-check{display:flex; align-items:center; gap:8px; font-size:13px; margin-top:4px;}
  .modal-actions{display:flex; gap:8px; margin-top:16px;}
  .field-row{display:flex; gap:8px;}

  .date-list{display:flex; flex-direction:column; gap:8px; margin-bottom:8px;}
  .date-row{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:4px 6px 4px 10px;
  }

  .day-label{
    font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--text-dim); flex:none; width:40px;

    background:var(--panel-2); border:1px solid var(--line); border-radius:50%;

    color:var(--text-dim); cursor:pointer; font-size:15px; line-height:1; padding:0;
  }
  .date-row-remove:hover{color:var(--out); border-color:var(--out);}

  .dfield{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:11px 12px; cursor:pointer; font-family:var(--mono); font-size:13px; width:100%;
  }
  .dfield:hover{border-color:var(--amber);}
  .dfield-text{color:var(--text);}
  .dfield-icon{color:var(--text-dim); flex:none;}

  .dpicker-modal{padding-top:18px; max-width:360px;}
  .dcal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .dcal-title{font-family:var(--display); font-weight:700; font-size:16px;}
  .dcal-nav{
    background:var(--panel); border:1px solid var(--line); border-radius:50%;

    font-size:17px; cursor:pointer; color:var(--text); padding:0;

  }

  .dcal-day{

    border:1.5px solid transparent;

  .dcal-day.in-range{background:rgba(0,156,222,0.18); border-radius:0;}

  .time-picker-modal{max-width:340px;}
  .time-spinner{display:flex; align-items:center; justify-content:center; gap:14px; margin:12px 0 18px;}
  .time-spin-col{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .time-spin-btn{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:13px; padding:6px 12px; line-height:1;}
  .time-spin-btn:hover{color:var(--amber);}
  input.time-spin-digit{
    font-family:var(--display); font-size:40px; font-weight:800; background:var(--panel); color:var(--text);

  .pcal-daynum{font-family:var(--display); font-size:12.5px; color:var(--text);}
  .pcal-dots{display:flex; flex-wrap:wrap; gap:2px; justify-content:center; margin-top:3px; max-width:100%;}
  .pcal-dot{width:5px; height:5px; border-radius:50%; flex:none;}
  .pcal-more{font-family:var(--mono); font-size:8px; color:var(--text-dim);}

  .cal-legend{display:flex; flex-wrap:wrap; gap:10px 14px; margin-bottom:14px;}
  .cal-legend-item{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-dim); font-family:var(--mono);}
  .cal-legend-dot{width:8px; height:8px; border-radius:50%; flex:none;}

  .cal-events-list{display:flex; flex-direction:column; gap:8px;}

  .cal-event-project{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:2px;}

  .toast{position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--in); color:#ffffff; padding:10px 18px; border-radius:8px; font-weight:700; font-size:13px; z-index:30; box-shadow:0 4px 14px rgba(0,0,0,0.3);}
  .toast.err{background:var(--out); color:#fff;}
  .loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-family:var(--mono); font-size:13px;}

  .bottomnav{
    position:sticky; bottom:0; left:0; right:0; margin:24px -16px 0;

    border-top:2px solid transparent; margin-top:-1px; line-height:1.3;
  }
  .navtab.active{color:var(--text); font-weight:700; border-top-color:var(--amber);}

  /* ===== Equipment tracker (merged) ===== */

  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Archivo:wght@500;600;700;800&display=swap');

  .topbar{

// Backs window.storage with Supabase's REST API (PostgREST) instead of relying on Claude's
// injected storage bridge — this is what makes the app work standalone on GitHub Pages/anywhere
// else, not just inside a Claude artifact. Same key-value interface (get/set/delete/list) as
// before, so nothing else in this file needs to know or care where storage actually lives.
// Everyone using this hosted copy shares the same table (no per-user login), matching how the
// app has always behaved — "shared" is accepted for interface compatibility but not otherwise used.
//
// Requires this table in your Supabase project (SQL Editor):
//   create table kv_store (
//     key text primary key,
//     value text,
//     shared boolean default true,
//     updated_at timestamptz default now()
//   );
//   alter table kv_store enable row level security;
//   create policy "public read/write" on kv_store for all using (true) with check (true);
(function(){
  const SUPABASE_URL = 'https://bpaipvdivzyqzvyiqrra.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwYWlwdmRpdnp5cXp2eWlxcnJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyODYyOTEsImV4cCI6MjEwNDg2MjI5MX0.Eb-H2c6wwyk1n9QjzZHaIXKppanWBs9ZvOWGqkJV4EE';

      const rows = await res.json();
      if(!rows.length) return null;
      return { key, value: rows[0].value, shared: shared !== false };

    async set(key, value, shared){
      const res = await fetch(REST_URL, {
        method: 'POST',
        headers: Object.assign({}, baseHeaders, { 'Prefer': 'resolution=merge-duplicates' }),
        body: JSON.stringify({ key, value, shared: shared !== false, updated_at: new Date().toISOString() }),

      return { key, value, shared };

      const res = await fetch(`${REST_URL}?key=eq.${encodeURIComponent(key)}`, { method: 'DELETE', headers: baseHeaders });
      if(!res.ok) throw new Error('Storage delete failed: ' + res.status + ' ' + (await res.text()));
      return { key, deleted: true, shared };

      if(!res.ok) throw new Error('Storage list failed: ' + res.status + ' ' + (await res.text()));
      const rows = await res.json();
      return { keys: rows.map(r => r.key), prefix, shared };

// wraps window.storage with automatic retries — "Unexpected response type" / transient failures
// from the storage bridge happen occasionally, especially right after page load; retrying a
// couple of times with a short backoff resolves most of them without the user ever seeing it.
// Every existing call site in this file keeps calling window.storage.get/set/list/delete exactly
// as before — this only changes what those calls do underneath. Methods are rebound in place
// (not replacing the whole object) so any internal state the real implementation keeps on itself
// stays intact — replacing the object wholesale broke that in testing.
//
// Kept deliberately SHORT per call (a few hundred ms) — init() makes ~20 sequential storage calls
// (load projects, load entities, ~15 image saves for the example project, equipment cleanup), and
// giving each one its own long retry chain compounds into a multi-minute hang if the bridge is
// slow to start. waitForStorageReady() below handles the slow-start case once, up front — and
// calls the RAW (unwrapped) function directly, not this wrapped version, so its own retry loop
// never stacks on top of this one's. Nesting two retry loops previously multiplied out to several
// minutes worst-case, which is what caused the diagnostics tool (and startup itself) to hang.
window.__rawStorageGet = null;
(function(){
  if(!window.storage) return;
  const rawGet = window.storage.get ? window.storage.get.bind(window.storage) : null;
  const rawSet = window.storage.set ? window.storage.set.bind(window.storage) : null;
  const rawDelete = window.storage.delete ? window.storage.delete.bind(window.storage) : null;
  const rawList = window.storage.list ? window.storage.list.bind(window.storage) : null;

    ]);

    // a brand-new, never-before-used artifact's storage backend can need a moment to "warm up" —
    // its very first calls fail even though later calls in the same load (once warmed) succeed.
    // 5 attempts with backoff covers that cold-start window without reintroducing the nested-retry
    // bug from before (this is still the only retry loop — no separate readiness check on top).
    attempts = attempts || 5;
    let lastErr;
    for(let i = 0; i < attempts; i++){
      try{ return await withTimeout(fn(), 4000); }
      catch(e){
        lastErr = e;
        if(i < attempts - 1) await new Promise(r => setTimeout(r, 400 * (i + 1)));
      }
    }

  if(rawDelete) window.storage.delete = (key, shared) => withRetry(() => rawDelete(key, shared));

async function waitForStorageReady(){
  const rawGet = window.__rawStorageGet;
  if(!rawGet) return true;
  const maxAttempts = 6;

      await Promise.race([
        rawGet('__storage_ready_probe__', true),
        new Promise((_, reject) => setTimeout(() => reject(new Error('probe timed out')), 4000)),
      ]);
      return true;
    }catch(e){
      if(i < maxAttempts - 1) await new Promise(r => setTimeout(r, Math.min(500 * Math.pow(1.6, i), 2500)));
    }
  }

}

// parses screenplay scene headers like "INT. DAY. DAVES WAREHOUSE." into {label, location}
function parseScriptScenes(scriptText){
  if(!scriptText) return [];
  const scenes = [];
  const seen = new Set();
  scriptText.split('\n').forEach(line => {
    const trimmed = line.trim();
    const m = trimmed.match(/^(INT|EXT|INT\/EXT)\.?\s*([^.]+)\.\s*(.+?)\.?$/i);
    if(m){
      const label = trimmed.replace(/\.$/, '');
      if(!seen.has(label)){
        seen.add(label);
        scenes.push({ label, location: m[3].trim() });
      }
    }
  });
  return scenes;
}

function fmtMoney(n){
  const num = Number(n) || 0;
  return '£' + num.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function budgetRowAmount(row){
  const useDays = row.useDays !== false;
  if(row.items && row.items.length){
    return row.items.reduce((s,it) => s + (parseFloat(it.amount) || 0) * (useDays ? (parseFloat(it.days) || 1) : 1), 0);
  }
  return (parseFloat(row.amount) || 0) * (useDays ? (parseFloat(row.days) || 1) : 1);
}
function operatorDays(op){
  return (op.items && op.items.length)
    ? op.items.reduce((s,it) => s + (parseFloat(it.days) || 0), 0)
    : (parseFloat(op.days) || 0);
}
function operatorSubtotal(op){
  return operatorDays(op) * (parseFloat(op.rate) || 0) * (parseFloat(op.count) || 0);
}
function budgetTotal(budget){
  if(!budget) return 0;
  const opsTotal = (budget.operators || []).reduce((s,op) => s + operatorSubtotal(op), 0);
  const rowsTotal = (budget.rows || []).reduce((s,r) => s + budgetRowAmount(r), 0);
  return opsTotal + rowsTotal;
}
// a readable, itemized breakdown of a budget — used to auto-suggest the Brief's Fees field
function budgetBreakdownText(budget){
  const lines = [];
  (budget.operators || []).forEach(op => {
    const amount = operatorSubtotal(op);
    if(!amount) return;
    const days = operatorDays(op);
    lines.push(`${op.role || 'Operator'}: ${days} day${days===1?'':'s'} × ${fmtMoney(op.rate)} × ${op.count||0} = ${fmtMoney(amount)}`);
    if(op.items && op.items.length){
      op.items.forEach(it => {
        if(!it.label && !it.days) return;
        const when = it.date ? ` (${fmtDate(it.date)})` : '';
        lines.push(`   - ${it.label || 'Day'}: ${it.days || 0} day${it.days==1?'':'s'}${when}`);
      });
    }
  });
  (budget.rows || []).forEach(r => {
    const amount = budgetRowAmount(r);
    if(!amount) return;
    lines.push(`${r.label || 'Item'}: ${fmtMoney(amount)}`);
  });
  if(!lines.length) return '';
  lines.push('');
  lines.push(`Total: ${fmtMoney(budgetTotal(budget))}`);
  return lines.join('\n');
}

// supports multiple, non-consecutive shoot days (e.g. two separate weekends).
// falls back to the old single-range shootStart/shootEnd fields for projects saved before this existed.
function getShootDates(p){
  if(Array.isArray(p.shootDates)) return p.shootDates.filter(Boolean).slice().sort();
  if(p.shootStart){
    if(p.shootEnd && p.shootEnd !== p.shootStart){
      const dates = [];
      let d = new Date(p.shootStart + 'T00:00:00');
      const end = new Date(p.shootEnd + 'T00:00:00');
      while(d <= end){ dates.push(d.toISOString().slice(0,10)); d.setDate(d.getDate() + 1); }
      return dates;
    }
    return [p.shootStart];
  }
  return [];
}
function nextShootDate(dates){
  if(!dates.length) return null;
  const todayStr = new Date().toISOString().slice(0,10);
  const upcoming = dates.filter(d => d >= todayStr).sort();
  if(upcoming.length) return upcoming[0];
  return dates.slice().sort().slice(-1)[0];
}
// groups consecutive days into ranges so two separate weekends read as "Aug 2-3, Aug 9-10"
function formatShootDates(dates){
  if(!dates.length) return 'Not set';
  const sorted = dates.slice().sort();
  const groups = [];
  let start = sorted[0], prev = sorted[0];
  for(let i = 1; i < sorted.length; i++){
    const cur = sorted[i];
    const diff = Math.round((new Date(cur+'T00:00:00') - new Date(prev+'T00:00:00')) / 86400000);
    if(diff === 1){ prev = cur; continue; }
    groups.push([start, prev]);
    start = cur; prev = cur;
  }
  groups.push([start, prev]);
  return groups.map(([s,e]) => s === e ? fmtDate(s) : fmtDate(s) + '–' + fmtDate(e)).join(', ');
}

// auto-adds the wedding preset's equipment to a project's Equipment lists step for any newly
// added shoot day (wedding projects only), and tags those entities as "Used in Project" for it
function applyWeddingPresetForNewDays(project, newDays){
  if(project.projectType !== 'wedding' || !newDays.length) return false;
  const step = (project.steps || []).find(isEquipmentListsStep);
  if(!step) return false;
  const matches = ENTITIES.filter(e => (GEAR_PRESETS.wedding || []).includes(e.name));
  if(!matches.length) return false;
  if(!step.equipmentByDay) step.equipmentByDay = {};
  newDays.forEach(day => {
    if(!step.equipmentByDay[day]) step.equipmentByDay[day] = [];
    matches.forEach(e => {
      if(!step.equipmentByDay[day].some(x => normalizeEquipEntry(x).id === e.id)) step.equipmentByDay[day].push({ id: e.id, qty: 1 });
      if(!e.schedule) e.schedule = [];
      const exists = e.schedule.some(s => s.projectId === project.id && s.stepId === step.id && s.startDate === day);
      if(!exists) e.schedule.push({ id: uid(), location:'Used in Project', startDate:day, endDate:day, projectId:project.id, stepId:step.id });
    });
  });
  touchStep(step);
  return true;
}

// custom calendar popover, styled as a rounded card matching the app's modal system.
// updates the trigger's hidden input + visible text on Done.
function openDatePicker(triggerEl){
  const hidden = triggerEl.querySelector('input[type=hidden]');
  const base = hidden.value ? new Date(hidden.value + 'T00:00:00') : new Date();
  let viewYear = base.getFullYear();
  let viewMonth = base.getMonth();
  let selected = hidden.value || null;

  const bg = document.createElement('div');
  bg.className = 'modal-bg picker-overlay';
  bg.innerHTML = `
    <div class="modal dpicker-modal">
      <div id="dpickerCal"></div>
      <div class="modal-actions">
        <button class="btn ghost small" id="dpToday">Today</button>
        <button class="btn ghost small" id="dpClear">Clear</button>
        <button class="btn primary" id="dpDone" style="flex:1;">Done</button>
      </div>
    </div>`;
  document.body.appendChild(bg);

  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function renderCal(){
    const el = bg.querySelector('#dpickerCal');
    const first = new Date(viewYear, viewMonth, 1);
    const startWeekday = first.getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
    const todayISO = new Date().toISOString().slice(0,10);

    let cells = '';
    for(let i = startWeekday - 1; i >= 0; i--) cells += `<div class="dcal-day dim">${daysInPrevMonth - i}</div>`;
    for(let d = 1; d <= daysInMonth; d++){
      const iso = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const cls = ['dcal-day'];
      if(iso === selected) cls.push('sel');
      else if(iso === todayISO) cls.push('today');
      cells += `<div class="${cls.join(' ')}" data-date="${iso}">${d}</div>`;
    }
    const trailing = (7 - ((startWeekday + daysInMonth) % 7)) % 7;
    for(let d = 1; d <= trailing; d++) cells += `<div class="dcal-day dim">${d}</div>`;

    el.innerHTML = `
      <div class="dcal-header">
        <button type="button" class="dcal-nav" id="dpPrev" aria-label="Previous month">&#8249;</button>
        <div class="dcal-title">${MONTH_NAMES[viewMonth]} ${viewYear}</div>
        <button type="button" class="dcal-nav" id="dpNext" aria-label="Next month">&#8250;</button>
      </div>
      <div class="dcal-weekdays"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>
      <div class="dcal-grid">${cells}</div>`;

    el.querySelectorAll('.dcal-day[data-date]').forEach(cell => {
      cell.addEventListener('click', () => { selected = cell.dataset.date; renderCal(); });
    });
    el.querySelector('#dpPrev').addEventListener('click', () => {
      viewMonth--; if(viewMonth < 0){ viewMonth = 11; viewYear--; } renderCal();
    });
    el.querySelector('#dpNext').addEventListener('click', () => {
      viewMonth++; if(viewMonth > 11){ viewMonth = 0; viewYear++; } renderCal();
    });
  }
  renderCal();

  bg.addEventListener('click', ev => { if(ev.target === bg) bg.remove(); });
  bg.querySelector('#dpToday').addEventListener('click', () => {
    const t = new Date();
    viewYear = t.getFullYear(); viewMonth = t.getMonth();
    selected = t.toISOString().slice(0,10);
    renderCal();
  });
  bg.querySelector('#dpClear').addEventListener('click', () => { selected = null; renderCal(); });
  bg.querySelector('#dpDone').addEventListener('click', () => {
    hidden.value = selected || '';
    triggerEl.querySelector('.dfield-text').textContent = selected ? fmtDate(selected) : 'Select date';
    hidden.dispatchEvent(new Event('change', { bubbles: true }));
    bg.remove();
  });
}

        <button class="btn primary" id="dprDone" style="flex:1;">Done</button>
      </div>
    </div>`;
  document.body.appendChild(bg);

  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function hintText(){
    if(rangeStart && rangeEnd) return `${fmtDate(rangeStart)} – ${fmtDate(rangeEnd)}`;
    if(rangeStart) return `${fmtDate(rangeStart)} — now tap an end date`;
    return 'Tap a start date';
  }
  function renderCal(){
    bg.querySelector('#dprHint').textContent = hintText();
    const el = bg.querySelector('#dprCal');
    const first = new Date(viewYear, viewMonth, 1);
    const startWeekday = first.getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
    const todayISO = new Date().toISOString().slice(0,10);

    let cells = '';
    for(let i = startWeekday - 1; i >= 0; i--) cells += `<div class="dcal-day dim">${daysInPrevMonth - i}</div>`;
    for(let d = 1; d <= daysInMonth; d++){
      const iso = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const cls = ['dcal-day'];
      if(rangeStart && iso === rangeStart) cls.push('range-start');
      if(rangeEnd && iso === rangeEnd) cls.push('range-end');
      if(rangeStart && rangeEnd && iso > rangeStart && iso < rangeEnd) cls.push('in-range');
      if(iso === todayISO) cls.push('today');
      cells += `<div class="${cls.join(' ')}" data-date="${iso}">${d}</div>`;
    }
    const trailing = (7 - ((startWeekday + daysInMonth) % 7)) % 7;
    for(let d = 1; d <= trailing; d++) cells += `<div class="dcal-day dim">${d}</div>`;

    el.innerHTML = `
      <div class="dcal-header">
        <button type="button" class="dcal-nav" id="dprPrev" aria-label="Previous month">&#8249;</button>
        <div class="dcal-title">${MONTH_NAMES[viewMonth]} ${viewYear}</div>
        <button type="button" class="dcal-nav" id="dprNext" aria-label="Next month">&#8250;</button>
      </div>
      <div class="dcal-weekdays"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>
      <div class="dcal-grid">${cells}</div>`;

    el.querySelectorAll('.dcal-day[data-date]').forEach(cell => {
      cell.addEventListener('click', () => {
        const clicked = cell.dataset.date;
        if(!rangeStart || (rangeStart && rangeEnd)){
          rangeStart = clicked; rangeEnd = null;
        } else if(clicked < rangeStart){
          rangeEnd = rangeStart; rangeStart = clicked;
        } else {
          rangeEnd = clicked;
        }
        renderCal();
      });
    });
    el.querySelector('#dprPrev').addEventListener('click', () => { viewMonth--; if(viewMonth < 0){ viewMonth = 11; viewYear--; } renderCal(); });
    el.querySelector('#dprNext').addEventListener('click', () => { viewMonth++; if(viewMonth > 11){ viewMonth = 0; viewYear++; } renderCal(); });
  }
  renderCal();

  bg.addEventListener('click', ev => { if(ev.target === bg) bg.remove(); });
  bg.querySelector('#dprClear').addEventListener('click', () => { rangeStart = null; rangeEnd = null; renderCal(); });
  bg.querySelector('#dprDone').addEventListener('click', () => {
    startHidden.value = rangeStart || '';

    startTriggerEl.querySelector('.dfield-text').textContent = rangeStart ? fmtDate(rangeStart) : 'Select date';
    endTriggerEl.querySelector('.dfield-text').textContent = rangeEnd ? fmtDate(rangeEnd) : 'Select date';

    endHidden.dispatchEvent(new Event('change', { bubbles: true }));
    bg.remove();
  });
}

function timeAgo(iso){
  if(!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff/60000);
  if(m < 1) return 'just now';
  if(m < 60) return m + 'm ago';
  const h = Math.floor(m/60);
  if(h < 24) return h + 'h ago';
  const d = Math.floor(h/24);
  if(d < 7) return d + 'd ago';
  return new Date(iso).toLocaleDateString();
}

// step dot: blank (untouched) -> wip/yellow (has edits) -> prod/red (date is close and not done) -> wrap/green (done)
// the step's governing deadline — endDate is the current field; date is kept as a fallback for steps saved
// before start/end dates existed, so nothing already-dated silently loses its deadline.
function stepDeadline(step){
  return step.endDate || step.startDate || step.date || '';
}
// matches by flag (new steps) or by title (steps created before the flag existed, e.g. from an older save)
function isMoodboardStep(step){
  return !!step.moodboard || (step.title || '').trim().toLowerCase() === 'conceptualising';
}
// dot color is purely deadline-driven: green once done, red inside 2 days of the deadline (including
// overdue), yellow inside 5 days, otherwise no color — regardless of whether it's been touched.
function deadlineDotClass(dateStr, done){
  if(done) return 'wrap';
  if(!dateStr) return 'blank';
  const diff = daysUntil(dateStr);
  if(diff !== null){
    if(diff <= 2) return 'prod';
    if(diff <= 5) return 'wip';
  }
  return 'blank';
}
function stepDotClass(step){
  return deadlineDotClass(stepDeadline(step), step.done);
}

// project dot follows the same rule as a step dot, rolled up across all its steps: green once every
// step is done, red if any not-done step is within 2 days of its deadline, yellow if within 5 days.
// project dot follows the same rule as a step dot, rolled up across all its steps: green once every
// step is done, red if any not-done step is within 2 days of its deadline, yellow if within 5 days —
// and green by default otherwise, since "no urgent deadline" means the project is on track.
function projectDotClass(project){
  const steps = project.steps || [];
  if(!steps.length) return 'blank';
  if(steps.every(s => s.done)) return 'wrap';
  const diffs = steps
    .filter(s => !s.done && stepDeadline(s))
    .map(s => daysUntil(stepDeadline(s)))
    .filter(d => d !== null);
  if(diffs.some(d => d <= 2)) return 'prod';
  if(diffs.some(d => d <= 5)) return 'wip';
  return 'wrap';
}

function deriveStage(project){
  const steps = project.steps || [];
  if(!steps.length) return null;
  for(const stage of STAGES){
    const next = steps.find(s => s.stage === stage.key && !s.done);
    if(next) return stage.key;
  }
  return 'wrap';
}
function deriveLatestNote(project){
  const steps = project.steps || [];
  let latest = null;
  steps.forEach(s => {
    if(s.progressNote && s.progressNote.trim()){
      if(!latest || (s.updatedAt||'') > (latest.updatedAt||'')) latest = s;
    }
  });
  return latest;
}
// steps with a date that's within 5 days (or already overdue) and not yet done — sorted most urgent first
function upcomingDeadlines(project){
  return (project.steps || [])
    .filter(s => !s.done && stepDeadline(s))
    .map(s => ({ step: s, diff: daysUntil(stepDeadline(s)) }))
    .filter(d => d.diff !== null && d.diff <= 5)
    .sort((a, b) => a.diff - b.diff);
}

// each project gets a stable color derived from its id, so the same project always looks the same
// on the calendar across sessions without needing to store a color on the project itself.
const PROJECT_COLORS = ['#009CDE','#D6001C','#275D38','#D9A404','#C9821E','#7B4B94','#0E7C7B','#B8336A','#4A6FA5','#8A9A3B','#C2542D','#5C6BC0'];
function projectColor(id){
  let hash = 0;
  for(let i = 0; i < id.length; i++){ hash = (hash * 31 + id.charCodeAt(i)) >>> 0; }
  return PROJECT_COLORS[hash % PROJECT_COLORS.length];
}
// same palette/hash, but keyed by task label — gives each distinct step/event type (e.g. "Refined
// cut", "Shoot day") a consistent color of its own, used on both the Gantt chart and a single
// project's own calendar (where every dot would otherwise be the same project color).
function taskColor(label){
  return projectColor((label || '').trim().toLowerCase());
}
// every dated event across current projects: step deadlines, shoot days, delivery dates, and crew days from the budget
function gatherCalendarEvents(){
  const events = [];
  PROJECTS.filter(p => p.status === 'current' && !p.deletedAt).forEach(p => {
    const color = projectColor(p.id);
    (p.steps || []).forEach(s => {
      const deadline = stepDeadline(s);
      if(deadline && !s.hidden){
        events.push({ date: deadline, projectId: p.id, projectName: p.name, color, label: s.title || 'Step', type: 'step', done: s.done });
      }
      if(s.budget && s.budget.operators){
        s.budget.operators.forEach(op => {
          const isCamera = (op.role||'').toLowerCase().includes('camera');
          if(isCamera) return; // camera crew days are the same as shoot days — don't double them up
          (op.items || []).forEach(it => {
            if(it.date){
              events.push({ date: it.date, projectId: p.id, projectName: p.name, color, label: `${op.role || 'Operator'} — ${it.label || 'Day'}`, type: 'crew', done: false });
            }
          });
        });
      }
      if(s.meetings){
        s.meetings.forEach(m => {
          if(m.date) events.push({ date: m.date, projectId: p.id, projectName: p.name, color, label: 'Client meeting', type: 'meeting', done: false });
        });
      }
    });
    getShootDates(p).forEach(d => {
      events.push({ date: d, projectId: p.id, projectName: p.name, color, label: 'Shoot day', type: 'shoot', done: false });
    });
    // equipment collection only precedes the FIRST day of a consecutive run of shoot days —
    // no need to re-collect gear on day 2, 3, etc. if you were already shooting the day before
    const allShootDates = new Set(getShootDates(p));
    getShootDates(p).forEach(d => {
      const prevDay = new Date(d);
      prevDay.setDate(prevDay.getDate() - 1);
      const prevIso = prevDay.toISOString().slice(0,10);
      if(allShootDates.has(prevIso)) return; // preceded by another shoot day — part of a consecutive run
      events.push({ date: prevIso, projectId: p.id, projectName: p.name, color, label: 'Equipment collection', type: 'prep', done: false });
    });
    if(p.deliveryDate){
      events.push({ date: p.deliveryDate, projectId: p.id, projectName: p.name, color, label: 'Delivery', type: 'delivery', done: false });
    }
  });
  return events;
}

// brings an older saved project up to date with steps that didn't exist when it was created —
// matches DEFAULT_STEPS by title (case-insensitive) and inserts anything missing at the position
// it would normally sit in, and renames the old "Renders" step to today's "Final render"
function migrateProjectSteps(project){
  let changed = false;
  project.steps = project.steps || [];

  project.steps.forEach(s => {
    if((s.title || '').trim().toLowerCase() === 'renders'){
      s.title = 'Final render';
      changed = true;
    }
  });

  const skip = SKIPPED_STEPS_BY_TYPE[project.projectType] || [];
  const now = new Date().toISOString();
  let insertAfterIndex = -1;
  DEFAULT_STEPS.forEach(d => {
    const key = d.title.trim().toLowerCase();
    if(skip.includes(key)) return;
    const idx = project.steps.findIndex(s => (s.title || '').trim().toLowerCase() === key);
    if(idx === -1){
      const newStep = {
        id: uid(), title: d.title, stage: d.stage, moodboard: !!d.moodboard, briefForm: !!d.briefForm, scriptForm: !!d.scriptForm,
        budgetForm: !!d.budgetForm, contractForm: !!d.contractForm, testsForm: !!d.testsForm, timelineForm: !!d.timelineForm, meetingsForm: !!d.meetingsForm, locationForm: !!d.locationForm,
        shotlistForm: !!d.shotlistForm, scheduleForm: !!d.scheduleForm, hidden:false,
        description:'', who:'', date:'', progressNote:'', done:false, meetings:[], updatedAt: now,
      };
      project.steps.splice(insertAfterIndex + 1, 0, newStep);
      insertAfterIndex++;
      changed = true;
    } else {
      insertAfterIndex = idx;
    }
  });

  // wedding projects created before the shot list template was saved as real data at project
  // creation only had it shown as a preview by the Shot list panel — never actually persisted
  // unless Save was clicked in there. Backfill it now so it's real, saved data.
  if(project.projectType === 'wedding'){
    const shotStep = project.steps.find(s => (s.title || '').trim().toLowerCase() === 'shot list');
    if(shotStep && !shotStep.shotListRows){
      shotStep.shotListRows = buildWeddingShotListRows();
      shotStep.updatedAt = now;
      changed = true;
    }
    // "Audio processing" was added to the default wedding budget after some projects already had
    // a Budget saved — buildDefaultBudget() only applies to a budget that doesn't exist yet, so an
    // existing one never picks up the new item on its own. Insert it here if it's missing.
    const budgetStep = project.steps.find(s => (s.title || '').trim().toLowerCase() === 'budget');
    if(budgetStep && budgetStep.budget && Array.isArray(budgetStep.budget.operators)){
      const editor = budgetStep.budget.operators.find(o => (o.role || '').trim().toLowerCase() === 'editor');
      if(editor && Array.isArray(editor.items) && !editor.items.some(it => (it.label||'').trim().toLowerCase() === 'audio processing')){
        const gradeIdx = editor.items.findIndex(it => (it.label||'').trim().toLowerCase() === 'colour correction, grade and render');
        const newItem = { id: uid(), label:'Audio processing', days:'1', date:'' };
        if(gradeIdx === -1) editor.items.push(newItem);
        else editor.items.splice(gradeIdx, 0, newItem);
        budgetStep.updatedAt = now;
        changed = true;
      }
    }
    // Props/Costume aren't in the wedding budget template by default anymore — drop them from an
    // existing wedding budget too, but only if genuinely untouched (nothing entered), so nothing
    // the user actually filled in ever gets removed
    if(budgetStep && budgetStep.budget && Array.isArray(budgetStep.budget.rows)){
      const isUntouched = (r) => !r.amount && !r.details && (!r.items || !r.items.length);
      const before = budgetStep.budget.rows.length;
      budgetStep.budget.rows = budgetStep.budget.rows.filter(r => {
        const label = (r.label||'').trim().toLowerCase();
        if((label === 'props' || label === 'costume') && isUntouched(r)) return false;
        return true;
      });
      if(budgetStep.budget.rows.length !== before){
        budgetStep.updatedAt = now;
        changed = true;
      }
    }
    // default wedding deliverables text, backfilled only if the Brief's deliverables are still
    // genuinely empty (never overwrites anything the user's actually written)
    const briefStep = project.steps.find(s => (s.title || '').trim().toLowerCase() === 'brief');
    if(briefStep && !(briefStep.briefData && briefStep.briefData.deliverables)){
      if(!briefStep.briefData) briefStep.briefData = { summary:'', deliverables:'', visualApproach:'', fees:'', detail:'' };
      briefStep.briefData.deliverables = '4k highlights video from day\nSpeeches can be sent on their own in full';
      briefStep.updatedAt = now;
      changed = true;
    }
  }
  return changed;
}
// Projects used to all live under one giant STORE_KEY blob. Once someone has enough projects/data,
// that single value can get too large for storage to reliably read or write ("Unexpected response
// type" / "Internal server error" from the backend) — no amount of retrying fixes that, since it's
// not transient. Fix: each project gets its own small storage key, plus a tiny index key listing
// which project ids exist. Every save/load below works per-project, so no single value can grow
// unbounded again.
const PROJECT_INDEX_KEY = 'project-index-v1';
function projectKey(id){ return 'project:' + id; }

// one-time, safety-first migration from the old single-blob format. Never deletes the old blob —
// if the old value is itself too large to read (the exact failure this is fixing), migration simply
// can't happen yet, but nothing is destroyed; the old data stays in place, untouched, in case it
// ever becomes readable again.
async function migrateToPerProjectStorage(){
  // get() on a key that has genuinely never been set has proven unreliable — it can throw
  // "Unexpected response type" instead of returning null. list() reliably reports which keys
  // actually exist, so use that as the source of truth and only call get() on keys we already
  // know are there, avoiding the unreliable case entirely wherever possible.
  let existingKeys = null;
  try{
    const listRes = await window.storage.list('', true);
    existingKeys = listRes && listRes.keys ? listRes.keys : [];
  }catch(e){ existingKeys = null; } // list() itself failed — fall back to attempting get() directly below

  const indexKnownMissing = existingKeys !== null && !existingKeys.includes(PROJECT_INDEX_KEY);
  const legacyKnownMissing = existingKeys !== null && !existingKeys.includes(STORE_KEY);

  // 1) already migrated?
  if(existingKeys === null || existingKeys.includes(PROJECT_INDEX_KEY)){
    try{
      const indexRes = await window.storage.get(PROJECT_INDEX_KEY, true);
      if(indexRes && indexRes.value) return indexRes.value;
    }catch(e){
      if(!indexKnownMissing){
        console.error('Migration: index key may exist but could not be read', e);
        return false;
      }
      // list() already confirmed this key doesn't exist — this get() failure is the known quirk,
      // not a real problem, so fall through to checking for legacy data instead
    }
  }

  // 2) legacy single-blob data to migrate?
  if(existingKeys === null || existingKeys.includes(STORE_KEY)){
    let oldRes = null;
    try{ oldRes = await window.storage.get(STORE_KEY, true); }
    catch(e){
      if(!legacyKnownMissing){
        console.error('Migration: could not read the old combined project data — leaving it untouched', e);
        return false;
      }
    }
    if(oldRes && oldRes.value){
      let oldProjects;
      try{ oldProjects = JSON.parse(oldRes.value); }
      catch(e){ console.error('Migration: old project data was not valid JSON', e); return false; }
      try{
        await mapWithConcurrency(oldProjects, 4, async p => {
          await window.storage.set(projectKey(p.id), JSON.stringify(p), true);
        });
        const idsJson = JSON.stringify(oldProjects.map(p => p.id));
        await window.storage.set(PROJECT_INDEX_KEY, idsJson, true);
        return idsJson;
      }catch(e){
        console.error('Migration: failed partway through writing per-project keys', e);
        return false;
      }
    }
  }

  // 3) genuinely nothing here yet (confirmed by list(), or no other option left) — safe to start fresh
  try{
    await window.storage.set(PROJECT_INDEX_KEY, JSON.stringify([]), true);
    return '[]';
  }catch(e){
    console.error('Migration: could not create the initial empty index', e);
    return false;
  }
}
async function loadProjects(){
  const indexJson = await migrateToPerProjectStorage();
  if(indexJson === false) return false; // old data unreadable and nothing new yet — keep existing in-memory data
  let ids;
  try{
    ids = indexJson ? JSON.parse(indexJson) : [];
  }catch(e){
    console.error('loadProjects failed — keeping existing in-memory data rather than risking data loss', e);
    return false;
  }
  const loaded = [];
  let anyFailed = false;
  await mapWithConcurrency(ids, 8, async id => {
    try{
      const res = await window.storage.get(projectKey(id), true);
      if(res && res.value) loaded.push(JSON.parse(res.value));
    }catch(e){
      anyFailed = true;
      console.error('Failed to load project', id, e);
    }
  });
  // if EVERY project failed to load but we expected some, don't wipe whatever's already in memory
  if(anyFailed && loaded.length === 0 && ids.length > 0) return false;
  PROJECTS = loaded;
  let anyChanged = false;
  PROJECTS.forEach(p => { if(migrateProjectSteps(p)) anyChanged = true; });
  if(anyChanged) await saveProjects();
  return true;
}
async function saveProjects(){
  try{
    await window.storage.set(PROJECT_INDEX_KEY, JSON.stringify(PROJECTS.map(p => p.id)), true);
    await mapWithConcurrency(PROJECTS, 8, async p => {
      await window.storage.set(projectKey(p.id), JSON.stringify(p), true);
    });
    return true;
  }catch(e){
    console.error('storage save failed', e);
    showToast('Save failed — your previous data is safe, but this change was not saved. Try again.', true);
    return false;
  }
}
async function deleteProjectKeys(ids){
  try{ await mapWithConcurrency(ids, 4, id => window.storage.delete(projectKey(id), true)); }
  catch(e){ console.error('Failed to clean up deleted project keys', e); }
}

function getRoute(){
  const h = location.hash.slice(1);
  if(h === 'equip' || h.startsWith('equip:')) return {view:'equipment'};
  if(h === 'board' || h.startsWith('board:')) return {view:'storyboard'};
  if(h.startsWith('project=')) return {view:'project', id: decodeURIComponent(h.slice(8))};
  if(h.startsWith('mood=')){
    const rest = h.slice(5);
    const sep = rest.indexOf(':');
    return {view:'moodboard', projectId: decodeURIComponent(rest.slice(0, sep)), stepId: decodeURIComponent(rest.slice(sep+1))};
  }
  if(h === 'cal') return {view:'calendar'};
  if(h.startsWith('projectcal=')) return {view:'projectcal', id: decodeURIComponent(h.slice(11))};
  if(h.startsWith('tab=')) return {view:'list', tab: h.slice(4)};
  return {view:'list', tab:'current'};
}

async function render(){
  const app = document.getElementById('app');
  const route = getRoute();
  if(route.view !== 'moodboard' && mbPasteHandler){
    window.removeEventListener('paste', mbPasteHandler);
    mbPasteHandler = null;
  }
  if(route.view !== 'storyboard' && boardClockInterval){
    clearInterval(boardClockInterval);
    boardClockInterval = null;
  }
  if(route.view === 'equipment'){
    renderGear();
  } else if(route.view === 'storyboard'){
    renderStoryboardViewer();
  } else if(route.view === 'project'){
    const p = byId(route.id);
    if(!p){ renderNotFound(app); return; }
    renderDetail(app, p);
  } else if(route.view === 'moodboard'){
    const p = byId(route.projectId);
    const step = p && (p.steps||[]).find(s => s.id === route.stepId);
    if(!p || !step){ renderNotFound(app); return; }
    renderMoodboard(app, p, step);
  } else if(route.view === 'calendar'){
    renderCalendarView(app);
  } else if(route.view === 'projectcal'){
    const p = byId(route.id);
    if(!p){ renderNotFound(app); return; }
    renderCalendarView(app, p);
  } else {
    renderList(app, route.tab);
  }
}

let boardClockInterval = null;
// works out the real clock window allotted to one shot on its shooting day, dividing the day's
// scheduled start/end (minus any lunch break) equally across that day's shots, in shot-list order —
// same "time per shot" idea the Shooting schedule step already uses, just resolved for one shot
function computeShotTimeSlot(project, shot){
  const schedStep = (project.steps || []).find(isScheduleStep);
  const shotStep = (project.steps || []).find(isShotListStep);
  if(!schedStep || !schedStep.scheduleDays || !shot.day || !shotStep) return null;
  const dayData = schedStep.scheduleDays.find(d => d.date === shot.day);
  if(!dayData || !dayData.start || !dayData.end) return null;
  const dayShots = (shotStep.shotListRows || []).filter(s => s.day === shot.day);
  const idxInDay = dayShots.findIndex(s => s.id === shot.id);
  if(idxInDay === -1) return null;

  const toMinutes = (hhmm) => { const [h,m] = (hhmm||'0:0').split(':').map(Number); return (h||0)*60 + (m||0); };
  const startMin = toMinutes(dayData.start);
  let endMin = toMinutes(dayData.end);
  if(endMin <= startMin) endMin += 24*60;
  const lunchStartMin = (dayData.lunch && dayData.lunchStart) ? toMinutes(dayData.lunchStart) : null;
  const lunchDur = dayData.lunch ? (parseInt(dayData.lunchMinutes,10) || 60) : 0;
  const totalWorkMin = Math.max(1, (endMin - startMin) - lunchDur);
  const perShot = totalWorkMin / dayShots.length;

  const addWorkMinutes = (fromMin, minutesToAdd) => {
    if(lunchStartMin !== null && fromMin < lunchStartMin && fromMin + minutesToAdd > lunchStartMin){
      const before = lunchStartMin - fromMin;
      return lunchStartMin + lunchDur + (minutesToAdd - before);
    }
    return fromMin + minutesToAdd;
  };
  const slotStartMin = addWorkMinutes(startMin, perShot * idxInDay);
  const slotEndMin = addWorkMinutes(startMin, perShot * (idxInDay + 1));

  const toDate = (minutesFromMidnight) => {
    const d = new Date(shot.day + 'T00:00:00');
    d.setMinutes(d.getMinutes() + minutesFromMidnight);
    return d;
  };
  return { startDate: toDate(slotStartMin), endDate: toDate(slotEndMin) };
}
function formatBoardCountdown(ms){
  const sign = ms < 0 ? '−' : '';
  ms = Math.abs(ms);
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return sign + (h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`);
}

    ${renderHeader()}
    ${renderNotifyBanner()}
    <div class="toolbar">
      <button class="btn primary" id="addBtn">+ New Project</button>
      ${searchOpen
        ? `<input type="search" id="searchBox" placeholder="Search projects…" value="${esc(app.dataset.search||'')}">`
        : `<button class="sq-btn" id="searchToggle" aria-label="Search">&#128269;</button>`}
    </div>
    <div class="section-label"><span>Projects (${current.length})</span></div>
    ${current.length ? current.map(p => cardHtml(p, 'current')).join('') : `<div class="card-sub" style="margin-bottom:14px; font-family:var(--mono); font-size:11px; color:var(--text-dim);">Nothing in progress — start a project.</div>`}

    <details class="dropdown-group" ${search && upcoming.length ? 'open' : ''}>
      <summary>Possible Upcoming <span class="dropdown-count">${upcoming.length}</span></summary>
      <div class="dropdown-body">${upcoming.length ? upcoming.map(p => cardHtml(p, 'upcoming')).join('') : `<p class="empty small">Nothing lined up yet.</p>`}</div>
    </details>
    <details class="dropdown-group" ${search && finished.length ? 'open' : ''}>
      <summary>Finished <span class="dropdown-count">${finished.length}</span></summary>
      <div class="dropdown-body">${finished.length ? finished.map(p => cardHtml(p, 'finished')).join('') : `<p class="empty small">Nothing delivered yet.</p>`}</div>
    </details>
    ${trashed.length ? `
    <details class="dropdown-group">
      <summary>Trash <span class="dropdown-count">${trashed.length}</span></summary>
      <div class="dropdown-body">
        ${trashed.map(p => `
          <div class="card">
            <div class="card-body"><div class="name">${esc(p.name)}</div><div class="card-meta">Deleted ${esc(timeAgo(p.deletedAt))}</div></div>
            <button type="button" class="btn small" data-restoreproject="${p.id}">Restore</button>
            <button type="button" class="btn small danger" data-purgeproject="${p.id}">Delete permanently</button>
          </div>
        `).join('')}
      </div>
    </details>
    ` : ''}
    ${renderBottomNav('projects')}
  `;

  const searchToggle = document.getElementById('searchToggle');
  if(searchToggle) searchToggle.addEventListener('click', () => {
    app.dataset.searchOpen = '1';
    renderList(app, tab);
    const box = document.getElementById('searchBox');
    if(box) box.focus();
  });
  const searchBox = document.getElementById('searchBox');
  if(searchBox){
    searchBox.addEventListener('input', e => {
      app.dataset.search = e.target.value;
      renderList(app, tab);
      const box = document.getElementById('searchBox');
      box.focus(); box.setSelectionRange(e.target.value.length, e.target.value.length);
    });
    searchBox.addEventListener('keydown', e => {
      if(e.key === 'Escape'){ app.dataset.search=''; app.dataset.searchOpen='0'; renderList(app, tab); }
    });
    searchBox.addEventListener('blur', () => {
      if(!app.dataset.search){ app.dataset.searchOpen = '0'; renderList(app, tab); }
    });
  }
  document.getElementById('addBtn').addEventListener('click', () => openAddProjectModal());
  app.querySelectorAll('[data-restoreproject]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const p = byId(btn.dataset.restoreproject);
      if(!p) return;
      delete p.deletedAt;
      touchProject(p);
      const ok = await saveProjects();
      showToast(ok ? 'Project restored' : 'Restore failed', !ok);
      if(ok) renderList(app, tab);
    });
  });
  app.querySelectorAll('[data-purgeproject]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = byId(btn.dataset.purgeproject);
      if(!p) return;
      openConfirmModal(`Permanently delete "${p.name}"? This can't be undone.`, async () => {
        PROJECTS = PROJECTS.filter(x => x.id !== p.id);
        const ok = await saveProjects();
        await deleteProjectKeys([p.id]);
        // the project is gone for good now — strip any "Used in Project" tags it left on
        // equipment, or those crates/items would show scheduled locations for a project that no
        // longer exists
        let entitiesChanged = false;
        ENTITIES.forEach(e => {
          if(!e.schedule || !e.schedule.length) return;
          const before = e.schedule.length;
          e.schedule = e.schedule.filter(s => s.projectId !== p.id);
          if(e.schedule.length !== before) entitiesChanged = true;
        });
        const ok2 = entitiesChanged ? await saveEntities() : true;
        showToast((ok && ok2) ? 'Permanently deleted' : 'Delete failed', !(ok && ok2));
        if(ok) renderList(app, tab);
      });
    });
  });
  document.getElementById('calBtn').addEventListener('click', () => goCalendar());
  document.getElementById('contributorBtn').addEventListener('click', () => promptContributorName());
  const nb = document.getElementById('notifyBanner');
  if(nb) nb.addEventListener('click', () => goProject(nb.dataset.project));
  const nbAck = document.getElementById('notifyAck');
  if(nbAck) nbAck.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    const proj = byId(nb.dataset.project);
    const step = proj && (proj.steps||[]).find(s => s.id === nb.dataset.step);
    if(!step) return;
    clearNote(proj, step);
    const ok = await saveProjects();
    showToast(ok ? 'Note cleared' : 'Save failed', !ok);
    if(ok) renderList(app, tab);
  });

  allShown.forEach(p => {
    const el = document.getElementById('card-'+p.id);
    if(el) el.addEventListener('click', () => goProject(p.id));
  });
  wireNavtabs(app);
}

    <div class="card" id="card-${p.id}">

      </div>
      <div class="card-side">
