          <button class="btn primary" id="testsSave" style="flex:1;">Save</button>
        </div>
      </div>`;
    const newModal = bg.querySelector('.modal');
    if(newModal) newModal.scrollTop = scrollTop;
    wire();
  }
  function wire(){
    bg.querySelector('#testsCancel').addEventListener('click', () => bg.remove());
    bg.querySelector('#testsAdd').addEventListener('click', () => {
      tests.push({ id: uid(), enabled: true, name:'', description:'', date:'', outcomeWentWell:'', outcomeNeedsTesting:'' });
      paint();
    });
    bg.querySelectorAll('[data-removetest]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = tests.findIndex(t => t.id === btn.dataset.removetest);
        if(idx !== -1) tests.splice(idx, 1);
        paint();
      });
    });
    bg.querySelectorAll('[data-testfield]').forEach(el => {
      const evName = el.type === 'checkbox' ? 'change' : 'blur';
      el.addEventListener(evName, () => {
        const t = tests.find(x => x.id === el.dataset.testid);
        if(!t) return;
        t[el.dataset.testfield] = el.type === 'checkbox' ? el.checked : el.value;
      });
    });
    autoGrowAll(bg);
    bg.querySelector('#testsSave').addEventListener('click', async () => {
      // capture any in-progress edits the blur listeners above haven't caught yet
      bg.querySelectorAll('[data-testfield]').forEach(el => {
        const t = tests.find(x => x.id === el.dataset.testid);
        if(!t) return;
        t[el.dataset.testfield] = el.type === 'checkbox' ? el.checked : el.value;
      });
      step.tests = tests;
      step.startDate = bg.querySelector('#testsStart').value;
      step.endDate = bg.querySelector('#testsEnd').value;
      touchStep(step);
      touchProject(project);
      const ok = await saveProjects();
      bg.remove();
      showToast(ok ? 'Tests saved' : 'Save failed', !ok);
      if(ok) render();
    });
  }
  bg.addEventListener('click', ev => {
    if(ev.target === bg){ bg.remove(); return; }
    const trigger = ev.target.closest('.dfield');
    if(!trigger) return;
    const rangeWrap = trigger.closest('[data-rangepicker="tests"]');
    if(rangeWrap){
      const triggers = rangeWrap.querySelectorAll('.dfield');
      openDateRangePicker(triggers[0], triggers[1]);
      return;
    }
    // per-test date fields aren't in the range wrapper — single date picker, updating that
    // test's own date on commit
    const testRow = trigger.closest('[data-testrow]');
    if(testRow){
      openDatePicker(trigger);
      const hidden = trigger.querySelector('input[type=hidden]');
      if(hidden){
        hidden.addEventListener('change', () => {
          const t = tests.find(x => x.id === testRow.dataset.testrow);
          if(t) t.date = hidden.value;
        }, { once:true });
      }
    }
  });
  presentPanel(bg, step.id);
  paint();
}

function openBudgetModal(project, step, sideRight){
  closeSidePanels();
  const defaultDays = String(getShootDates(project).length || '');
  let localDates = { startDate: step.startDate || '', endDate: step.endDate || '' }; // survives repaints between date-pick and Save
  // work on a deep copy so Cancel truly discards changes
  const budget = step.budget ? JSON.parse(JSON.stringify(step.budget)) : buildDefaultBudget(project);
  budget.operators = budget.operators || [];
  budget.rows = budget.rows || [];
  // Camera ops days always mirror the project's shoot dates, kept in sync both ways: opening the
  // budget resyncs its items to match current shoot dates (preserving any custom labels by date),
  // and saving writes those dates back to the project.
  const firstOp = budget.operators[0];
  if(firstOp){
    const isCamera = (firstOp.role||'').toLowerCase().includes('camera') || !firstOp.role;
    const shootDates = getShootDates(project);
    if(isCamera && shootDates.length){
      const existingByDate = {};
      (firstOp.items||[]).forEach(it => { if(it.date) existingByDate[it.date] = it; });
      firstOp.items = shootDates.map(d => existingByDate[d] || { id: uid(), label:'Shoot day', days:'1', date: d });
      firstOp.days = '';
    } else if(isCamera && !(firstOp.items && firstOp.items.length) && !firstOp.days && defaultDays){
      firstOp.days = defaultDays;
    }
  }
  const expanded = new Set([
    ...budget.rows.filter(r => r.items && r.items.length).map(r => r.id),
    ...budget.operators.filter(o => o.items && o.items.length).map(o => o.id),
  ]);

  const bg = document.createElement('div');
  bg.className = 'modal-bg' + (sideRight ? ' side-right' : '');
  presentPanel(bg, step.id);
  // registered once — bg itself persists across repaints (only its innerHTML is replaced by paint()),
  // so attaching these inside wire() would stack a duplicate listener on every add/remove/toggle action
  bg.addEventListener('click', ev => {
    if(ev.target === bg){ bg.remove(); return; }
    const trigger = ev.target.closest('.dfield');
    if(!trigger) return;
    const rangeWrap = trigger.closest('[data-rangepicker="bg"]');
    if(rangeWrap){
      const triggers = rangeWrap.querySelectorAll('.dfield');
      openDateRangePicker(triggers[0], triggers[1]);
    } else {
      openDatePicker(trigger);
    }
  });
  bg.addEventListener('change', ev => {
    const el = ev.target;
    if(el.id && el.id.startsWith('opitemdate-')){
      const itemId = el.id.slice('opitemdate-'.length);
      for(const op of budget.operators){
        const item = (op.items || []).find(it => it.id === itemId);
        if(item){ item.date = el.value; break; }
      }
    }
  });

  const splitIcon = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`;

  function opHtml(op){
    const isGroup = op.items && op.items.length > 0;
    const isOpen = expanded.has(op.id);
    return `
      <div class="budget-row" data-op="${op.id}">
        <div class="budget-row-main">
          ${isGroup ? `<button type="button" class="budget-chevron" data-toggleop="${op.id}">${isOpen ? '▾' : '▸'}</button>` : `<span class="budget-chevron-spacer"></span>`}
          <input type="text" class="budget-label" data-opfield="role" data-op="${op.id}" value="${esc(op.role)}" placeholder="Role, e.g. Sound recorder">
          <span class="budget-amount-computed" id="opsub-${op.id}">${fmtMoney(operatorSubtotal(op))}</span>
          <button type="button" class="mo-btn" data-addopsub="${op.id}" aria-label="Split into multiple days" title="Break down by day">${splitIcon}</button>
          <button type="button" class="mo-btn" data-removeop="${op.id}" aria-label="Remove operator">&times;</button>
        </div>
        <div class="budget-op-fields">
          <div class="budget-op-field">
            <label>Days</label>
            ${isGroup
              ? `<div class="budget-readonly-display" id="opdays-${op.id}">${operatorDays(op)}</div>`
              : `<input type="number" inputmode="numeric" data-opfield="days" data-op="${op.id}" value="${esc(op.days)}" placeholder="0">`
            }
          </div>
          <div class="budget-op-field"><label>Rate/day</label><input type="number" inputmode="decimal" data-opfield="rate" data-op="${op.id}" value="${esc(op.rate)}" placeholder="0.00"></div>
          <div class="budget-op-field"><label>How many operators</label><input type="number" inputmode="numeric" data-opfield="count" data-op="${op.id}" value="${esc(op.count)}" placeholder="1"></div>
        </div>
        <input type="text" class="budget-details" data-opfield="details" data-op="${op.id}" value="${esc(op.details||'')}" placeholder="Details">
        ${isGroup && isOpen ? `
          <div class="budget-subitems">
            <div class="budget-subitems-title">Days broken down</div>
            ${op.items.map(it => `
              <div class="budget-subitem-op" data-opitem="${it.id}" data-op="${op.id}">
                <div class="budget-subitem-row1">
                  <input type="text" class="budget-sublabel" data-opitemfield="label" value="${esc(it.label)}" placeholder="Task, e.g. Refined edit">
                  <button type="button" class="mo-btn" data-removeopitem="${it.id}" data-op="${op.id}" aria-label="Remove day">&times;</button>
                </div>
                <div class="budget-subitem-row2">
                  <input type="number" inputmode="numeric" class="budget-subamount" data-opitemfield="days" value="${esc(it.days)}" placeholder="Days">
                  ${dateFieldHtml('opitemdate-' + it.id, it.date)}
                </div>
              </div>`).join('')}
            <button type="button" class="btn small" data-addopsub="${op.id}">+ Add day</button>
          </div>
        ` : ''}
      </div>`;
  }

  function rowHtml(row){
    const isGroup = row.items && row.items.length > 0;
    const isOpen = expanded.has(row.id);
    const useDays = row.useDays !== false;
    return `
      <div class="budget-row" data-row="${row.id}">
        <div class="budget-row-main">
          ${isGroup ? `<button type="button" class="budget-chevron" data-toggle="${row.id}">${isOpen ? '▾' : '▸'}</button>` : `<span class="budget-chevron-spacer"></span>`}
          <input type="text" class="budget-label" data-rowfield="label" data-row="${row.id}" value="${esc(row.label)}" placeholder="Item">
          <span class="budget-amount-computed" id="rowsub-${row.id}">${fmtMoney(budgetRowAmount(row))}</span>
          <button type="button" class="mo-btn" data-addsub="${row.id}" aria-label="Split into multiple items" title="Split into multiple items">${splitIcon}</button>
          <button type="button" class="mo-btn" data-removerow="${row.id}" aria-label="Remove row">&times;</button>
        </div>
        ${!isGroup ? `
        <div class="budget-op-fields">
          ${useDays ? `<div class="budget-op-field"><label>Days</label><input type="number" inputmode="numeric" data-rowfield="days" data-row="${row.id}" value="${esc(row.days||'1')}" placeholder="1"></div>` : ''}
          <div class="budget-op-field"><label>Amount</label><input type="number" inputmode="decimal" data-rowfield="amount" data-row="${row.id}" value="${esc(row.amount)}" placeholder="0.00"></div>
        </div>` : ''}
        <label class="budget-daytoggle"><input type="checkbox" data-usedaystoggle="${row.id}" ${useDays ? 'checked' : ''}> Multiply by days (uncheck for a one-time cost)</label>
        <input type="text" class="budget-details" data-rowfield="details" data-row="${row.id}" value="${esc(row.details||'')}" placeholder="Details">
        ${isGroup && isOpen ? `
          <div class="budget-subitems">
            ${row.items.map(it => `
              <div class="budget-subitem" data-item="${it.id}" data-row="${row.id}">
                <input type="text" class="budget-sublabel" data-itemfield="label" value="${esc(it.label)}" placeholder="Item name">
                ${useDays ? `<input type="number" inputmode="numeric" class="budget-subdays" data-itemfield="days" value="${esc(it.days||'1')}" placeholder="Days">` : ''}
                <input type="number" inputmode="decimal" class="budget-subamount" data-itemfield="amount" value="${esc(it.amount)}" placeholder="0.00">
                <button type="button" class="mo-btn" data-removeitem="${it.id}" data-row="${row.id}" aria-label="Remove item">&times;</button>

            <button type="button" class="btn-text" data-addsub="${row.id}">+ Add item</button>
          </div>
        ` : ''}

  }

  function updateTotals(){
    const totalEl = bg.querySelector('#bgTotal');
    if(totalEl) totalEl.textContent = fmtMoney(budgetTotal(budget));
  }

  function paint(){
    const prevModal = bg.querySelector('.modal');
    const scrollTop = prevModal ? prevModal.scrollTop : 0;
    // the date picker sets these hidden inputs' .value directly without firing 'change', so read
    // whatever's currently there before wiping the DOM, or an unsaved pick would be lost the next
    // time something else (add operator, toggle, etc.) triggers a repaint
    const prevStartEl = bg.querySelector('#bgStart');
    const prevEndEl = bg.querySelector('#bgEnd');
    if(prevStartEl) localDates.startDate = prevStartEl.value;
    if(prevEndEl) localDates.endDate = prevEndEl.value;
    bg.innerHTML = `
      <div class="modal budget-modal">
        <h3>Budget</h3>
        ${stepDateRangeFieldHtml(localDates, 'bg')}

        <div class="section-label"><span>Operators</span></div>
        <div id="bgOpsList">${budget.operators.map(opHtml).join('')}</div>
        <button class="btn small" id="bgAddOp">+ Add operator</button>

        <div class="section-label"><span>Other costs</span></div>
        <div id="bgRowsList">${budget.rows.map(rowHtml).join('')}</div>
        <button class="btn small" id="bgAddRow">+ Add row</button>

        <div class="budget-total">Total <b id="bgTotal">${fmtMoney(budgetTotal(budget))}</b></div>
        <button class="btn small full" id="bgExportPdf" style="width:100%; margin-bottom:14px;">Export as PDF for client</button>

        <div class="modal-actions">
          <button class="btn ghost" id="bgCancel" style="flex:1;">Cancel</button>
          <button class="btn primary" id="bgSave" style="flex:1;">Save</button>
        </div>
      </div>`;
    const newModal = bg.querySelector('.modal');
    if(newModal) newModal.scrollTop = scrollTop;
    wire();
  }

  function wire(){
    bg.querySelector('#bgCancel').addEventListener('click', () => bg.remove());

    bg.querySelectorAll('[data-opfield]').forEach(el => {
      el.addEventListener('input', () => {
        const op = budget.operators.find(o => o.id === el.dataset.op);
        if(!op) return;
        op[el.dataset.opfield] = el.value;
        if(['days','rate','count'].includes(el.dataset.opfield)){
          const sub = bg.querySelector(`#opsub-${op.id}`);
          if(sub) sub.textContent = fmtMoney(operatorSubtotal(op));
          updateTotals();
        }
      });
    });
    bg.querySelectorAll('[data-opitemfield]').forEach(el => {
      el.addEventListener('input', () => {
        const opEl = el.closest('[data-op]');
        const op = budget.operators.find(o => o.id === opEl.dataset.op);
        const item = op && op.items.find(it => it.id === el.closest('[data-opitem]').dataset.opitem);
        if(item) item[el.dataset.opitemfield] = el.value;
        if(el.dataset.opitemfield === 'days'){
          const sub = bg.querySelector(`#opsub-${op.id}`);
          if(sub) sub.textContent = fmtMoney(operatorSubtotal(op));
          const daysDisplay = bg.querySelector(`#opdays-${op.id}`);
          if(daysDisplay) daysDisplay.textContent = operatorDays(op);
          updateTotals();
        }
      });
    });
    bg.querySelectorAll('[data-toggleop]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.toggleop;
        if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
        paint();
      });
    });
    bg.querySelectorAll('[data-addopsub]').forEach(btn => {
      btn.addEventListener('click', () => {
        const op = budget.operators.find(o => o.id === btn.dataset.addopsub);
        if(!op) return;
        if(!op.items) op.items = [];
        if(op.items.length === 0){
          op.items.push({ id: uid(), label: 'Day 1', days: op.days || '1' });
          op.days = '';
        }
        op.items.push({ id: uid(), label: '', days: '1', date: '' });
        expanded.add(op.id);
        paint();
      });
    });
    bg.querySelectorAll('[data-removeopitem]').forEach(btn => {
      btn.addEventListener('click', () => {
        const op = budget.operators.find(o => o.id === btn.dataset.op);
        if(op) op.items = op.items.filter(it => it.id !== btn.dataset.removeopitem);
        paint();
      });
    });
    bg.querySelectorAll('[data-removeop]').forEach(btn => {
      btn.addEventListener('click', () => {
        budget.operators = budget.operators.filter(o => o.id !== btn.dataset.removeop);
        paint();
      });
    });
    bg.querySelector('#bgAddOp').addEventListener('click', () => {
      const carryDays = (budget.operators[0] && budget.operators[0].days) || defaultDays;
      const op = { id: uid(), role:'', details:'', days: carryDays, rate:'', count:'1', items:[] };
      budget.operators.push(op);
      paint();
      const el = bg.querySelector(`[data-op="${op.id}"].budget-label`);
      if(el) el.focus();
    });

    bg.querySelectorAll('[data-rowfield]').forEach(el => {
      el.addEventListener('input', () => {
        const row = budget.rows.find(r => r.id === el.dataset.row);
        if(!row) return;
        row[el.dataset.rowfield] = el.value;
        if(['amount','days'].includes(el.dataset.rowfield)){
          const sub = bg.querySelector(`#rowsub-${row.id}`);
          if(sub) sub.textContent = fmtMoney(budgetRowAmount(row));
          updateTotals();
        }
      });
    });
    bg.querySelectorAll('[data-itemfield]').forEach(el => {
      el.addEventListener('input', () => {
        const rowEl = el.closest('[data-row]');
        const row = budget.rows.find(r => r.id === rowEl.dataset.row);
        const item = row && row.items.find(it => it.id === el.closest('[data-item]').dataset.item);
        if(item) item[el.dataset.itemfield] = el.value;
        if(['amount','days'].includes(el.dataset.itemfield)){
          const amountDisplay = bg.querySelector(`#rowsub-${row.id}`);
          if(amountDisplay) amountDisplay.textContent = fmtMoney(budgetRowAmount(row));
          updateTotals();
        }
      });
    });
    bg.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.toggle;
        if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
        paint();
      });
    });
    bg.querySelectorAll('[data-usedaystoggle]').forEach(cb => {
      cb.addEventListener('change', () => {
        const row = budget.rows.find(r => r.id === cb.dataset.usedaystoggle);
        if(row) row.useDays = cb.checked;
        paint();
        updateTotals();
      });
    });
    bg.querySelectorAll('[data-addsub]').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = budget.rows.find(r => r.id === btn.dataset.addsub);
        if(!row) return;
        if(!row.items) row.items = [];
        if(row.items.length === 0){
          row.items.push({ id: uid(), label: row.label || 'Item 1', amount: row.amount || '', days: row.days || '1' });
          row.amount = '';
        }
        row.items.push({ id: uid(), label: '', amount: '', days: '1' });
        expanded.add(row.id);
        paint();
      });
    });
    bg.querySelectorAll('[data-removeitem]').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = budget.rows.find(r => r.id === btn.dataset.row);
        if(row) row.items = row.items.filter(it => it.id !== btn.dataset.removeitem);
        paint();
      });
    });
    bg.querySelectorAll('[data-removerow]').forEach(btn => {
      btn.addEventListener('click', () => {
        budget.rows = budget.rows.filter(r => r.id !== btn.dataset.removerow);
        paint();
      });
    });
    bg.querySelector('#bgAddRow').addEventListener('click', () => {
      const row = { id: uid(), label:'', amount:'', days:'1', details:'', items:[] };
      budget.rows.push(row);
      paint();
      const el = bg.querySelector(`[data-row="${row.id}"] .budget-label`);
      if(el) el.focus();
    });
    bg.querySelector('#bgExportPdf').addEventListener('click', () => exportBudgetPdf(project, step, budget));
    bg.querySelector('#bgSave').addEventListener('click', async () => {
      const camOp = budget.operators.find(o => (o.role||'').toLowerCase().includes('camera'));
      if(camOp && camOp.items && camOp.items.length){
        const dates = camOp.items.map(it => it.date).filter(Boolean).sort();
        if(dates.length) project.shootDates = dates;
      }
      step.budget = budget;
      step.startDate = bg.querySelector('#bgStart').value;
      step.endDate = bg.querySelector('#bgEnd').value;
      touchStep(step);
      // keep the Brief's Fees text in sync automatically whenever the Budget is saved
      const briefStep = (project.steps || []).find(isBriefStep);
      if(briefStep){
        const breakdown = budgetBreakdownText(budget);
        if(breakdown){
          if(!briefStep.briefData) briefStep.briefData = {};
          briefStep.briefData.fees = breakdown;
          briefStep.updatedAt = new Date().toISOString();
        }
      }
      touchProject(project);
      const ok = await saveProjects();
      bg.remove();
      showToast(ok ? 'Budget saved' : 'Save failed', !ok);
      if(ok) render();
    });
  }

  paint();
}

function openScriptModal(project, step, sideRight){
  closeSidePanels();
  const bg = document.createElement('div');
  bg.className = 'modal-bg' + (sideRight ? ' side-right' : '');
  const initialHtml = step.scriptHtml || esc(step.scriptText || '');
  bg.innerHTML = `
    <div class="modal">
      <h3>Script</h3>
      <div class="script-toolbar">
        <span class="script-toolbar-label">Mark edit:</span>
        ${PEN_COLORS.map(c => `<button type="button" class="pen-swatch" data-scolor="${c.hex}" style="background:${c.hex};" aria-label="${c.key}"></button>`).join('')}
        <button type="button" class="pen-swatch clear-swatch" id="scClearColor" aria-label="Clear color" title="Clear color">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <div class="script-hint">Select some text, then tap a color to mark it as a change.</div>
      <div class="field">
        <div id="scEditor" class="script-textarea" contenteditable="true">${initialHtml}</div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="scCancel" style="flex:1;">Cancel</button>
        <button class="btn primary" id="scSave" style="flex:1;">Save</button>
      </div>
    </div>`;
  presentPanel(bg, step.id);
  const editor = bg.querySelector('#scEditor');
  editor.focus();

  // pastes always land as plain text at the cursor — inserted as a single raw text node (not via
  // execCommand, which can double up blank lines by mixing literal newlines with its own block breaks).
  // combined with white-space:pre-wrap, this keeps whitespace, line breaks, and indentation exact.
  editor.addEventListener('paste', (ev) => {
    ev.preventDefault();
    const text = (ev.clipboardData || window.clipboardData).getData('text/plain');
    const sel = window.getSelection();
    if(!sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const node = document.createTextNode(text);
    range.insertNode(node);
    range.setStartAfter(node);
    range.setEndAfter(node);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  });

  bg.querySelectorAll('[data-scolor]').forEach(btn => {
    btn.addEventListener('click', () => {
      editor.focus();
      document.execCommand('foreColor', false, btn.dataset.scolor);
    });
  });
  bg.querySelector('#scClearColor').addEventListener('click', () => {
    editor.focus();
    document.execCommand('foreColor', false, '#17181a');
  });

  bg.querySelector('#scCancel').addEventListener('click', () => bg.remove());
  bg.addEventListener('click', ev => { if(ev.target === bg) bg.remove(); });
  bg.querySelector('#scSave').addEventListener('click', async () => {
    step.scriptHtml = editor.innerHTML;
    step.scriptText = editor.innerText; // plain-text mirror, kept for anything that only reads scriptText
    touchStep(step);
    touchProject(project);
    const ok = await saveProjects();
    bg.remove();
    showToast(ok ? 'Script saved' : 'Save failed', !ok);
    if(ok) render();
  });
}

function openLocationModal(project, step, sideRight){
  closeSidePanels();
  const shootDates = getShootDates(project);
  let localDates = { startDate: step.startDate || '', endDate: step.endDate || '' };
  // snapshot of each entry's scene/address by id, taken before any edits — used on save to detect
  // renames/address changes and propagate them into the Shot list
  const beforeById = {};
  (step.locationRows || []).forEach(r => (r.entries || []).forEach(e => {
    beforeById[e.id] = { date: r.date, scene: e.scene || '', address: e.address || '' };
  }));
  const savedByDate = {};
  (step.locationRows || []).forEach(r => { if(r.date) savedByDate[r.date] = r; });
  function migrateRow(date, saved){
    if(saved && saved.entries) return { date, entries: JSON.parse(JSON.stringify(saved.entries)) };
    const entries = [];
    if(saved && saved.scenes && saved.scenes.length){
      saved.scenes.forEach(s => entries.push({ id: uid(), scene:s, address: saved.address||'' }));
    } else if(saved && (saved.sceneText || saved.address)){
      entries.push({ id: uid(), scene: saved.sceneText||'', address: saved.address||'' });
    }
    if(!entries.length) entries.push({ id: uid(), scene:'', address:'' });
    return { date, entries };
  }
  const rows = shootDates.length
    ? shootDates.map(d => migrateRow(d, savedByDate[d]))
    : (step.locationRows && step.locationRows.length ? step.locationRows.map(r => migrateRow(r.date||'', r)) : [migrateRow('', null)]);
  let scenes = [];

  const bg = document.createElement('div');
  bg.className = 'modal-bg' + (sideRight ? ' side-right' : '');

  function rescanScript(){
    const scriptStep = (project.steps || []).find(isScriptStep);
    scenes = scriptStep ? parseScriptScenes(scriptStep.scriptText) : [];
    // keep only selections that still exist after a rescan; nothing is silently invented
    rows.forEach(r => r.entries.forEach(e => {
      if(e.scene && scenes.length && !scenes.some(sc => sc.label === e.scene)) e.scene = '';
    }));
  }
  rescanScript();

  function entryHtml(rowIdx, e, entryIdx){
    const sceneField = scenes.length
      ? `<select class="loc-scene-select" data-locfield="scene" data-row="${rowIdx}" data-entry="${entryIdx}"><option value="">Select a scene…</option>${scenes.map((sc,si) => `<option value="${esc(sc.label)}" ${e.scene===sc.label?'selected':''}>${si+1}. ${esc(sc.label)}</option>`).join('')}</select>`
      : `<input type="text" class="loc-scene-input" data-locfield="scene" data-row="${rowIdx}" data-entry="${entryIdx}" placeholder="Scene for this location" value="${esc(e.scene||'')}">`;
    return `
      <div class="loc-entry" data-row="${rowIdx}" data-entry="${entryIdx}">
        <div class="loc-entry-top">
          ${sceneField}
          <button type="button" class="mo-btn" data-removeentry="${entryIdx}" data-row="${rowIdx}" aria-label="Remove scene">&times;</button>
        </div>
        <input type="text" class="loc-address" data-locfield="address" data-row="${rowIdx}" data-entry="${entryIdx}" placeholder="Location address" value="${esc(e.address||'')}">
      </div>`;
  }

  function rowHtml(r, i){
    const dayLabel = `Day ${i+1}`;
    const dateLabel = r.date ? fmtDate(r.date) : 'No date set';
    return `
      <div class="loc-row">
        <div class="loc-row-head"><span class="loc-day">${dayLabel}</span><span class="loc-date">${esc(dateLabel)}</span></div>
        ${r.entries.map((e, ei) => entryHtml(i, e, ei)).join('')}
        <button type="button" class="btn small" data-addentry="${i}" style="width:100%;">+ Add another scene/location</button>
      </div>`;
  }

  function paint(){
    const prevModal = bg.querySelector('.modal');
    const scrollTop = prevModal ? prevModal.scrollTop : 0;
    bg.innerHTML = `
      <div class="modal">
        <h3>Location scout</h3>
        ${stepDateRangeFieldHtml(localDates, 'loc')}
        <div class="timeline-hint">${scenes.length ? scenes.length + ' scene' + (scenes.length===1?'':'s') + ' found in your Script' : 'No script scenes found yet — fill scenes in manually below.'}</div>
        <button class="btn small" id="locRescan" style="margin-bottom:14px;">↻ Recheck script for scenes</button>
        <div id="locRows">${rows.map(rowHtml).join('')}</div>
        <div class="modal-actions">
          <button class="btn ghost" id="locCancel" style="flex:1;">Cancel</button>
          <button class="btn primary" id="locSave" style="flex:1;">Save</button>
        </div>
      </div>`;
    const newModal = bg.querySelector('.modal');
    if(newModal) newModal.scrollTop = scrollTop;
    autoGrowAll(bg);
    wire();
  }

  function wire(){
    bg.querySelector('#locCancel').addEventListener('click', () => bg.remove());
    bg.querySelector('#locRescan').addEventListener('click', () => {
      rescanScript();
      paint();
      showToast('Rechecked script for scenes');
    });
    bg.querySelectorAll('[data-addentry]').forEach(btn => {
      btn.addEventListener('click', () => {
        rows[parseInt(btn.dataset.addentry,10)].entries.push({ id: uid(), scene:'', address:'' });
        paint();
      });
    });
    bg.querySelectorAll('[data-removeentry]').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = rows[parseInt(btn.dataset.row,10)];
        const idx = parseInt(btn.dataset.removeentry,10);
        if(row.entries.length > 1) row.entries.splice(idx,1);
        else row.entries[0] = { id: uid(), scene:'', address:'' };
        paint();
      });
    });
    bg.querySelectorAll('[data-locfield]').forEach(el => {
      el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
        const rowIdx = parseInt(el.dataset.row,10), entryIdx = parseInt(el.dataset.entry,10);
        rows[rowIdx].entries[entryIdx][el.dataset.locfield] = el.value;
      });
    });
    bg.querySelector('#locSave').addEventListener('click', async () => {
      // propagate scene renames / address changes into any Shot list rows that referenced the
      // old scene text on the same day, so the two steps don't drift out of sync
      const norm = s => (s || '').trim().toLowerCase();
      const shotStep = (project.steps || []).find(isShotListStep);
      let propagated = 0;
      rows.forEach(r => (r.entries || []).forEach(e => {
        const before = beforeById[e.id];
        if(!before) return; // a brand-new entry, nothing to propagate from
        const sceneChanged = norm(before.scene) !== norm(e.scene);
        const addressChanged = before.address !== (e.address || '');
        if(!sceneChanged && !addressChanged) return;
        if(shotStep && shotStep.shotListRows){
          shotStep.shotListRows.forEach(sr => {
            if(sr.day !== r.date || norm(sr.scene) !== norm(before.scene)) return;
            if(sceneChanged) sr.scene = e.scene;
            if(sr.location) sr.location = e.address || ''; // only refresh a location the row already had stored
            propagated++;
          });
        }
      }));
      step.locationRows = rows;
      step.startDate = localDates.startDate;
      step.endDate = localDates.endDate;
      touchStep(step);
      touchProject(project);
      const ok = await saveProjects();
      bg.remove();
      showToast(ok ? ('Location scout saved' + (propagated ? ` — ${propagated} shot${propagated===1?'':'s'} updated` : '')) : 'Save failed', !ok);
      if(ok) render();
    });
  }
  bg.addEventListener('click', ev => {
    if(ev.target === bg){ bg.remove(); return; }
    const trigger = ev.target.closest('.dfield');
    if(!trigger) return;
    const rangeWrap = trigger.closest('[data-rangepicker="loc"]');
    if(rangeWrap){
      const triggers = rangeWrap.querySelectorAll('.dfield');
      openDateRangePicker(triggers[0], triggers[1]);
    }
  });
  bg.addEventListener('change', ev => {
    const el = ev.target;
    if(el.id === 'locStart') localDates.startDate = el.value;
    else if(el.id === 'locEnd') localDates.endDate = el.value;
  });
  presentPanel(bg, step.id);
  paint();
}

// weddings don't need these columns — a simpler day-of table (Scene, Camera, Shot, Shot type).
// Location is dropped from the visible table too, but an imported spreadsheet's location data
// still gets pulled into the Location Scout step rather than being lost.
const SHOTLIST_HIDDEN_COLS_BY_TYPE = {

const SHOTLIST_COL_WIDTHS = {

  shot: 170, shotType: 90, movement: 100, script: 150, intention: 150, multicam: 70, vfx: 90,
};
// alternate header spellings a spreadsheet might use for each column, matched case-insensitively
const SHOTLIST_HEADER_ALIASES = {
  day: ['shooting day','day','date'],
  location: ['location'],
  order: ['shooting order','order'],
  scene: ['scene'],
  camera: ['camera'],
  lens: ['lens'],
  shot: ['shot number','shot','shot no','shot #'],
  shotType: ['shot type','shottype'],
  movement: ['movement'],
  script: ['script'],
  intention: ['intention'],

  vfx: ['vfx as optional column','vfx (optional)','vfx notes','vfx'],
};
// filename-reference columns the Blender previs exporter writes alongside shot_list.csv — not
// real shot fields, just pointers to PNGs (per-shot render, per-scene top-down) sitting in the
// same export folder, matched up to shots after the CSV itself is imported
const SHOTLIST_IMAGE_REF_ALIASES = {
  renderFile: ['render'],
  topdownFile: ['top-down','topdown'],
};
function excelDateToIso(val){
  if(val instanceof Date && !isNaN(val)) return val.toISOString().slice(0,10);
  if(typeof val === 'string'){
    const trimmed = val.trim();
    const m = trimmed.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return m[0];
    // anything else (a bare number, "day 1", etc.) isn't a date — pass it through as-is instead of
    // discarding it, so resolveShotDayNumbers gets a chance to read a day number out of it
    return trimmed;
  }
  if(typeof val === 'number') return String(val);
  return '';
}
// reads an uploaded .xlsx/.xls/.csv file and maps its columns onto our shot list fields by header
// text, matching common alternate spellings — returns [] if the file can't be read as a sheet
async function parseShotListExcel(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array', cellDates:true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const json = XLSX.utils.sheet_to_json(sheet, { defval:'' });
  if(!json.length) return [];
  const headers = Object.keys(json[0]);
  const lowerHeaders = headers.map(h => h.trim().toLowerCase());
  const fieldKeys = {};
  Object.entries(SHOTLIST_HEADER_ALIASES).forEach(([field, aliases]) => {
    for(const alias of aliases){
      const idx = lowerHeaders.indexOf(alias);
      if(idx > -1){ fieldKeys[field] = headers[idx]; break; }
    }
  });
  const imageRefKeys = {};
  Object.entries(SHOTLIST_IMAGE_REF_ALIASES).forEach(([field, aliases]) => {
    for(const alias of aliases){
      const idx = lowerHeaders.indexOf(alias);
      if(idx > -1){ imageRefKeys[field] = headers[idx]; break; }
    }
  });
  let lastDay = ''; // forward-fill: a merged "Shooting day" cell only holds its value on the first
                     // row of the block, blank on the rows below it — carry it down like Excel shows it
  const result = json.map(row => {
    const out = { id: uid() };
    SHOTLIST_COLS.forEach(c => {
      const srcKey = fieldKeys[c.key];
      if(!srcKey){ out[c.key] = ''; return; }
      out[c.key] = c.key === 'day' ? excelDateToIso(row[srcKey]) : String(row[srcKey] ?? '').trim();
    });
    if(out.day) lastDay = out.day;
    else out.day = lastDay;
    // filename references (e.g. the Blender previs exporter's "Render"/"Top-down" columns) —
    // kept on the row so a later image import step can match actual files to it by name
    Object.entries(imageRefKeys).forEach(([field, srcKey]) => {
      const val = String(row[srcKey] ?? '').trim();
      if(val) out[field] = val;
    });
    return out;
  });
  return result.filter(r => Object.entries(r).some(([k,v]) => k !== 'id' && k !== 'day' && v));
}
// exports Scene/Camera/Shot Number plus blank Camera Code columns (one per distinct camera used
// across the shot list, e.g. A, B) and one Audio Code column, for the DIT to fill in on set
// opens a native multi-file picker and matches selected image files, by exact filename, against
// each row's renderFile/topdownFile references (from a previs CSV import) — matched images get
// compressed and added to that shot's Boarding gallery, same as any other shot image
function matchPrevisImages(project, rows){
  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.multiple = true;
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', async () => {
      const files = [...input.files];
      input.remove();
      if(!files.length){ resolve({matched:0, total:0}); return; }
      const byName = new Map(files.map(f => [f.name, f]));
      let matched = 0, total = 0;
      // Render -> that shot's own quick-reference image (Shot list); Top-down -> that shot's
      // Lighting set ups gallery, since a top-down view is a blocking/lighting diagram, not a
      // storyboard frame
      const targets = [
        { field:'renderFile', keyFn: shotImageKey },
        { field:'topdownFile', keyFn: shotLightKey },
      ];
      for(const row of rows){
        for(const { field, keyFn } of targets){
          const filename = row[field];
          if(!filename) continue;
          total++;
          const file = byName.get(filename);
          if(!file) continue;
          const key = keyFn(project.id, row.id);
          const existing = await loadImageSet(key);
          if(existing.some(img => img.sourceName === filename)){ matched++; continue; }
          try{
            const dataUrl = await compressImageFile(file);
            existing.push({ id: uid(), dataUrl, sourceName: filename });
            await saveImageSet(key, existing);
            matched++;
          }catch(e){ console.error('previs image match failed', e); }
        }
      }
      resolve({matched, total});
    });
    input.click();
  });
}
function exportShotListDitSheet(project, rows){
  if(typeof XLSX === 'undefined'){ showToast("Couldn't load the spreadsheet writer — check your connection and try again", true); return; }
  if(!rows.length){ showToast('Add some shots first', true); return; }

  const TAKES_PER_SHOT = 3; // starting rows per shot — the DIT can just add more rows in the sheet for shots that ran longer

  const cameraSet = new Set();
  rows.forEach(r => {
    (r.camera || '').split(/[,&/]|\band\b/i).map(c => c.trim()).filter(Boolean).forEach(c => cameraSet.add(c));
  });
  const cameras = cameraSet.size ? [...cameraSet].sort() : ['A'];
  const cameraCols = cameras.map(c => `Camera Code (${c})`);

  const data = [];
  rows.forEach(r => {
    for(let t = 1; t <= TAKES_PER_SHOT; t++){
      const row = { Scene: r.scene || '', Camera: r.camera || '', 'Shot Number': r.shot || '', Take: t };
      cameraCols.forEach(col => { row[col] = ''; });
      row['Audio Code'] = '';
      row['Circle Take'] = '';
      row['Notes'] = '';
      data.push(row);
    }
  });

  const ws = XLSX.utils.json_to_sheet(data, { header: ['Scene', 'Camera', 'Shot Number', 'Take', ...cameraCols, 'Audio Code', 'Circle Take', 'Notes'] });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'DIT Log');
  XLSX.writeFile(wb, `${(project.name || 'project').replace(/[^a-z0-9]+/gi,'-')}-dit-log.xlsx`);
}
// feeds a spreadsheet's location data into the Location Scout step, matched by day + scene —
// used when the Shot list table itself doesn't show a Location column (e.g. weddings), so the
// imported addresses aren't just discarded
// fills in Location Scout entries from imported location text, but never overwrites an address
// that's already there — only adds one where none exists yet
function applyImportedLocations(project, importedRows){
  const locStep = (project.steps || []).find(isLocationStep);
  if(!locStep) return 0;
  if(!locStep.locationRows) locStep.locationRows = [];
  const norm = s => (s || '').trim().toLowerCase();
  let count = 0;
  importedRows.forEach(r => {
    if(!r.location || !r.scene) return;
    const date = r.day || '';
    let dayRow = locStep.locationRows.find(lr => lr.date === date);
    if(!dayRow){ dayRow = { date, entries: [] }; locStep.locationRows.push(dayRow); }
    let entry = dayRow.entries.find(e => norm(e.scene) === norm(r.scene));
    if(!entry){
      entry = { id: uid(), scene: r.scene, address:'' };
      dayRow.entries.push(entry);
    }
    if(!entry.address){
      entry.address = r.location;
      count++;
    }
  });
  return count;
}
// a "Shooting day" cell that's just a bare number ("1", "2"...) is treated as shoot day N —
// resolved against the project's actual dated shoot days (1-indexed, matching how people count days)
function resolveShotDayNumbers(rows, shootDates){
  rows.forEach(r => {
    const val = (r.day || '').trim();
    if(!val || /^\d{4}-\d{2}-\d{2}/.test(val)) return; // already blank or a real ISO date
    // accepts a bare number ("1") or a number embedded in text ("day 1", "Day 1 ", "Shoot Day 1")
    const m = val.match(/(\d+)/);
    if(m){
      const idx = parseInt(m[1], 10) - 1;
      if(idx >= 0 && idx < shootDates.length) r.day = shootDates[idx];
    }
  });
}

      if(typeof XLSX === 'undefined'){ showToast("Couldn't load the spreadsheet reader — check your connection and try again", true); return; }
      let imported;
      try{
        imported = await parseShotListExcel(file);
      } catch(e){
        showToast("Couldn't read that file — is it a valid .xlsx, .xls, or .csv?", true);
        return;
      }
      if(!imported.length){ showToast('No rows found in that file', true); return; }
      resolveShotDayNumbers(imported, shootDates);
      const proceed = async () => {
        rows.length = 0;
        imported.forEach(r => rows.push(r));
        const locCount = applyImportedLocations(project, imported);
        // Location Scout is a different step's data — save it immediately rather than waiting on
        // the Shot list's own Save button, so it's never lost if the import is later cancelled
        if(locCount) await saveProjects();
        paint();
        showToast(`Imported ${imported.length} shot${imported.length===1?'':'s'}` + (locCount ? ` — ${locCount} location${locCount===1?'':'s'} added to Location Scout` : ''));

      if(rows.length){
        openConfirmModal(`Import ${imported.length} row${imported.length===1?'':'s'} from this file? This replaces the ${rows.length} row${rows.length===1?'':'s'} already in the Shot list.`, proceed);

        // cheap, single-shot reconciliation (2 galleries, not the whole shot list) right before
        // opening — catches anything added on the Boarding side without a bulk scan on panel open
        await reconcileImageSets(shotBoardKey, shotImageKey, project.id, [rowId]);

function minutesToClock(mins){
  mins = ((mins % (24*60)) + 24*60) % (24*60);
  const h = Math.floor(mins/60), m = mins%60;
  const period = h>=12 ? 'PM':'AM';
  let h12 = h%12; if(h12===0) h12=12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
function minutesToHHMM(mins){
  mins = ((mins % (24*60)) + 24*60) % (24*60);
  return `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`;
}
function formatClockValue(hhmm){
  if(!hhmm) return '';
  const m = hhmm.match(/^(\d{1,2}):(\d{2})/);
  if(!m) return hhmm;
  return minutesToClock(parseInt(m[1],10)*60 + parseInt(m[2],10));
}

    const hInput = bg.querySelector('#tpHourInput');

      const v = hInput.value.replace(/\D/g,'').slice(0,2);

      const n = parseInt(v,10);
      h = isNaN(n) ? null : Math.min(23, n);

    mInput.addEventListener('input', () => {
      const v = mInput.value.replace(/\D/g,'').slice(0,2);
      mInput.value = v;
      const n = parseInt(v,10);
      m = isNaN(n) ? null : Math.min(59, n);
    });

    bg.querySelector('#tpMinUp').addEventListener('click', () => { m = ((m===null?-15:m)+15+60)%60; render(); });
    bg.querySelector('#tpMinDown').addEventListener('click', () => { m = ((m===null?15:m)+45)%60; render(); });

      m = Math.round(now.getMinutes()/15)*15 % 60;

    });

    bg.querySelector('#tpCancel').addEventListener('click', () => bg.remove());
    bg.querySelector('#tpDone').addEventListener('click', () => {

      triggerEl.querySelector('.dfield-text').textContent = finalVal ? formatClockValue(finalVal) : 'Select time';
      hidden.dispatchEvent(new Event('change', { bubbles:true }));
      bg.remove();
    });
  }
  bg.addEventListener('click', ev => { if(ev.target === bg) bg.remove(); });
  document.body.appendChild(bg);
  render();
}

function openScheduleModal(project, step, sideRight){
  closeSidePanels();
  const shotStep = (project.steps || []).find(isShotListStep);
  const shootDates = getShootDates(project);
  const savedByDate = {};
  (step.scheduleDays || []).forEach(d => { if(d.date) savedByDate[d.date] = d; });
  const days = shootDates.length
    ? shootDates.map(d => Object.assign({ date:d, start:'', end:'', driveMinutes:'', uber:false, lunch:false, lunchStart:'', lunchMinutes:'60', others:[] }, savedByDate[d] || {}))
    : (step.scheduleDays && step.scheduleDays.length ? JSON.parse(JSON.stringify(step.scheduleDays)) : []);
  days.forEach(d => { if(!d.others) d.others = []; });

  const budgetStep = (project.steps || []).find(isBudgetStep);
  // operators from the Budget step whose day-by-day breakdown includes this date
  function operatorsForDay(date){
    if(!budgetStep || !budgetStep.budget || !budgetStep.budget.operators) return [];
    const list = [];
    budgetStep.budget.operators.forEach(op => {
      (op.items || []).forEach(it => {
        if(it.date === date) list.push({ role: op.role || 'Operator', task: it.label || '' });
      });
    });
    return list;
  }

  const bg = document.createElement('div');
  bg.className = 'modal-bg' + (sideRight ? ' side-right' : '');

  // works backward from the shoot start time: debrief (15m), then equipment set up (45m),
  // then drive time from the studio (plus 15m if it's an Uber) to get the leave-studio time.
  function morningSchedule(day){
    if(!day.start) return null;
    const [h,m] = day.start.split(':').map(Number);
    const startMin = h*60+m;
    const debriefStart = startMin - 15;
    const setupStart = debriefStart - 45;
    const arriveLocation = setupStart;
    const driveMin = (parseFloat(day.driveMinutes) || 0) + (day.uber ? 15 : 0);
    const leaveStudio = arriveLocation - driveMin;
    return {
      leaveStudio: minutesToClock(leaveStudio),
      arriveLocation: minutesToClock(arriveLocation),
      setupRange: `${minutesToClock(setupStart)} – ${minutesToClock(debriefStart)}`,
      debriefRange: `${minutesToClock(debriefStart)} – ${minutesToClock(startMin)}`,
      startClock: minutesToClock(startMin),
      driveMin,
    };
  }

  function sceneGroups(date){
    if(!shotStep || !shotStep.shotListRows) return [];
    // a single-shoot-day project (weddings, always exactly one day set at project creation) — every
    // shot belongs to that one day regardless of what each row's own (often hidden/unset, sometimes
    // stale from an old import) day value happens to be. Only projects with more than one shoot day
    // need shots actually matched to a specific date.
    const relevantRows = shootDates.length <= 1
      ? shotStep.shotListRows
      : shotStep.shotListRows.filter(r => r.day === date);
    const map = {};
    relevantRows.forEach(r => {
      const key = r.scene || '(No scene set)';
      if(!map[key]) map[key] = { count:0, cameras: new Set() };
      map[key].count++;
      // shooter assignment comes straight from whatever camera(s) are on that scene's shots —
      // "A&B" (or shots split across both cameras) means both shooters are covering it
      (r.camera || '').split(/[,&/]|\band\b/i).map(c => c.trim().toUpperCase()).filter(Boolean).forEach(c => map[key].cameras.add(c));
    });
    return Object.entries(map).map(([scene,data]) => ({
      scene, count: data.count,
      shooter: data.cameras.size > 1 ? 'Both' : (data.cameras.size === 1 ? [...data.cameras][0] : ''),
    }));
  }

  function allocate(day, groups){
    if(!day.start || !day.end || !groups.length) return groups.map(g => ({ ...g, range:null, perShotMin:null }));
    const [sh,sm] = day.start.split(':').map(Number);
    const [eh,em] = day.end.split(':').map(Number);
    let totalMin = (eh*60+em) - (sh*60+sm);
    if(totalMin <= 0) totalMin += 24*60;
    const hasLunch = !!(day.lunch && day.lunchStart);
    const lunchDur = hasLunch ? (parseFloat(day.lunchMinutes) || 60) : 0;
    const driveTimes = day.driveTimes || {};
    const totalDriveMin = groups.reduce((s,g) => s + (parseFloat(driveTimes[g.scene]) || 0), 0);
    const shootingMin = Math.max(1, totalMin - lunchDur - totalDriveMin);
    const totalShots = groups.reduce((s,g) => s+g.count, 0) || 1;
    let lunchStartMin = null;
    if(hasLunch){
      const [lh,lm] = day.lunchStart.split(':').map(Number);
      lunchStartMin = lh*60+lm;
    }
    let cursor = sh*60+sm;
    const dayEndMin = sh*60+sm + totalMin; // exact end of shooting, in the same minute-numbering cursor uses
    let lunchInserted = !hasLunch;
    const result = [];
    groups.forEach((g, idx) => {
      if(!lunchInserted && cursor >= lunchStartMin){
        result.push({ isLunch:true, range: `${minutesToClock(cursor)} – ${minutesToClock(cursor+lunchDur)}` });
        cursor += lunchDur;
        lunchInserted = true;
      }
      const driveMin = parseFloat(driveTimes[g.scene]) || 0;
      if(driveMin > 0){
        result.push({ isDrive:true, scene: g.scene, driveMin, range: `${minutesToClock(cursor)} – ${minutesToClock(cursor+driveMin)}` });
        cursor += driveMin;
      }
      // a manually-set scene time pins that scene's start — everything from here follows on from it
      const customTime = (day.sceneTimes || {})[g.scene];
      if(customTime){
        const [ch,cm] = customTime.split(':').map(Number);
        cursor = ch*60+cm;
      }
      const st = cursor;
      const isLast = idx === groups.length - 1;
      // the last scene always runs to the actual end of shooting, rather than whatever the
      // proportional split rounds to (which can land a minute or two short)
      cursor = isLast ? Math.max(dayEndMin, st + 1) : cursor + Math.max(1, Math.round(shootingMin * (g.count/totalShots)));
      result.push({ ...g, range: `${minutesToClock(st)} – ${minutesToClock(cursor)}`, perShotMin: Math.round((cursor-st)/g.count) });
    });
    if(!lunchInserted && hasLunch){
      result.push({ isLunch:true, range: `${minutesToClock(cursor)} – ${minutesToClock(cursor+lunchDur)}` });
    }
    return result;
  }
  // A/B/Both timeline for one shooter — every scene block (in order) that shooter covers
  // that shooter's scenes in order, with a "Driving" line inserted wherever the scene right
  // before it in the day (regardless of who shot it) has a drive time set
  function shooterTimeline(allocated, letter){
    const result = [];
    let pendingDrive = null;
    allocated.forEach(g => {
      if(g.isLunch){ pendingDrive = null; return; }
      if(g.isDrive){ pendingDrive = g; return; }
      if(g.shooter === letter || g.shooter === 'Both'){
        if(pendingDrive) result.push({ isDrive:true, driveMin: pendingDrive.driveMin });
        result.push(g);
      }
      pendingDrive = null;
    });
    return result;
  }

  function dayHtml(day, i){
    return project.projectType === 'wedding' ? dayHtmlWedding(day, i) : dayHtmlStandard(day, i);
  }

  function dayHeadAndTimeFields(day, i){
    const dayLabel = shootDates.length ? `Day ${i+1}` : `Shoot day`;
    const dateLabel = day.date ? fmtDate(day.date) : 'No date set';
    return `
        <div class="sched-day-head"><span class="loc-day">${esc(dayLabel)}</span><span class="loc-date">${esc(dateLabel)}</span></div>
        <div class="budget-op-fields">
          <div class="budget-op-field"><label>Start time</label>${timeFieldHtml('schedtime-start-' + i, day.start)}</div>
          <div class="budget-op-field"><label>End time</label>${timeFieldHtml('schedtime-end-' + i, day.end)}</div>
        </div>
        <div class="budget-op-fields" style="margin-top:8px;">
          <div class="budget-op-field"><label>Drive time from studio (mins)</label><input type="number" inputmode="numeric" data-schedfield="driveMinutes" data-idx="${i}" value="${esc(day.driveMinutes||'')}" placeholder="0"></div>
          <div class="budget-op-field" style="display:flex; align-items:flex-end;">
            <label class="budget-daytoggle" style="margin:0;"><input type="checkbox" data-schedfield="uber" data-idx="${i}" ${day.uber?'checked':''}> Uber (+15 min)</label>
          </div>
        </div>
        <div class="budget-op-fields" style="margin-top:8px;">
          <div class="budget-op-field" style="display:flex; align-items:flex-end;">
            <label class="budget-daytoggle" style="margin:0;"><input type="checkbox" data-schedfield="lunch" data-idx="${i}" ${day.lunch?'checked':''}> Lunch break</label>
          </div>
        </div>
        ${day.lunch ? `
        <div class="budget-op-fields" style="margin-top:8px;">
          <div class="budget-op-field"><label>Lunch start</label>${timeFieldHtml('schedtime-lunchstart-' + i, day.lunchStart)}</div>
          <div class="budget-op-field"><label>Duration (mins)</label><input type="number" inputmode="numeric" data-schedfield="lunchMinutes" data-idx="${i}" value="${esc(day.lunchMinutes||'60')}"></div>
        </div>
        ` : ''}`;
  }

  // the fuller, original layout for short films / music videos: morning schedule as its own
  // section, and "Scenes for this day" showing the bar chart, computed range, ≈time-per-shot,
  // and drive-to-X inline — distinct from the simplified wedding layout below
  function dayHtmlStandard(day, i){
    const groups = sceneGroups(day.date);
    const allocated = allocate(day, groups);
    const morning = morningSchedule(day);
    const onSet = operatorsForDay(day.date);
    return `
      <div class="sched-day">
        ${dayHeadAndTimeFields(day, i)}
        ${dayCastCrewHtml(i, onSet, day.others)}
        ${morning ? `
          <div class="sched-morning">
            <div class="loc-label" style="margin-top:10px;">Morning schedule — from ${esc(STUDIO_ADDRESS)}</div>
            <div class="sched-item"><div class="sched-item-scene">Leave studio</div><div class="sched-item-meta">${esc(morning.leaveStudio)}</div></div>
            <div class="sched-item"><div class="sched-item-scene">Arrive location</div><div class="sched-item-meta">${esc(morning.arriveLocation)}</div></div>
            <div class="sched-item"><div class="sched-item-scene">Equipment set up</div><div class="sched-item-meta">${esc(morning.setupRange)}</div></div>
            <div class="sched-item"><div class="sched-item-scene">Debrief</div><div class="sched-item-meta">${esc(morning.debriefRange)}</div></div>
            <div class="sched-item"><div class="sched-item-scene">Start</div><div class="sched-item-meta">${esc(morning.startClock)}</div></div>
          </div>
        ` : `<div class="timeline-hint" style="margin-top:8px;">Set a start time to work out the morning schedule from the studio.</div>`}
        ${groups.length ? `
          <div class="loc-label" style="margin-top:12px;">Scenes for this day</div>
          <div class="sched-bar">${allocated.map(g => `<span class="sched-seg${g.isLunch?' sched-seg-lunch':''}${g.isDrive?' sched-seg-drive':''}" style="flex-grow:${g.isLunch ? 3 : g.isDrive ? Math.max(1, Math.round(g.driveMin/5)) : g.count};" title="${g.isLunch ? 'Lunch' : g.isDrive ? 'Drive to ' + g.scene : esc(g.scene)}"></span>`).join('')}</div>
          <div class="sched-list">
            ${allocated.map(g => {
              if(g.isLunch) return `
                <div class="sched-item-wrap">
                  <div class="sched-item sched-lunch"><div class="sched-item-scene">Lunch break</div><div class="sched-item-meta">${esc(g.range)}</div></div>
                </div>`;
              if(g.isDrive) return `
                <div class="sched-item-wrap">
                  <div class="sched-item sched-drive"><div class="sched-item-scene">Drive to ${esc(g.scene)}</div><div class="sched-item-meta">${g.driveMin} min · ${esc(g.range)}</div></div>
                </div>`;
              return `
              <div class="sched-item-wrap">
                <div class="sched-item">
                  <div class="sched-item-scene">${esc(g.scene)}${g.shooter ? ` <span class="sched-shooter-badge">Cam ${esc(g.shooter)}</span>` : ''}</div>
                  <div class="sched-item-meta">${g.count} shot${g.count===1?'':'s'}${g.range ? ' · ' + esc(g.range) : ''}</div>
                </div>
                ${g.perShotMin !== null ? `<div class="sched-info-box">≈ ${g.perShotMin} min per shot (${g.range} split across ${g.count} shot${g.count===1?'':'s'})</div>` : ''}
                <div class="budget-op-fields" style="margin-top:6px;">
                  <div class="budget-op-field"><label>Custom time (optional)</label>${timeFieldHtml('schedscene-' + i + '__' + encodeURIComponent(g.scene), (day.sceneTimes && day.sceneTimes[g.scene]) || '')}</div>
                  <div class="budget-op-field"><label>Drive time before (mins)</label><input type="number" inputmode="numeric" min="0" data-drivetime="${i}__${esc(g.scene)}" value="${esc((day.driveTimes && day.driveTimes[g.scene]) || '')}" placeholder="0"></div>
                </div>
              </div>`;
            }).join('')}
          </div>
          ${(!day.start || !day.end) ? `<div class="timeline-hint" style="margin-top:8px;">Set a start and end time to allocate times per scene, and see time per shot.</div>` : ''}
          ${['A','B'].map(letter => {
            const tl = shooterTimeline(allocated, letter);
            return tl.length ? `
              <div class="loc-label" style="margin-top:14px;">Shooter ${letter} timeline</div>
              <div class="sched-list">
                ${tl.map(g => g.isDrive
                  ? `<div class="sched-item sched-drive"><div class="sched-item-scene">Driving</div><div class="sched-item-meta">${g.driveMin} min</div></div>`
                  : `<div class="sched-item"><div class="sched-item-scene">${esc(g.scene)}</div><div class="sched-item-meta">${g.range ? esc(g.range) : ''}</div></div>`
                ).join('')}
              </div>` : '';
          }).join('')}
        ` : `
          <p class="empty small">${(!shotStep || !shotStep.shotListRows || !shotStep.shotListRows.length) ? 'Your Shot list is empty — add shots there first.' : 'No shots matched to this day yet.'}</p>
          ${(shotStep && shotStep.shotListRows && shotStep.shotListRows.length) ? `<button type="button" class="btn small" data-assignallday="${i}" style="width:100%; margin-top:6px;">Assign all shots to this day</button>` : ''}
        `}
      </div>`;
  }

  // the simplified wedding layout: no bar chart, no per-shot time-split box, driving time only
  // shown inline within each shooter's own timeline (which also carries the morning schedule)
  function dayHtmlWedding(day, i){
    const groups = sceneGroups(day.date);
    const allocated = allocate(day, groups);
    const morning = morningSchedule(day);
    const onSet = operatorsForDay(day.date);
    return `
      <div class="sched-day">
        ${dayHeadAndTimeFields(day, i)}
        ${dayCastCrewHtml(i, onSet, day.others)}
        ${groups.length ? `
          <div class="loc-label" style="margin-top:12px;">Scenes for this day</div>
          <div class="sched-list">
            ${groups.map(g => `
              <div class="sched-item-wrap">
                <div class="sched-item">
                  <div class="sched-item-scene">${esc(g.scene)}${g.shooter ? ` <span class="sched-shooter-badge">Cam ${esc(g.shooter)}</span>` : ''}</div>
                </div>
                <div class="budget-op-fields" style="margin-top:6px;">
                  <div class="budget-op-field"><label>Custom time (optional)</label>${timeFieldHtml('schedscene-' + i + '__' + encodeURIComponent(g.scene), (day.sceneTimes && day.sceneTimes[g.scene]) || '')}</div>
                  <div class="budget-op-field"><label>Driving time from previous location (mins)</label><input type="number" inputmode="numeric" min="0" data-drivetime="${i}__${esc(g.scene)}" value="${esc((day.driveTimes && day.driveTimes[g.scene]) || '')}" placeholder="0"></div>
                </div>
              </div>`).join('')}
          </div>
          ${(!day.start || !day.end) ? `<div class="timeline-hint" style="margin-top:8px;">Set a start and end time to work out each shooter's timeline.</div>` : ''}
          ${['A','B'].map(letter => {
            const tl = shooterTimeline(allocated, letter);
            if(!tl.length) return '';
            return `
              <div class="loc-label" style="margin-top:14px;">Shooter ${letter} timeline</div>
              <div class="sched-list">
                ${morning ? `
                  <div class="sched-item"><div class="sched-item-scene">Leave studio</div><div class="sched-item-meta">${esc(morning.leaveStudio)}</div></div>
                  ${morning.driveMin > 0 ? `<div class="sched-item sched-drive"><div class="sched-item-scene">Driving</div><div class="sched-item-meta">${morning.driveMin} min</div></div>` : ''}
                  <div class="sched-item"><div class="sched-item-scene">Arrive location</div><div class="sched-item-meta">${esc(morning.arriveLocation)}</div></div>
                  <div class="sched-item"><div class="sched-item-scene">Equipment set up</div><div class="sched-item-meta">${esc(morning.setupRange)}</div></div>
                  <div class="sched-item"><div class="sched-item-scene">Debrief</div><div class="sched-item-meta">${esc(morning.debriefRange)}</div></div>
                  <div class="sched-item"><div class="sched-item-scene">Start</div><div class="sched-item-meta">${esc(morning.startClock)}</div></div>
                ` : `<div class="timeline-hint">Set a start time to work out the morning schedule from the studio.</div>`}
                ${tl.map(g => g.isDrive
                  ? `<div class="sched-item sched-drive"><div class="sched-item-scene">Driving</div><div class="sched-item-meta">${g.driveMin} min</div></div>`
                  : `<div class="sched-item"><div class="sched-item-scene">${esc(g.scene)}</div><div class="sched-item-meta">${g.range ? esc(g.range) : ''}</div></div>`
                ).join('')}
              </div>`;
          }).join('')}
        ` : `
          <p class="empty small">${(!shotStep || !shotStep.shotListRows || !shotStep.shotListRows.length) ? 'Your Shot list is empty — add shots there first.' : 'No shots matched to this day yet.'}</p>
          ${(shotStep && shotStep.shotListRows && shotStep.shotListRows.length) ? `<button type="button" class="btn small" data-assignallday="${i}" style="width:100%; margin-top:6px;">Assign all shots to this day</button>` : ''}
        `}
      </div>`;
  }

  function dayCastCrewHtml(i, onSet, others){
    const crewNames = onSet.map(o => o.role);
    return `
      <div class="loc-label" style="margin-top:10px;">Who's on set</div>
      <div class="sched-cc-block">
        <div class="sched-cc-line"><b>Crew:</b> ${crewNames.length ? crewNames.map(esc).join(', ') : 'No operators from Budget assigned to this date yet.'}</div>
        ${(others || []).map((o, oi) => `
          <div class="sched-other-row">
            <input type="text" class="sl-input" data-otherfield="${oi}" data-idx="${i}" value="${esc(o.text||'')}" placeholder="e.g. Dave — lead actor" style="width:100%;">
            <button type="button" class="mo-btn" data-removeother="${oi}" data-idx="${i}" aria-label="Remove person">&times;</button>
          </div>
        `).join('')}
        <button type="button" class="btn small" data-addother="${i}" style="width:100%;">+ Add cast / other person</button>
      </div>`;
  }

  function paint(){
    const prevModal = bg.querySelector('.modal');
    const scrollTop = prevModal ? prevModal.scrollTop : 0;
    bg.innerHTML = `
      <div class="modal">
        <h3>Shooting schedule of day</h3>
        ${days.length ? days.map(dayHtml).join('') : `<p class="empty small">Add shoot days in Edit details to build a schedule.</p>`}
        <div class="modal-actions">
          <button class="btn primary" id="schedSave" style="flex:1;">Close</button>
        </div>
      </div>`;
    const newModal = bg.querySelector('.modal');
    if(newModal) newModal.scrollTop = scrollTop;
    wire();
  }

  // every edit in this panel saves immediately — no separate Save step to remember
  async function persistSchedule(){
    step.scheduleDays = days;
    touchStep(step);
    touchProject(project);
    const ok = await saveProjects();
    if(!ok) showToast('Save failed — try again', true);
  }

  function wire(){
    bg.querySelectorAll('[data-addother]').forEach(btn => {
      btn.addEventListener('click', () => {
        days[parseInt(btn.dataset.addother,10)].others.push({ id: uid(), text:'' });
        paint();
        persistSchedule();
      });
    });
    bg.querySelectorAll('[data-removeother]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx,10);
        days[idx].others.splice(parseInt(btn.dataset.removeother,10), 1);
        paint();
        persistSchedule();
      });
    });
    bg.querySelectorAll('[data-otherfield]').forEach(el => {
      el.addEventListener('input', () => {
        const idx = parseInt(el.dataset.idx,10);
        days[idx].others[parseInt(el.dataset.otherfield,10)].text = el.value;
      });
      el.addEventListener('change', () => persistSchedule());
    });
    bg.querySelectorAll('[data-schedfield]').forEach(el => {
      el.addEventListener('change', () => {
        const idx = parseInt(el.dataset.idx,10);
        const field = el.dataset.schedfield;
        const day = days[idx];
        day[field] = el.type === 'checkbox' ? el.checked : el.value;
        if(field === 'lunch' && el.checked){
          // default: an hour, positioned at the midpoint of the shoot day
          if(!day.lunchStart && day.start && day.end){
            const [sh,sm] = day.start.split(':').map(Number);
            const [eh,em] = day.end.split(':').map(Number);
            let total = (eh*60+em) - (sh*60+sm);
            if(total <= 0) total += 24*60;
            day.lunchStart = minutesToHHMM((sh*60+sm) + Math.round(total/2));
          }
          if(!day.lunchMinutes) day.lunchMinutes = '60';
        }
        paint();
        persistSchedule();
      });
    });
    bg.querySelectorAll('[data-timefield^="schedtime-"]').forEach(el => {
      el.addEventListener('change', () => {
        const hidden = document.getElementById(el.dataset.timefield);
        const m = el.dataset.timefield.match(/^schedtime-(start|end|lunchstart)-(\d+)$/);
        const fieldMap = { start:'start', end:'end', lunchstart:'lunchStart' };
        if(m) days[parseInt(m[2],10)][fieldMap[m[1]]] = hidden.value;
        paint();
        persistSchedule();
      });
    });
    bg.querySelectorAll('[data-timefield^="schedscene-"]').forEach(el => {
      el.addEventListener('change', () => {
        const hidden = document.getElementById(el.dataset.timefield);
        const rest = el.dataset.timefield.slice('schedscene-'.length);
        const sep = rest.indexOf('__');
        const dayIdx = parseInt(rest.slice(0, sep), 10);
        const scene = decodeURIComponent(rest.slice(sep + 2));
        if(!days[dayIdx].sceneTimes) days[dayIdx].sceneTimes = {};
        days[dayIdx].sceneTimes[scene] = hidden.value;
        paint();
        persistSchedule();
      });
    });
    bg.querySelectorAll('[data-assignallday]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const dayIdx = parseInt(btn.dataset.assignallday, 10);
        const targetDate = days[dayIdx].date;
        if(!shotStep || !shotStep.shotListRows || !targetDate) return;
        shotStep.shotListRows.forEach(r => { r.day = targetDate; });
        shotStep.updatedAt = new Date().toISOString();
        const ok = await saveProjects();
        showToast(ok ? 'All shots assigned to this day' : 'Save failed', !ok);
        if(ok) paint();
      });
    });
    bg.querySelectorAll('[data-drivetime]').forEach(el => {
      el.addEventListener('input', () => {
        const [dayIdx, scene] = el.dataset.drivetime.split('__');
        if(!days[dayIdx].driveTimes) days[dayIdx].driveTimes = {};
        days[dayIdx].driveTimes[scene] = el.value;
        // no paint() here — rebuilding the whole panel on every keystroke destroys and recreates
        // this input, kicking focus out and jumping the scroll position while typing
      });
      el.addEventListener('change', () => { paint(); persistSchedule(); });
    });
    bg.querySelector('#schedSave').addEventListener('click', () => {
      bg.remove();
      render();
    });
  }
  bg.addEventListener('click', ev => {
    if(ev.target === bg){ bg.remove(); return; }
    const tTrigger = ev.target.closest('[data-timefield]');
    if(tTrigger) openTimePicker(tTrigger);
  });
  presentPanel(bg, step.id);
  paint();
}

function buildProjectOverviewText(project){
  const lines = [];
  lines.push(`${project.name || 'Untitled project'} — Project Overview`);
  if(project.client) lines.push(`Client: ${project.client}`);
  if(project.projectType) lines.push(`Project type: ${projectTypeLabel(project)}`);
  if(project.startDate) lines.push(`Project start: ${fmtDate(project.startDate)}`);
  if(project.deliveryDate) lines.push(`Delivery: ${fmtDate(project.deliveryDate)}`);
  lines.push(`Generated: ${fmtDate(new Date().toISOString().slice(0,10))}`);
  lines.push('');

  const meetingsStep = (project.steps || []).find(isMeetingsStep);
  const meetings = meetingsStep && meetingsStep.meetings ? meetingsStep.meetings.filter(m => m.date || m.before || m.after) : [];
  lines.push('===== CLIENT MEETINGS =====');
  if(meetings.length){
    meetings.slice().sort((a,b) => (a.date||'').localeCompare(b.date||'')).forEach(m => {
      lines.push(m.date ? fmtDate(m.date) : 'No date set');
      lines.push(`Before: ${m.before || '(none)'}`);
      lines.push(`After: ${m.after || '(none)'}`);
      lines.push('');
    });
  } else {
    lines.push('No client meetings logged.');
    lines.push('');
  }

  lines.push('===== TIMELINE FOR PRODUCTION =====');
  (project.steps || []).forEach(s => {
    if(s.hidden) return;
    const deadline = stepDeadline(s);
    const hasRange = !!(s.startDate && s.endDate);
    if(!deadline && !hasRange) return;
    lines.push(s.title || 'Untitled step');
    if(s.who) lines.push(`  Who: ${s.who}`);
    if(hasRange) lines.push(`  Planned: ${fmtDate(s.startDate)} to ${fmtDate(s.endDate)} (${daysBetweenIso(s.startDate, s.endDate) + 1} day${daysBetweenIso(s.startDate, s.endDate) === 0 ? '' : 's'} allotted)`);
    else lines.push(`  Date: ${fmtDate(deadline)}`);
    if(s.done){
      if(s.completedDate && s.startDate){
        const taken = daysBetweenIso(s.startDate, s.completedDate) + 1;
        lines.push(`  Completed ${fmtDate(s.completedDate)} — took ${taken} day${taken===1?'':'s'}`);
      } else if(s.completedDate){
        lines.push(`  Completed ${fmtDate(s.completedDate)}`);
      } else {
        lines.push('  Completed');
      }
      if(s.completedDate && s.endDate){
        if(s.completedDate < s.endDate){
          const early = daysBetweenIso(s.completedDate, s.endDate);
          lines.push(`  Finished ${early} day${early===1?'':'s'} ahead of plan`);
        } else if(s.completedDate > s.endDate){
          const late = daysBetweenIso(s.endDate, s.completedDate);
          lines.push(`  Ran ${late} day${late===1?'':'s'} over plan`);
        } else {
          lines.push('  Finished exactly on plan');
        }
      }
    } else {
      lines.push('  Not yet done');
    }
    if(s.originalEndDate && s.endDate && s.endDate > s.originalEndDate){
      const late = daysBetweenIso(s.originalEndDate, s.endDate);
      lines.push(`  Pushed back ${late} day${late===1?'':'s'} — originally due ${fmtDate(s.originalEndDate)}`);
    }
    lines.push('');
  });

  const overSteps = [], earlySteps = [];
  (project.steps || []).forEach(s => {
    if(s.hidden || !s.done || !s.completedDate || !s.endDate) return;
    if(s.completedDate > s.endDate) overSteps.push(`${s.title} (+${daysBetweenIso(s.endDate, s.completedDate)}d)`);
    else if(s.completedDate < s.endDate) earlySteps.push(`${s.title} (-${daysBetweenIso(s.completedDate, s.endDate)}d)`);
  });
  if(overSteps.length || earlySteps.length){
    lines.push('----- At a glance -----');
    lines.push(`Ran over: ${overSteps.length ? overSteps.join(', ') : 'none'}`);
    lines.push(`Finished ahead: ${earlySteps.length ? earlySteps.join(', ') : 'none'}`);
    lines.push('');
  }

  const shootDates = getShootDates(project);
  if(shootDates.length){
    lines.push('===== SHOOT DAYS =====');
    shootDates.forEach(d => lines.push(fmtDate(d)));
    lines.push('');
  }

  const budgetStep = (project.steps || []).find(isBudgetStep);
  const effBudget = budgetStep ? getEffectiveBudget(project, budgetStep) : null;
  if(effBudget){
    lines.push('===== BUDGET =====');
    lines.push(`Total: ${fmtMoney(budgetTotal(effBudget))}`);
    lines.push('');
  }

  return lines.join('\n');
}

let ENTITIES = [];

function slugify(name){
  let base = name.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,28) || 'item';
  let s = base, n = 1;
  while(ENTITIES.some(i => i.id === s)){ s = base + '-' + (++n); }
  return s;
}
function gearById(id){ return ENTITIES.find(e => e.id === id); }
function effectiveLocation(e){
  if(e.type === 'item' && !e.tracked && e.parentId){
    const p = gearById(e.parentId);
    if(p) return effectiveLocation(p);
  }
  return e.location;
}
function effectiveUpdatedAt(e){
  if(e.type === 'item' && !e.tracked && e.parentId){
    const p = gearById(e.parentId);
    if(p) return effectiveUpdatedAt(p);
  }
  return e.updatedAt;
}
// checked out only on the dates it's actually scheduled out — if today falls inside a schedule
// entry, that governs; otherwise fall back to the manually-set current location as before
function statusOf(e){
  if(e.type === 'item' && !e.tracked && e.parentId){
    const p = gearById(e.parentId);
    if(p) return statusOf(p);
  }
  const todayIso = new Date().toISOString().slice(0,10);
  const active = (e.schedule || []).find(s => s.startDate && todayIso >= s.startDate && todayIso <= (s.endDate || s.startDate));
  if(active) return active.location === HOME_BASE ? 'in' : 'out';
  return e.location === HOME_BASE ? 'in' : 'out';
}
function displayName(e){ return e.name + ((e.qty && e.qty > 1) ? ` (x${e.qty})` : ''); }
async function doSplit(e, splitQty){
  const total = e.qty || 1;
  if(total <= 1) return;
  let n = parseInt(splitQty, 10);
  if(!n || n < 1) n = 1;
  if(n > total) n = total;
  const remaining = total - n;
  const newItem = {
    id: slugify(e.name), name: e.name, category: e.category, type: 'item',
    parentId: e.parentId, tracked: true, qty: n,
    location: effectiveLocation(e), updatedAt: new Date().toISOString(), history: []
  };
  if(remaining <= 0){
    ENTITIES = ENTITIES.filter(x => x.id !== e.id);
  } else {
    e.qty = remaining;
  }
  ENTITIES.push(newItem);
  const ok = await saveEntities();
  if(ok){ showToast(`Split ${n} off — set the new location`); goItem(newItem.id); }
  else { showToast('Split failed — try again', true); }
}

function findBundledSibling(item, crateId){
  if(crateId === undefined) crateId = item.parentId;
  return ENTITIES.find(x => x.id !== item.id && x.type === 'item' && !x.tracked &&
    x.parentId === crateId && x.name === item.name && x.category === item.category);
}
async function doMove(item, targetCrateId, moveQty){
  const total = item.qty || 1;
  let n = parseInt(moveQty, 10);
  if(!n || n < 1) n = 1;
  if(n > total) n = total;
  const targetCrate = gearById(targetCrateId);
  if(!targetCrate) return;
  const sibling = findBundledSibling(item, targetCrateId);
  if(n >= total){
    if(sibling){
      sibling.qty = (sibling.qty || 1) + total;
      ENTITIES = ENTITIES.filter(x => x.id !== item.id);
    } else {
      item.parentId = targetCrateId;
      item.tracked = false;
    }
  } else {
    item.qty = total - n;
    if(sibling){
      sibling.qty = (sibling.qty || 1) + n;
    } else {
      ENTITIES.push({
        id: slugify(item.name), name: item.name, category: item.category, type: 'item',
        parentId: targetCrateId, tracked: false, qty: n,
        location: HOME_BASE, updatedAt: new Date().toISOString(), history: []
      });
    }
  }
  const ok = await saveEntities();
  showToast(ok ? `Moved to ${targetCrate.name}` : 'Move failed — try again', !ok);
  if(ok) goItem(targetCrateId);
}
