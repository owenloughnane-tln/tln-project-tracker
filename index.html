// removes "Used in Project" schedule tags left behind by projects that no longer exist at all —
// covers anything deleted before the Trash feature existed, or before purge started cleaning
// these up itself. Keeps tags for projects still sitting in Trash, since those can be restored.
async function cleanupOrphanedEquipmentSchedules(){
  const validProjectIds = new Set(PROJECTS.map(p => p.id));
  let changed = false;
  ENTITIES.forEach(e => {
    if(!e.schedule || !e.schedule.length) return;
    const before = e.schedule.length;
    e.schedule = e.schedule.filter(s => !s.projectId || validProjectIds.has(s.projectId));
    if(e.schedule.length !== before) changed = true;
  });
  if(changed) await saveEntities();
}

function migrateEntities(){
  let changed = false;
  // crates renamed since some people's data was first created — keep old saves in sync so presets
  // and anything else matching by exact name (e.g. GEAR_PRESETS) still find them
  const renames = { 'Gimbal Bag': 'Gimbal Box', 'Audio Bag': 'Audio Crate' };
  ENTITIES.forEach(e => {
    if(renames[e.name]){ e.name = renames[e.name]; changed = true; }
  });
  // LP-E6N batteries no longer live in the Battery Crate by default — pull any existing ones out
  ENTITIES.forEach(e => {
    if(e.name === 'LP-E6N Battery' && e.parentId === 'battery-pouch'){
      e.parentId = null;
      e.tracked = true;
      changed = true;
    }
  });
  ENTITIES.forEach(e => {
    if(e.type !== 'item') return;
    const m = e.name.match(/\(x(\d+)(,\s*([^)]*))?\)/i);
    if(m){
      const qty = parseInt(m[1], 10) || 1;
      let newName = m[3] ? e.name.replace(m[0], `(${m[3]})`) : e.name.replace(m[0], '');
      e.name = newName.replace(/\s+/g, ' ').trim();
      e.qty = qty;
      changed = true;
    } else if(typeof e.qty !== 'number'){
      e.qty = 1;
      changed = true;
    }
  });
  // one V-Mount battery should live in the Camera Crate by default — split it off an existing
  // battery stack in the Battery Crate if that split hasn't happened yet on this data
  const inCamera = ENTITIES.some(e => e.name === 'Wimaxxit V-Mount Battery' && e.parentId === 'camera-bag');
  if(!inCamera){
    const stack = ENTITIES.find(e => e.name === 'Wimaxxit V-Mount Battery' && e.parentId === 'battery-pouch' && e.qty > 1);
    if(stack){
      stack.qty -= 1;
      stack.updatedAt = new Date().toISOString();
      let newId = 'wimaxxit-v-mount-battery-camera', n = 2;
      while(ENTITIES.some(e => e.id === newId)) newId = 'wimaxxit-v-mount-battery-camera-' + (n++);
      ENTITIES.push({
        id: newId, name:'Wimaxxit V-Mount Battery', category: stack.category || 'Power', type:'item',
        parentId:'camera-bag', tracked:false, qty:1, location: HOME_BASE,
        updatedAt: new Date().toISOString(), history: [],
      });
      changed = true;
    }
  }
  return changed;
}
async function loadEntities(){
  try{
    const res = await window.storage.get(GEAR_STORE_KEY, true);
    ENTITIES = res && res.value ? JSON.parse(res.value) : null;
  }catch(e){ ENTITIES = null; }
  if(!ENTITIES){
    ENTITIES = seedData();
    await saveEntities();
  } else if(migrateEntities()){
    await saveEntities();
  }
}
async function saveEntities(){
  const json = JSON.stringify(ENTITIES);
  if(json.length > 4600000){
    showToast('Your equipment list is too large to save — remove some old crates/items to free up space', true);
    return false;
  }
  try{ await window.storage.set(GEAR_STORE_KEY, json, true); return true; }
  catch(e){ console.error('storage save failed', e); showToast('Save failed — your previous data is safe, but this change was not saved. Try again.', true); return false; }
}


function gearGetRoute(){
  let h = location.hash.slice(1);
  if(h.startsWith('equip:')) h = h.slice(6);
  else if(h === 'equip') h = '';
  if(h === 'cal') return {view:'calendar'};
  if(h.startsWith('item=')) return {view:'item', id: decodeURIComponent(h.slice(5))};
  return {view:'list'};
}
function goList(){ location.hash = 'equip'; }
function goItem(id){ location.hash = 'equip:item=' + encodeURIComponent(id); }
function goGearCalendar(){ location.hash = 'equip:cal'; }

async function renderGear(){
  const app = document.getElementById('app');
  const route = gearGetRoute();
  if(route.view === 'item'){
    const e = gearById(route.id);
    if(!e){ gearRenderNotFound(app, route.id); return; }
    gearRenderDetail(app, e);
  } else if(route.view === 'calendar'){
    renderGearCalendar(app);
  } else {
    gearRenderList(app);
  }
}

// every date any tracked item/crate is scheduled somewhere other than the studio, expanded across
// each entry's date range — used to mark "out" days on the equipment calendar
function gatherGearScheduleEvents(){
  const events = [];
  ENTITIES.forEach(e => {
    (e.schedule || []).forEach(s => {
      if(!s.startDate) return;
      if((s.location || '').trim() === HOME_BASE) return;
      const start = new Date(s.startDate + 'T00:00:00');
      const end = s.endDate ? new Date(s.endDate + 'T00:00:00') : start;
      if(end < start) return;
      for(let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)){
        events.push({ date: d.toISOString().slice(0,10), name: displayName(e), location: s.location || 'Unknown', entityId: e.id });
      }
    });
  });
  return events;
}

function renderGearCalendar(app){
  const events = gatherGearScheduleEvents();
  const today = new Date();
  let viewYear = today.getFullYear(), viewMonth = today.getMonth();
  let selectedDate = today.toISOString().slice(0,10);

  function eventsOn(dateStr){ return events.filter(e => e.date === dateStr); }

  function paint(){
    const first = new Date(viewYear, viewMonth, 1);
    const startWeekday = first.getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
    const todayISO = today.toISOString().slice(0,10);

    let cells = '';
    for(let i = startWeekday - 1; i >= 0; i--) cells += `<div class="pcal-day dim"><span class="pcal-daynum">${daysInPrevMonth - i}</span></div>`;
    for(let d = 1; d <= daysInMonth; d++){
      const iso = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayEvents = eventsOn(iso);
      const cls = ['pcal-day'];
      if(iso === todayISO) cls.push('today');
      if(iso === selectedDate) cls.push('selected');
      const dots = dayEvents.slice(0,4).map(e => `<span class="pcal-dot" style="background:${taskColor(e.location)};"></span>`).join('');
      const more = dayEvents.length > 4 ? `<span class="pcal-more">+${dayEvents.length-4}</span>` : '';
      cells += `<div class="${cls.join(' ')}" data-date="${iso}"><span class="pcal-daynum">${d}</span><span class="pcal-dots">${dots}${more}</span></div>`;
    }
    const trailing = (7 - ((startWeekday + daysInMonth) % 7)) % 7;
    for(let d = 1; d <= trailing; d++) cells += `<div class="pcal-day dim"><span class="pcal-daynum">${d}</span></div>`;

    const dayEvents = eventsOn(selectedDate).sort((a,b) => a.name.localeCompare(b.name));

    app.innerHTML = `
      <div style="padding-top:16px;">
      <button class="back" id="calBack">← All gear</button>
      <div class="dcal-header">
        <button type="button" class="dcal-nav" id="calPrev" aria-label="Previous month">&#8249;</button>
        <div class="dcal-title">${CAL_MONTH_NAMES[viewMonth]} ${viewYear}</div>
        <button type="button" class="dcal-nav" id="calNext" aria-label="Next month">&#8250;</button>
      </div>
      <p class="empty small" style="margin-top:0;">Days marked show equipment scheduled away from ${esc(HOME_BASE)}.</p>
      <div class="dcal-weekdays"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>
      <div class="pcal-grid">${cells}</div>
      <div class="section-label"><span>${esc(fmtDate(selectedDate))}</span></div>
      <div class="cal-events-list">
        ${dayEvents.length ? dayEvents.map(e => `
          <div class="cal-event-item" data-eventitem="${e.entityId}" style="border-left-color:${taskColor(e.location)};">
            <div>
              <div class="cal-event-title">${esc(e.name)}</div>
              <div class="cal-event-project">${esc(e.location)}</div>
            </div>
          </div>`).join('') : `<div class="empty small">Everything's at the studio this day.</div>`}
      </div>
      </div>`;
    wire();
  }

  function wire(){
    document.getElementById('calBack').addEventListener('click', () => goList());
    document.getElementById('calPrev').addEventListener('click', () => { viewMonth--; if(viewMonth < 0){ viewMonth = 11; viewYear--; } paint(); });
    document.getElementById('calNext').addEventListener('click', () => { viewMonth++; if(viewMonth > 11){ viewMonth = 0; viewYear++; } paint(); });
    document.querySelectorAll('[data-date]').forEach(el => {
      el.addEventListener('click', () => { selectedDate = el.dataset.date; paint(); });
    });
    document.querySelectorAll('[data-eventitem]').forEach(el => {
      el.addEventListener('click', () => goItem(el.dataset.eventitem));
    });
  }
  paint();
}

function gearRenderList(app){
  const search = (app.dataset.search || '').toLowerCase();
  const preset = app.dataset.preset || '';
  const presetNames = GEAR_PRESETS[preset] || null;
  // presets can name items bundled inside a crate (not "top level"), so search everything rather
  // than just tracked/top-level entities when a preset is active
  const base = presetNames ? ENTITIES.filter(e => presetNames.includes(e.name)) : topLevel();
  const all = base.filter(i => !search || i.name.toLowerCase().includes(search) || i.category.toLowerCase().includes(search));
  const crates = all.filter(i => i.type === 'crate').sort((a,b) => new Date(effectiveUpdatedAt(b)) - new Date(effectiveUpdatedAt(a)));
  const loose = all.filter(i => i.type !== 'crate'); // tracked items not sitting in any crate

  const byCategory = {};
  loose.forEach(i => {
    const cat = i.category || 'Uncategorised';
    (byCategory[cat] = byCategory[cat] || []).push(i);
  });
  const categoryNames = Object.keys(byCategory).sort((a,b) => a.localeCompare(b));

  app.innerHTML = `
    ${gearRenderHeader()}
    <div class="toolbar">
      <input type="search" id="searchBox" placeholder="Search gear…" value="${esc(app.dataset.search||'')}">
      <button class="btn icon-btn" id="refreshBtn" style="padding:11px 13px; font-size:16px;">↻</button>
      <button class="btn primary" id="addBtn">+ Add</button>
    </div>
    <div class="preset-row">
      <button class="btn small ${preset==='basic'?'primary':''}" data-preset="basic" style="flex:1;">Basic</button>
      <button class="btn small ${preset==='wedding'?'primary':''}" data-preset="wedding" style="flex:1;">Wedding</button>
      ${preset ? `<button class="btn small ghost" data-preset="" style="flex:none;">Clear</button>` : ''}
    </div>
    <div id="listWrap">
      ${crates.length ? `<div class="section-label"><span>Crates (${crates.length})</span></div>${crates.map(gearCardHtml).join('')}` : ''}
      ${categoryNames.length ? `
        <div class="section-label"><span>Not in a crate (${loose.length})</span></div>
        ${categoryNames.map(cat => `
          <details class="dropdown-group" data-cat="${esc(cat)}" ${gearExpandedCategories.has(cat) || search ? 'open' : ''}>
            <summary>${esc(cat)} <span class="dropdown-count">${byCategory[cat].length}</span></summary>
            <div class="dropdown-body">${byCategory[cat]
              .sort((a,b) => new Date(effectiveUpdatedAt(b)) - new Date(effectiveUpdatedAt(a)))
              .map(gearCardHtml).join('')}</div>
          </details>
        `).join('')}
      ` : ''}
      ${!crates.length && !categoryNames.length ? `<div class="empty">No gear matches. Add your first crate or item to get started.</div>` : ''}
    </div>
    ${renderBottomNav('equipment')}
  `;
  document.querySelectorAll('[data-preset]').forEach(btn => {
    btn.addEventListener('click', () => {
      app.dataset.preset = btn.dataset.preset;
      gearRenderList(app);
    });
  });
  wireNavtabs(app);
  document.querySelectorAll('.dropdown-group').forEach(d => {
    d.addEventListener('toggle', () => {
      if(d.open) gearExpandedCategories.add(d.dataset.cat);
      else gearExpandedCategories.delete(d.dataset.cat);
    });
  });
  document.getElementById('searchBox').addEventListener('input', e => {
    app.dataset.search = e.target.value;
    gearRenderList(app);
    const box = document.getElementById('searchBox');
    box.focus(); box.setSelectionRange(e.target.value.length, e.target.value.length);
  });
  document.getElementById('refreshBtn').addEventListener('click', async () => {
    await loadEntities();
    gearRenderList(app);
    showToast('Synced');
  });
  document.getElementById('addBtn').addEventListener('click', () => openAddModal());
  document.getElementById('gearCalBtn').addEventListener('click', () => goGearCalendar());
  [...crates, ...loose].forEach(e => document.getElementById('card-'+e.id).addEventListener('click', () => goItem(e.id)));
}

function gearCardHtml(e){
  const st = statusOf(e);
  let sub = '';
  if(e.type === 'crate'){
    const kids = childrenOf(e.id);
    const bundled = kids.filter(k => !k.tracked).length;
    const branched = kids.filter(k => k.tracked).length;
    sub = `<div class="card-sub">${bundled} item${bundled===1?'':'s'} bundled${branched ? ` · ${branched} tracked separately` : ''}</div>`;
  } else if(e.parentId){
    const p = gearById(e.parentId);
    sub = `<div class="card-sub">tracked separately from ${esc(p ? p.name : 'crate')}</div>`;
  }
  return `
    <div class="card" id="card-${e.id}">
      <div class="dot ${st}"></div>
      <div class="card-body">
        <div class="card-name">${esc(displayName(e))} ${e.type==='crate' ? '<span class="tag-chip crate">Crate</span>' : ''}</div>
        <div class="card-meta"><span class="tag-chip">${esc(e.category)}</span></div>
        <div class="card-loc">${esc(effectiveLocation(e))}</div>
        ${sub}
      </div>
      <div class="card-time">${timeAgo(effectiveUpdatedAt(e))}</div>
    </div>`;
}

      selectedChip = chip.dataset.loc;
      document.getElementById('customLoc').value = '';
      document.querySelectorAll('#chips .chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
      const rentalField = document.getElementById('rentalField');
      if(selectedChip === 'Rental'){
        rentalField.style.display = 'block';
      } else {
        rentalField.style.display = 'none';
        document.getElementById('renterName').value = '';
      }
    });
  });
  document.getElementById('customLoc').addEventListener('input', ev => {
    if(ev.target.value){
      selectedChip = null;
      document.querySelectorAll('#chips .chip').forEach(c => c.classList.remove('selected'));
      document.getElementById('rentalField').style.display = 'none';
      document.getElementById('renterName').value = '';
    }
  });
  document.getElementById('saveBtn').addEventListener('click', async () => {
    const customVal = document.getElementById('customLoc').value.trim();
    let newLoc = null;
    if(customVal){
      newLoc = customVal;
    } else if(selectedChip === 'Rental'){
      const renter = document.getElementById('renterName').value.trim();
      newLoc = renter ? `Rental — ${renter}` : 'Rental';
    } else if(selectedChip){
      newLoc = selectedChip;
    }
    if(!newLoc){ showToast('Pick or type a location first', true); return; }
    const prevLoc = e.location;
    e.history = e.history || [];
    if(prevLoc !== newLoc) e.history.push({location: prevLoc, at: e.updatedAt});
    e.location = newLoc;
    e.updatedAt = new Date().toISOString();
    const ok = await saveEntities();
    showToast(ok ? 'Saved' : 'Save failed — try again', !ok);
    if(ok) goList();
  });
  document.getElementById('deleteBtn').addEventListener('click', async () => {
    const kids = e.type === 'crate' ? childrenOf(e.id) : [];
    const warn = kids.length ? ` This will also remove ${kids.length} item(s) inside it.` : '';
    openConfirmModal(`Remove "${e.name}" from the gear log?${warn}`, async () => {
      const idsToRemove = new Set([e.id, ...kids.map(k => k.id)]);
      ENTITIES = ENTITIES.filter(x => !idsToRemove.has(x.id));
      await saveEntities();
      goList();
    });
  });
  if(e.type === 'crate'){
    document.querySelectorAll('[data-track]').forEach(btn => {
      btn.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        const child = gearById(btn.dataset.track);
        child.tracked = true;
        child.location = effectiveLocation(e);
        child.updatedAt = new Date().toISOString();
        child.history = child.history || [];
        const ok = await saveEntities();
        showToast(ok ? `Now tracking "${child.name}" separately` : 'Failed', !ok);
        if(ok) renderGear();
      });
    });
    document.querySelectorAll('[data-uncrate]').forEach(btn => {
      btn.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        const child = gearById(btn.dataset.uncrate);
        child.tracked = true;
        child.location = effectiveLocation(e);
        child.parentId = null;
        child.updatedAt = new Date().toISOString();
        child.history = child.history || [];
        const ok = await saveEntities();
        showToast(ok ? `Removed "${child.name}" from ${e.name}` : 'Failed', !ok);
        if(ok) renderGear();
      });
    });
    document.querySelectorAll('[data-split]').forEach(btn => {
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const child = gearById(btn.dataset.split);
        openSplitModal(child);
      });
    });
    document.querySelectorAll('[data-move]').forEach(btn => {
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const child = gearById(btn.dataset.move);
        openMoveModal(child);
      });
    });
    document.querySelectorAll('[data-goto]').forEach(row => {
      row.addEventListener('click', () => goItem(row.dataset.goto));
    });
    const addChildBtn = document.getElementById('addChildBtn');
    if(addChildBtn) addChildBtn.addEventListener('click', () => openAddModal({parentId: e.id}));
  }
}

// assigns this item/crate to a project for all of that project's shoot days: tags the entity's
// schedule as "Used in Project" for each day, and adds it to that project's Equipment lists step
// so it shows up there automatically too
function openAssignProjectModal(entity){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  const candidates = PROJECTS.filter(p => p.status !== 'finished' && !p.deletedAt && getShootDates(p).length);
  bg.innerHTML = `
    <div class="modal">
      <h3>Assign to a project</h3>
      ${candidates.length ? `
        <div class="sched-list">
          ${candidates.map(p => `
            <div class="sched-item" data-assignproj="${p.id}" style="cursor:pointer;">
              <div class="sched-item-scene">${esc(p.name)}</div>
              <div class="sched-item-meta">${getShootDates(p).length} shoot day${getShootDates(p).length===1?'':'s'}</div>
            </div>
          `).join('')}
        </div>
      ` : `<p class="empty small">No current or upcoming projects with shoot dates set yet.</p>`}
      <div class="modal-actions">
        <button class="btn ghost" id="assignCancel" style="flex:1;">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click', ev => { if(ev.target === bg) bg.remove(); });
  bg.querySelector('#assignCancel').addEventListener('click', () => bg.remove());
  bg.querySelectorAll('[data-assignproj]').forEach(row => {
    row.addEventListener('click', async () => {
      const project = byId(row.dataset.assignproj);
      if(!project) return;
      let step = (project.steps || []).find(isEquipmentListsStep);
      if(!step){ showToast("This project doesn't have an Equipment lists step", true); return; }
      const days = getShootDates(project);

      // clear any stale tags this entity had for this same project first, so re-assigning is safe
      entity.schedule = (entity.schedule || []).filter(s => s.projectId !== project.id);
      if(!step.equipmentByDay) step.equipmentByDay = {};
      days.forEach(day => {
        entity.schedule.push({ id: uid(), location:'Used in Project', startDate:day, endDate:day, projectId:project.id, stepId:step.id });
        if(!step.equipmentByDay[day]) step.equipmentByDay[day] = [];
        if(!step.equipmentByDay[day].some(x => normalizeEquipEntry(x).id === entity.id)) step.equipmentByDay[day].push({ id: entity.id, qty: 1 });
      });
      touchStep(step);
      touchProject(project);

      const ok1 = await saveEntities();
      const ok2 = await saveProjects();
      bg.remove();
      showToast((ok1 && ok2) ? `Assigned to ${project.name} for ${days.length} day${days.length===1?'':'s'}` : 'Save failed', !(ok1 && ok2));
      if(ok1 && ok2) renderGear();
    });
  });
}

        <button class="btn primary" id="confirmAdd" style="flex:1;">Add</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  let mode = opts.parentId ? 'item' : 'crate';
  const tabCrate = bg.querySelector('#tabCrate'), tabItem = bg.querySelector('#tabItem');
  const itemFields = bg.querySelector('#itemOnlyFields');
  function syncMode(){
    tabCrate.classList.toggle('active', mode==='crate');
    tabItem.classList.toggle('active', mode==='item');
    itemFields.style.display = mode==='item' ? 'block' : 'none';
  }
  tabCrate.addEventListener('click', () => { mode='crate'; syncMode(); });
  tabItem.addEventListener('click', () => { mode='item'; syncMode(); });
  syncMode();
  bg.querySelector('#cancelAdd').addEventListener('click', () => bg.remove());
  bg.addEventListener('click', ev => { if(ev.target === bg) bg.remove(); });
  bg.querySelector('#confirmAdd').addEventListener('click', async () => {
    const name = bg.querySelector('#newName').value.trim();
    if(!name){ showToast('Give it a name first', true); return; }
    const category = bg.querySelector('#newCat').value;
    const startLoc = bg.querySelector('#newLoc').value;
    let entity;
    if(mode === 'crate'){
      entity = {id: slugify(name), name, category, type:'crate', parentId:null, tracked:true, location:startLoc, updatedAt:new Date().toISOString(), history:[]};
    } else {
      const parentId = bg.querySelector('#newParent').value || null;
      const trackedFromStart = bg.querySelector('#newTracked').checked || !parentId;
      const parent = parentId ? gearById(parentId) : null;
      entity = {
        id: slugify(name), name, category, type:'item', parentId,
        tracked: trackedFromStart, qty: 1,
        location: trackedFromStart ? (parent ? effectiveLocation(parent) : startLoc) : (parent ? parent.location : startLoc),
        updatedAt: new Date().toISOString(), history: []
      };
    }
    ENTITIES.push(entity);
    const ok = await saveEntities();
    bg.remove();
    if(ok){ showToast('Added'); renderGear(); } else { showToast('Save failed', true); }
  });
}

(async function init(){
  const ok = await loadProjects();
  await loadEntities();
  if(!ok){
    document.getElementById('app').innerHTML = `
      ${renderHeader()}
      <div class="empty">Couldn't load your projects right now.<br>This usually means the saved data is stuck or too large for storage to return.<br><br>
      <button class="btn" id="retryLoadBtn">Try again</button><br><br>
      <button class="btn small" id="diagLoadBtn">Run diagnostics</button><br><br>
      <div id="diagResults" style="text-align:left; font-family:var(--mono); font-size:11px; white-space:pre-wrap; max-width:420px; margin:0 auto 14px; padding:10px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); display:none;"></div>
      <button class="btn danger small" id="resetLoadBtn">Start fresh (clears saved data)</button></div>`;
    document.getElementById('calBtn').addEventListener('click', () => goCalendar());
  document.getElementById('contributorBtn').addEventListener('click', () => promptContributorName());
    document.getElementById('retryLoadBtn').addEventListener('click', () => location.reload());
    document.getElementById('diagLoadBtn').addEventListener('click', async () => {
      const out = document.getElementById('diagResults');
      out.style.display = 'block';
      out.textContent = 'Running diagnostics…';
      const lines = [];
      // legacy single-blob key — kept only for reference during the migration window
      try{
        const res = await window.storage.get(STORE_KEY, true);
        const len = res && res.value ? res.value.length : 0;
        lines.push(`legacy ${STORE_KEY} get: succeeded — value length ${len} chars`);
      }catch(e){
        lines.push(`legacy ${STORE_KEY} get: FAILED — ${e.message || e}`);
      }
      // new per-project storage — the index, plus each individual project's own key
      let ids = [];
      try{
        const idxRes = await window.storage.get(PROJECT_INDEX_KEY, true);
        ids = idxRes && idxRes.value ? JSON.parse(idxRes.value) : [];
        lines.push(`${PROJECT_INDEX_KEY} get: succeeded — ${ids.length} project id(s) listed`);
      }catch(e){
        lines.push(`${PROJECT_INDEX_KEY} get: FAILED — ${e.message || e}`);
      }
      for(const id of ids){
        try{
          const pRes = await window.storage.get(projectKey(id), true);
          const len = pRes && pRes.value ? pRes.value.length : 0;
          lines.push(`${projectKey(id)} get: succeeded — value length ${len} chars`);
        }catch(e){
          lines.push(`${projectKey(id)} get: FAILED — ${e.message || e}`);
        }
      }
      // is it specific to project data, or is storage broken entirely?
      try{
        const res2 = await window.storage.get('gear-items-v2', true);
        lines.push(`gear-items-v2 get: succeeded — value length ${res2 && res2.value ? res2.value.length : 0} chars`);
      }catch(e){
        lines.push(`gear-items-v2 get: FAILED — ${e.message || e}`);
      }
      try{
        const res3 = await window.storage.list('', true);
        lines.push(`list(): succeeded — ${res3 && res3.keys ? res3.keys.length : 0} keys found`);
      }catch(e){
        lines.push(`list(): FAILED — ${e.message || e}`);
      }
      out.textContent = lines.join('\n');
    });
    document.getElementById('resetLoadBtn').addEventListener('click', () => {
      openConfirmModal('This will permanently erase all saved projects and start empty. Only do this if reloading has not worked. Continue?', async () => {
        try{ await window.storage.set(PROJECT_INDEX_KEY, JSON.stringify([]), true); }catch(e){}
        location.reload();
      });
    });
    return;
  }
  await createExampleProjectIfMissing();
  await cleanupOrphanedEquipmentSchedules();
  render();
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') refreshAndRender();
  });
  window.addEventListener('focus', refreshAndRender);
  setInterval(refreshAndRender, 20000);
})();
</script>
