}

const CAL_MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function renderCalendarView(app, scopeProject){
  const events = scopeProject ? gatherCalendarEvents().filter(e => e.projectId === scopeProject.id) : gatherCalendarEvents();
  const currentProjects = scopeProject ? [scopeProject] : PROJECTS.filter(p => p.status === 'current' && !p.deletedAt);
  const today = new Date();
  let viewYear = today.getFullYear(), viewMonth = today.getMonth();
  let selectedDate = today.toISOString().slice(0,10);

  function eventsOn(dateStr){ return events.filter(e => e.date === dateStr); }

  function paint(){
    const first = new Date(viewYear, viewMonth, 1);
    const startWeekday = first.getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
    const todayISO = today.toISOString().slice(0,10);

    let cells = '';
    for(let i = startWeekday - 1; i >= 0; i--) cells += `<div class="pcal-day dim"><span class="pcal-daynum">${daysInPrevMonth - i}</span></div>`;
    for(let d = 1; d <= daysInMonth; d++){
      const iso = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayEvents = eventsOn(iso);
      const cls = ['pcal-day'];
      if(iso === todayISO) cls.push('today');
      if(iso === selectedDate) cls.push('selected');
      const dots = dayEvents.slice(0,4).map(e => `<span class="pcal-dot" style="background:${scopeProject ? taskColor(e.label) : e.color};"></span>`).join('');
      const more = dayEvents.length > 4 ? `<span class="pcal-more">+${dayEvents.length-4}</span>` : '';
      cells += `<div class="${cls.join(' ')}" data-date="${iso}"><span class="pcal-daynum">${d}</span><span class="pcal-dots">${dots}${more}</span></div>`;
    }
    const trailing = (7 - ((startWeekday + daysInMonth) % 7)) % 7;
    for(let d = 1; d <= trailing; d++) cells += `<div class="pcal-day dim"><span class="pcal-daynum">${d}</span></div>`;

    const dayEvents = eventsOn(selectedDate).sort((a,b) => a.projectName.localeCompare(b.projectName));
    const typeLabel = { step:'Step', shoot:'Shoot', delivery:'Delivery', crew:'Crew', prep:'Prep', meeting:'Meeting' };

    app.innerHTML = `
      <div style="padding-top:16px;">
      <button class="back" id="calBack">${scopeProject ? '← ' + esc(scopeProject.name) : '← Board'}</button>
      <div class="dcal-header">
        <button type="button" class="dcal-nav" id="calPrev" aria-label="Previous month">&#8249;</button>
        <div class="dcal-title">${CAL_MONTH_NAMES[viewMonth]} ${viewYear}</div>
        <button type="button" class="dcal-nav" id="calNext" aria-label="Next month">&#8250;</button>
      </div>
      ${!scopeProject
        ? (currentProjects.length ? `<div class="cal-legend">${currentProjects.map(p => `<span class="cal-legend-item"><span class="cal-legend-dot" style="background:${projectColor(p.id)};"></span>${esc(p.name)}</span>`).join('')}</div>` : `<p class="empty small">No current projects yet — their deadlines will show up here.</p>`)
        : ''}
      <div class="dcal-weekdays"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>
      <div class="pcal-grid">${cells}</div>
      <div class="section-label"><span>${esc(fmtDate(selectedDate))}</span></div>
      <div class="cal-events-list">
        ${dayEvents.length ? dayEvents.map(e => `
          <div class="cal-event-item" data-eventproj="${e.projectId}" style="border-left-color:${scopeProject ? taskColor(e.label) : e.color};">
            <div>
              <div class="cal-event-title" style="${e.done ? 'color:var(--text-dim);' : ''}">${esc(e.label)}</div>
              <div class="cal-event-project">${esc(e.projectName)}</div>
            </div>
            <span class="tag-chip" style="background:${e.color}22; color:${e.color};">${typeLabel[e.type] || 'Event'}</span>
          </div>`).join('') : `<div class="empty small">Nothing on this day.</div>`}
      </div>
      </div>`;
    wire();
  }

  function wire(){
    document.getElementById('calBack').addEventListener('click', () => scopeProject ? goProject(scopeProject.id) : goTab('current'));
    document.getElementById('calPrev').addEventListener('click', () => { viewMonth--; if(viewMonth < 0){ viewMonth = 11; viewYear--; } paint(); });
    document.getElementById('calNext').addEventListener('click', () => { viewMonth++; if(viewMonth > 11){ viewMonth = 0; viewYear++; } paint(); });
    document.querySelectorAll('[data-date]').forEach(el => {
      el.addEventListener('click', () => { selectedDate = el.dataset.date; paint(); });
    });
    document.querySelectorAll('[data-eventproj]').forEach(el => {
      el.addEventListener('click', () => goProject(el.dataset.eventproj));
    });
  }
  paint();
}

function renderDetail(app, p){
  const stage = deriveStage(p);
  const dotClass = projectDotClass(p);
  const stageText = stage === 'wrap' ? 'Wrapped' : stage ? stageLabel(stage) : 'Not started';
  const latest = deriveLatestNote(p);
  const deadlines = upcomingDeadlines(p);
  const completedUnacked = (p.steps||[]).filter(s => s.done && s.completionAcked === false);
  const showHidden = app.dataset.showHidden === '1';
  const totalHidden = (p.steps || []).filter(s => s.hidden).length;

  const stageSections = STAGES.map(stg => {
    const allSteps = (p.steps || []).filter(s => s.stage === stg.key);
    const steps = showHidden ? allSteps : allSteps.filter(s => !s.hidden);
    return `
      <div class="section-label"><span>${stg.label} (${steps.length})</span></div>
      ${steps.length ? steps.map(s => `
        <div class="contents-row tracked ${s.done ? 'row-done' : ''} ${s.hidden ? 'row-hidden' : ''}" data-step="${s.id}">
          <div class="name" style="${s.done ? 'color:var(--in);' : ''}">${esc(s.title || 'Untitled step')}${s.hidden ? ' <span class="tag-chip blank">Hidden</span>' : ''}<small>${[s.who, stepDeadline(s) ? fmtDate(stepDeadline(s)) : 'No date', s.progressNote ? truncate(s.progressNote, 44) : '', s.lastEditedBy ? `edited by ${s.lastEditedBy}` : ''].filter(Boolean).map(esc).join(' · ')}</small></div>
          <div class="step-actions">
            <button type="button" class="mo-btn" data-note="${s.id}" aria-label="Progress note" title="Progress note">
              <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 4.5h13l3 3v12h-16z" fill="var(--yellow)" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M17 4.5v3h3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" class="mo-btn" data-edit="${s.id}" aria-label="Edit step" title="Edit step">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 000-3l2-1.5-2-3.4-2.4.9a7.6 7.6 0 00-2.5-1.5L14.1 2.6h-4l-.4 2.4A7.6 7.6 0 007.2 6.5l-2.4-.9-2 3.4 2 1.5a7.6 7.6 0 000 3l-2 1.5 2 3.4 2.4-.9a7.6 7.6 0 002.5 1.5l.4 2.4h4l.4-2.4a7.6 7.6 0 002.5-1.5l2.4.9 2-3.4z"/></svg>
            </button>
            <button type="button" class="dot-btn" data-donedot="${s.id}" aria-label="Toggle done">
              <span class="dot ${stepDotClass(s)}" style="width:8px; height:8px; margin-top:0;"></span>
            </button>
          </div>
        </div>`).join('') : `<div style="font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:10px;">No steps yet.</div>`}
      <button class="btn small" data-addstep="${stg.key}">+ Add step</button>
    `;
  }).join('');

  const shootDates = getShootDates(p);
  const shootDiff = daysUntil(nextShootDate(shootDates));
  const deliveryDiff = daysUntil(p.deliveryDate);
  const shootDateText = formatShootDates(shootDates);
  const deliveryDateText = p.deliveryDate ? fmtDate(p.deliveryDate) : 'Not set';

  app.innerHTML = `
    <div style="padding-top:16px;">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <button class="back" id="backBtn">← All projects</button>
      <button class="sq-btn" id="projCalBtn" aria-label="Project calendar" title="Project calendar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
      </button>
    </div>
    <div class="detail-header">
      <div class="tally-big ${dotClass}"></div>
      <div class="detail-title" style="flex:1; min-width:0;">
        <h2>${esc(p.name)} <button class="icon-btn" id="renameBtn" style="vertical-align:middle;">Edit details</button></h2>
        ${p.client ? `<div class="client-line">Client: ${esc(p.client)}</div>` : ''}
        <div class="status-word ${dotClass}">${esc(stageText)}</div>
        <div style="font-family:var(--mono); font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-top:3px;">${esc(STATUSES.find(s => s.key === p.status).label)}</div>
        <div style="font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-top:3px;">Last edited ${esc(timeAgo(p.updatedAt))}${p.lastEditedBy ? ` by ${esc(p.lastEditedBy)}` : ''}</div>
      </div>
    </div>

    ${completedUnacked.length ? `
    <div class="deadline-list">
      ${completedUnacked.map(s => `
        <div class="deadline-item done" data-completeack="${s.id}">
          <span class="deadline-days">✓ Done</span>
          <span class="deadline-title">${esc(s.title || 'Untitled step')}</span>
        </div>`).join('')}
    </div>` : ''}

    ${deadlines.length ? `
    <div class="deadline-list">
      ${deadlines.map(d => `
        <div class="deadline-item ${'status-' + deadlineDotClass(stepDeadline(d.step), false)}" data-deadline="${d.step.id}">
          <span class="deadline-days">${esc(daysText(d.diff))}</span>
          <span class="deadline-title">${esc(d.step.title || 'Untitled step')}</span>
        </div>`).join('')}
    </div>` : ''}

    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-label">Days to shoot</div>
        <div class="stat-value ${statValueClass(shootDiff)}">${shootDiff !== null ? daysText(shootDiff) : 'Not set'}</div>
        <div class="stat-date">${esc(shootDateText)}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Days to delivery</div>
        <div class="stat-value ${statValueClass(deliveryDiff)}">${deliveryDiff !== null ? daysText(deliveryDiff) : 'Not set'}</div>
        <div class="stat-date">${esc(deliveryDateText)}</div>
      </div>
    </div>

    <div class="section-label"><span>Latest progress note</span></div>
    <div class="current-loc-box">
      ${latest ? `<div style="font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); margin-bottom:5px;">${esc(stageLabel(latest.stage))} · ${esc(latest.title || 'step')}</div>` : ''}
      ${latest ? esc(latest.progressNote) : 'No notes yet'}
      <div class="ts" style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
        <span>${latest ? 'updated ' + timeAgo(latest.updatedAt) : 'add a step and log a note to see it here'}</span>
        ${latest ? `<button class="btn small" id="ackDetailNote">✓ Clear</button>` : ''}
      </div>
    </div>
    <details class="note-history">
      <summary>Cleared notes (${(p.clearedNotes||[]).length})</summary>
      <div class="note-history-list">
        ${(p.clearedNotes||[]).length ? p.clearedNotes.slice().reverse().map(n => `
          <div class="note-history-item">
            <div class="nh-meta">${esc(stageLabel(n.stage))} · ${esc(n.stepTitle || 'step')} — cleared ${timeAgo(n.clearedAt)}</div>
            <div class="nh-text">${esc(n.note)}</div>
          </div>`).join('') : `<div class="nh-empty">No cleared notes yet — ticking a note off keeps a record here.</div>`}
      </div>
    </details>

    ${totalHidden ? `<button class="btn-text" id="toggleHiddenBtn" style="margin-top:8px;">${showHidden ? 'Hide' : 'Show'} ${totalHidden} hidden step${totalHidden>1?'s':''}</button>` : ''}
    ${stageSections}

    </div>
    ${renderBottomNav('projects')}
  `;

  document.getElementById('backBtn').addEventListener('click', () => goTab(p.status));
  document.getElementById('projCalBtn').addEventListener('click', () => goProjectCalendar(p.id));
  document.getElementById('renameBtn').addEventListener('click', () => openEditProjectModal(p));
  const ackDetailBtn = document.getElementById('ackDetailNote');
  if(ackDetailBtn) ackDetailBtn.addEventListener('click', async () => {
    if(!latest) return;
    clearNote(p, latest);
    const ok = await saveProjects();
    showToast(ok ? 'Note cleared' : 'Save failed', !ok);
    if(ok) renderDetail(app, p);
  });
  document.querySelectorAll('[data-step]').forEach(row => {
    row.addEventListener('click', () => {
      const step = (p.steps||[]).find(s => s.id === row.dataset.step);
      if(!step) return;
      if(isPanelOpenForStep(step.id)){ closeSidePanels(); return; }
      if(isMoodboardStep(step)) openMoodboardPanel(p, step, true);
      else if(isBriefStep(step)) openBriefModal(p, step, true);
      else if(isScriptStep(step)) openScriptModal(p, step, true);
      else if(isBudgetStep(step)) openBudgetModal(p, step, true);
      else if(isContractStep(step)) openContractModal(p, step, true);
      else if(isTestsStep(step)) openTestsModal(p, step, true);
      else if(isTimelineStep(step)) openTimelineModal(p, step.id, true);
      else if(isMeetingsStep(step)) openMeetingsModal(p, step, true);
      else if(isLocationStep(step)) openLocationModal(p, step, true);
      else if(isShotListStep(step)) openShotListModal(p, step, true);
      else if(isScheduleStep(step)) openScheduleModal(p, step, true);
      else if(isFinalRenderStep(step)) openProjectOverviewModal(p, step, true);
      else if(isEquipmentListsStep(step)) openEquipmentListsModal(p, step, true);
      else if(isBoardingStep(step)) openPerShotImagesModal(p, step, true, shotBoardKey, 'Storyboard images');
      else if(isLightingStep(step)) openPerShotImagesModal(p, step, true, shotLightKey, 'Lighting plan images');
    });
  });
  document.querySelectorAll('[data-donedot]').forEach(btn => {
    btn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const step = (p.steps||[]).find(s => s.id === btn.dataset.donedot);
      if(!step) return;
      step.done = !step.done;
      if(step.done && stepDeadline(step)) step.completedDate = new Date().toISOString().slice(0,10);
      else if(!step.done) delete step.completedDate;
      step.completionAcked = step.done ? false : true;
      touchStep(step);
      touchProject(p);
      const ok = await saveProjects();
      showToast(ok ? (step.done ? 'Marked done' : 'Marked not done') : 'Save failed', !ok);
      if(ok) renderDetail(app, p);
    });
  });
  document.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const step = (p.steps||[]).find(s => s.id === btn.dataset.edit);
      if(!step) return;
      if(isPanelOpenForStep(step.id)){ closeSidePanels(); return; }
      openStepModal(p, step, null, true);
    });
  });
  document.querySelectorAll('[data-note]').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const step = (p.steps||[]).find(s => s.id === btn.dataset.note);
      if(!step) return;
      if(isPanelOpenForStep(step.id)){ closeSidePanels(); return; }
      openNoteModal(p, step, true);
    });
  });
  document.querySelectorAll('[data-mood]').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      goMoodboard(p.id, btn.dataset.mood);
    });
  });
  document.querySelectorAll('[data-addstep]').forEach(btn => {
    btn.addEventListener('click', () => openStepModal(p, null, btn.dataset.addstep, true));
  });
  const toggleHiddenBtn = document.getElementById('toggleHiddenBtn');
  if(toggleHiddenBtn) toggleHiddenBtn.addEventListener('click', () => {
    app.dataset.showHidden = app.dataset.showHidden === '1' ? '0' : '1';
    renderDetail(app, p);
  });
  document.querySelectorAll('[data-deadline]').forEach(el => {
    el.addEventListener('click', () => {
      const step = (p.steps||[]).find(s => s.id === el.dataset.deadline);
      if(step) openStepModal(p, step, null, true);

  document.querySelectorAll('[data-completeack]').forEach(el => {
    el.addEventListener('click', async () => {
      const step = (p.steps||[]).find(s => s.id === el.dataset.completeack);
      if(!step) return;
      step.completionAcked = true;
      touchProject(p);
      const ok = await saveProjects();
      if(ok) renderDetail(app, p);
    });
  });
  wireNavtabs(app);
}

// ---------- moodboard: per-step canvas board (images + text as movable objects, pen ink as a separate overlay layer), stored under its own key ----------
function moodboardKey(stepId){ return 'moodboard:' + stepId; }
// ---------- shared image sets: for shots, storyboards, and lighting plans. Images are downscaled
// and re-encoded client-side before saving (kept well under the storage size/rate limits), and
// synced the same way as everything else in the app via window.storage.
function shotImageKey(projectId, rowId){ return 'shotimg:' + projectId + ':' + rowId; }
function stepImageKey(stepId){ return 'stepimg:' + stepId; }
function shotBoardKey(projectId, rowId){ return 'boardimg:' + projectId + ':' + rowId; }
function shotLightKey(projectId, rowId){ return 'lightimg:' + projectId + ':' + rowId; }
// runs an async fn over items with at most `limit` in flight at once — opening a panel with many
// shots can otherwise fire dozens of storage calls in one burst (list+get per gallery, times every
// shot), which risks tripping a rate limit and causing unrelated saves to fail around the same time
async function mapWithConcurrency(items, limit, fn){
  const results = new Array(items.length);
  let next = 0;
  async function worker(){
    while(next < items.length){
      const i = next++;
      results[i] = await fn(items[i], i);
    }
  }
  await Promise.all(new Array(Math.min(limit, items.length)).fill(0).map(worker));
  return results;
}
// one-time healing pass: copies any image missing from the "to" gallery in from the "from"
// gallery (matched by sourceId, so nothing gets duplicated on repeat runs). Used to sync Boarding
// and Shot list images in either direction — whichever wasn't the one just uploaded to.
async function reconcileImageSets(fromKeyFn, toKeyFn, projectId, rowIds){
  let changedRowIds = [];
  await mapWithConcurrency(rowIds, 4, async rowId => {
    const [fromImgs, toImgs] = await Promise.all([
      loadImageSet(fromKeyFn(projectId, rowId)),
      loadImageSet(toKeyFn(projectId, rowId)),
    ]);
    if(!fromImgs.length) return;
    const alreadySynced = new Set(toImgs.filter(i => i.sourceId).map(i => i.sourceId));
    const missing = fromImgs.filter(f => !alreadySynced.has(f.id) && f.id !== undefined && !toImgs.some(t => t.id === f.id));
    if(!missing.length) return;
    missing.forEach(f => toImgs.push({ id: uid(), dataUrl: f.dataUrl, sourceId: f.id }));
    await saveImageSet(toKeyFn(projectId, rowId), toImgs);
    changedRowIds.push(rowId);
  });
  return changedRowIds;
}
// a scene's lighting plan applies to every shot in that scene by default — when images are added
// to one shot's lighting gallery, copy them into every sibling shot's gallery too, but only if
// that sibling doesn't already have its own lighting images (so a shot that's been given its own
// distinct lighting is never overwritten)
async function propagateLightingToScene(project, shotId, addedEntries){
  const shotStep = (project.steps || []).find(isShotListStep);
  if(!shotStep || !shotStep.shotListRows) return;
  const shot = shotStep.shotListRows.find(r => r.id === shotId);
  if(!shot || !shot.scene) return;
  const siblings = shotStep.shotListRows.filter(r => r.id !== shotId && r.scene === shot.scene);
  await mapWithConcurrency(siblings, 4, async sib => {
    const key = shotLightKey(project.id, sib.id);
    const existing = await loadImageSet(key);
    if(existing.length) return; // already has its own lighting — leave it alone
    const toAdd = addedEntries.map(e => ({ id: uid(), dataUrl: e.dataUrl, sourceId: e.id }));
    await saveImageSet(key, toAdd);
  });
}
// each image lives under its own key (prefix + ':' + imageId) rather than one shared blob for the
// whole gallery — a gallery can otherwise grow past the per-key storage size limit as images pile
// up, which is what caused save failures. list() finds a gallery's images without needing an index.
async function loadImageSet(keyPrefix){
  try{
    const res = await window.storage.list(keyPrefix + ':', true);
    if(!res || !res.keys || !res.keys.length) return [];
    const entries = await Promise.all(res.keys.map(async k => {
      try{
        const r = await window.storage.get(k, true);
        return r && r.value ? JSON.parse(r.value) : null;
      }catch(e){ return null; }
    }));
    return entries.filter(Boolean);
  }catch(e){ return []; }
}
// diffs against what's already stored so unchanged images aren't rewritten and removed ones get
// deleted — keeps the same (keyPrefix, wholeArray) call signature everywhere it's used
// purely additive: writes any image in the array not already stored. Never infers deletions from
// what's missing — a stale in-memory copy (e.g. a modal opened before another tab/sync added an
// image) would otherwise delete that image on save. Removal is its own explicit operation below.
async function saveImageSet(keyPrefix, images){
  try{
    const res = await window.storage.list(keyPrefix + ':', true);
    const existingIds = new Set((res && res.keys ? res.keys : []).map(k => k.slice(keyPrefix.length + 1)));
    const writes = images.filter(img => !existingIds.has(img.id))
      .map(img => window.storage.set(keyPrefix + ':' + img.id, JSON.stringify(img), true));
    await Promise.all(writes);
    return true;
  }catch(e){ console.error('image set save failed', e); return false; }
}
async function deleteImageFromSet(keyPrefix, imageId){
  try{ await window.storage.delete(keyPrefix + ':' + imageId, true); return true; }
  catch(e){ console.error('image delete failed', e); return false; }
}
// downscales to a max dimension and re-encodes as JPEG so a phone photo (often 4000px+, several
// MB) doesn't blow past the storage size limit or bloat every sync
function compressImageFile(file, maxDim){
  maxDim = maxDim || 1600;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
// reusable image-gallery panel used for a single shot's reference images and for the whole-step

// matches a batch of selected image files to shots by filename — if "Bride Prep Wide.jpg" matches
// a shot named "Bride Prep Wide" (case/whitespace-insensitive, extension ignored), it's added
// straight to that shot's Boarding gallery, syncing to the Shot list gallery the same way a single
// manual upload does
// parses the exact CSV format the Cine Finder viewfinder tool exports: quoted fields, comma
// separated, with a header row
function parseSimpleCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\r'){ /* skip */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const header = rows[0];
  return rows.slice(1).filter(r => r.length > 1 || r[0]).map(r => {
    const obj = {};
    header.forEach((h, idx) => { obj[h] = r[idx] || ''; });
    return obj;
  });
}
// matches a batch of selected image files to shots by filename. Two modes:
//  - plain filenames matched against an existing shot's Shot Number ("Wide.jpg" -> shot "Wide")
//  - "<scene>.<shot>.jpg" filenames from the Cine Finder viewfinder tool (e.g. "1.1.jpg" = scene 1,
//    shot 1) — finds or creates the matching Shot list row, and pulls the lens from the
//    accompanying metadata.csv's "Focal Length (mm)" column if one's selected alongside the images
function matchStoryboardsByShotName(project, shots){
  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*,.csv';
    input.multiple = true;
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', async () => {
      const files = [...input.files];
      input.remove();
      if(!files.length){ resolve({matched:0, total:0}); return; }

      const csvFile = files.find(f => /\.csv$/i.test(f.name));
      const imageFiles = files.filter(f => f !== csvFile && /^image\//.test(f.type));
      let csvByFilename = {};
      if(csvFile){
        try{
          const text = await csvFile.text();
          parseSimpleCsv(text).forEach(row => { if(row.File) csvByFilename[row.File.trim()] = row; });
        }catch(e){ console.error('viewfinder csv parse failed', e); }
      }

      const shotStep = (project.steps || []).find(isShotListStep);
      const norm = s => (s || '').trim().toLowerCase();
      let matched = 0;
      let createdAny = false;

      for(const file of imageFiles){
        const baseName = file.name.replace(/\.[^.]+$/, '');
        const sceneShotMatch = baseName.match(/^(\d+)\.(\d+)$/);
        let shot = null;

        if(sceneShotMatch && shotStep){
          const [, sceneNum, shotNum] = sceneShotMatch;
          if(!shotStep.shotListRows) shotStep.shotListRows = [];
          shot = shotStep.shotListRows.find(s => norm(s.scene) === sceneNum && norm(s.shot) === shotNum);
          if(!shot){
            shot = { id: uid(), day:'', location:'', scene: sceneNum, shot: shotNum, order:'', camera:'', lens:'', shotType:'', movement:'', script:'', intention:'', multicam:'', vfx:'', done:false };
            shotStep.shotListRows.push(shot);
            if(shots !== shotStep.shotListRows) shots.push(shot); // keep a separate working-copy caller in sync too, without double-pushing when they're the same array
            createdAny = true;
          }
          const meta = csvByFilename[file.name];
          if(meta && meta['Focal Length (mm)'] && !shot.lens){
            shot.lens = `${meta['Focal Length (mm)']}mm`;
          }
        } else {
          shot = shots.find(s => norm(s.shot) === norm(baseName));
        }
        if(!shot) continue;

        const boardKey = shotBoardKey(project.id, shot.id);
        const shotKey = shotImageKey(project.id, shot.id);
        const existing = await loadImageSet(boardKey);
        if(existing.some(img => img.sourceName === file.name)){ matched++; continue; }
        try{
          const dataUrl = await compressImageFile(file);
          const entry = { id: uid(), dataUrl, sourceName: file.name };
          existing.push(entry);
          await saveImageSet(boardKey, existing);
          const synced = await loadImageSet(shotKey);
          synced.push({ id: uid(), dataUrl, sourceId: entry.id });
          await saveImageSet(shotKey, synced);
          matched++;
        }catch(e){ console.error('storyboard batch match failed', e); }
      }

      if(createdAny){
        shotStep.updatedAt = new Date().toISOString();
        touchProject(project);
        await saveProjects();
      }
      resolve({ matched, total: imageFiles.length, createdAny });
    });
    input.click();
  });
}
async function loadMoodboard(stepId){
  try{
    const res = await window.storage.get(moodboardKey(stepId), true);
    if(res && res.value) return { board: JSON.parse(res.value), isNew: false };
  }catch(e){ /* fall through to a fresh board */ }
  return { board: { objects: [], strokes: [] }, isNew: true };
}
async function saveMoodboard(stepId, board){
  const json = JSON.stringify(board);
  if(json.length > 4600000){
    return { ok:false, reason:'full' };
  }
  try{ await window.storage.set(moodboardKey(stepId), json, true); return { ok:true }; }
  catch(e){ console.error('moodboard save failed', e); return { ok:false, reason:'error' }; }
}
// the five default labels every fresh Conceptualising board starts with, arranged in a circle
function seedDefaultLabels(board){
  const labels = ['Lighting', 'Camera/Lens', 'Costume', 'Props', 'Location'];
  const cx = 650, cy = 475, radius = 230, boxW = 160, boxH = 40;
  labels.forEach((text, i) => {
    const angle = -Math.PI/2 + i * (2*Math.PI/labels.length); // start at the top, go clockwise
    board.objects.push({
      id: uid(), type:'text', text,
      x: Math.round(cx + radius*Math.cos(angle) - boxW/2),
      y: Math.round(cy + radius*Math.sin(angle) - boxH/2),
      w: boxW, h: boxH, fontSize:22, color:'#17181a',
      z: i + 1,
    });
  });
}
// downscales+recompresses an image file/blob before it goes anywhere near storage, since
// storage keys are capped and raw phone photos would blow through that in a couple of pastes.
function processImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve({dataUrl: canvas.toDataURL('image/jpeg', quality), w, h});
      };
      img.onerror = () => reject(new Error('bad image'));
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const PEN_COLORS = [
  { key:'black', hex:'#17181a' },
  { key:'blue', hex:'#009CDE' },
  { key:'red', hex:'#D6001C' },
  { key:'yellow', hex:'#D9A404' },
  { key:'green', hex:'#275D38' },
];
const PEN_SIZES = [2, 4, 8];

async function renderMoodboard(app, project, step){
  app.innerHTML = `<div class="loading">Loading moodboard…</div>`;
  const { board, isNew } = await loadMoodboard(step.id);
  board.objects = board.objects || [];
  board.strokes = board.strokes || [];
  if(isNew){
    seedDefaultLabels(board);
    await saveMoodboard(step.id, board); // save immediately so a later "Clear board" doesn't get re-seeded on next visit
  }
  let selectedId = null;
  let placingText = false;
  let penMode = false;
  let eraseMode = false;
  let penColor = PEN_COLORS[0].hex;
  let penWidth = PEN_SIZES[1];
  let zTop = board.objects.reduce((m,o) => Math.max(m, o.z||0), 0);
  let view = { x: 0, y: 0, scale: 1 }; // pan/zoom state, kept across re-paints so it isn't lost on edits
  let didInitialCenter = false;

  function pathFromPoints(points){
    return 'M' + points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L ');
  }

  function objHtml(o){
    const sel = o.id === selectedId;
    const style = `left:${o.x}px; top:${o.y}px; width:${o.w}px; height:${o.h}px; z-index:${o.z||1};`;
    const handles = sel ? `<div class="mobj-del" data-del="${o.id}">&times;</div><div class="mobj-handle" data-resize="${o.id}"></div>` : '';
    if(o.type === 'image'){
      return `<div class="mobj${sel?' selected':''}" data-obj="${o.id}" style="${style}"><img src="${o.src}" draggable="false">${handles}</div>`;
    }
    return `<div class="mobj${sel?' selected':''}" data-obj="${o.id}" style="${style}"><div class="mobj-text" data-textedit="${o.id}" style="font-size:${o.fontSize||22}px; color:${o.color||'#17181a'};">${esc(o.text||'')}</div>${handles}</div>`;
  }

  // pen ink is a flat, non-draggable overlay: one big SVG on top of every object, only ever
  // touched while the pen tool itself is active (drawing new strokes or erasing existing ones).
  function inkHtml(){
    return board.strokes.map(s => `<path data-stroke="${s.id}" d="${pathFromPoints(s.points)}" fill="none" stroke="${s.color}" stroke-width="${s.width||4}" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  }

  function paint(){
    app.innerHTML = `
      <div style="padding-top:16px;">
      <button class="back" id="mbBack">← ${esc(project.name)}</button>
      ${stepDateRangeFieldHtml(step, 'mb')}
      <div class="mboard-toolbar">
        <div>
          <div class="mboard-title">${esc(step.title || 'Step')}</div>
          <div class="eyebrow small" style="margin:2px 0 0;">MOODBOARD</div>
        </div>
        <div style="flex:1;"></div>
        <label class="btn small" style="cursor:pointer;">+ Image<input type="file" id="mbFile" accept="image/*" multiple style="display:none;"></label>
        <button class="btn small ${placingText ? 'primary' : ''}" id="mbAddText">+ Text</button>
        <button class="btn small ${penMode ? 'primary' : ''}" id="mbPen">✎ Pen</button>
        <button class="btn small" id="mbExport">Export</button>
        <button class="btn small danger" id="mbClear">Clear board</button>
        <button class="btn small" id="mbReset">Reset view</button>
      </div>
      ${penMode ? `
      <div class="pen-panel">
        <div class="segmented">
          <button type="button" class="${!eraseMode?'active':''}" id="mbDrawTab" aria-label="Draw" title="Draw">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L15.5 5.5l3 3L8 19l-4 1z"/><path d="M13.5 7l3 3"/></svg>
          </button>
          <button type="button" class="${eraseMode?'active':''}" id="mbEraseTab" aria-label="Erase" title="Erase">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13l-7.5 7.5H7L3.5 17a2 2 0 010-2.8L13 4.7l6.3 6.3z"/><path d="M8.5 20.5H21"/></svg>
          </button>
        </div>
        <div class="pen-swatches" style="${eraseMode ? 'visibility:hidden;' : ''}">
          ${PEN_COLORS.map(c => `<button type="button" class="pen-swatch ${penColor===c.hex?'active':''}" data-pencolor="${c.hex}" style="background:${c.hex};" aria-label="${c.key} pen"></button>`).join('')}
        </div>
        <div class="pen-sizes">
          ${PEN_SIZES.map(sz => `<button type="button" class="pen-size ${penWidth===sz?'active':''}" data-pensize="${sz}" aria-label="${sz}px"><span style="width:${sz+4}px; height:${sz+4}px;"></span></button>`).join('')}
        </div>
      </div>` : ''}
      <div class="mboard-hint">${penMode ? (eraseMode ? 'Drag over a stroke to erase it.' : 'Draw directly on the board with your finger, stylus, or mouse.') : 'Drag to pan · scroll or pinch to zoom · tap "+ Text" then tap the board to place it · hold Shift while resizing an image to keep its proportions · paste images with Ctrl/Cmd+V.'}</div>
      <div class="mboard-wrap" id="mbWrap">
        <div class="mboard-canvas ${placingText?'placing':''}${penMode?' drawing':''}" id="mbCanvas" style="transform: translate(${view.x}px, ${view.y}px) scale(${view.scale}); transform-origin: 0 0;">
          ${board.objects.length ? '' : '<div class="mboard-empty">Paste an image, upload one, or add text to get started.</div>'}
          ${board.objects.map(objHtml).join('')}
          <svg id="mbInk" class="mboard-ink" viewBox="0 0 1300 950">${inkHtml()}</svg>
        </div>
      </div>
      <div class="section-label"><span>Notes</span></div>
      <textarea id="mbNotes" placeholder="Write any notes about this moodboard — themes, references, direction…" rows="4">${esc(board.notes||'')}</textarea>
      </div>`;
    wire();
  }

  function addObject(o){
    zTop += 1;
    o.z = zTop;
    board.objects.push(o);
    selectedId = o.id;
  }

  async function commit(){
    const result = await saveMoodboard(step.id, board);
    if(!result.ok){
      showToast(
        result.reason === 'full'
          ? "This board is too full to save — export it, then use Clear board to free up space"
          : 'Save failed',
        true
      );
    }
    return result.ok;
  }

  function wire(){
    const wrap = document.getElementById('mbWrap');
    const canvas = document.getElementById('mbCanvas');
    const ink = document.getElementById('mbInk');

    document.getElementById('mbBack').addEventListener('click', () => goProject(project.id));
    const notesEl = document.getElementById('mbNotes');
    if(notesEl) notesEl.addEventListener('blur', async () => {
      if(board.notes === notesEl.value) return;
      board.notes = notesEl.value;
      await commit();
    });
    document.getElementById('mbFile').addEventListener('change', async (ev) => {
      const files = [...ev.target.files];
      for(let i = 0; i < files.length; i++){
        try{
          const { dataUrl, w, h } = await processImageFile(files[i], 1000, 0.82);
          const scale = Math.min(1, 320 / Math.max(w, h));
          addObject({ id: uid(), type:'image', src:dataUrl, aspect: w/h, x: 30 + i*20, y: 30 + i*20, w: Math.round(w*scale), h: Math.round(h*scale) });
        }catch(e){ showToast('Could not add that image', true); }
      }
      await commit();
      paint();
    });
    document.getElementById('mbAddText').addEventListener('click', () => {
      placingText = !placingText;
      if(placingText) penMode = false;
      paint();
    });
    document.getElementById('mbPen').addEventListener('click', () => {
      penMode = !penMode;
      if(penMode) placingText = false;
      paint();
    });
    const drawTab = document.getElementById('mbDrawTab');
    const eraseTab = document.getElementById('mbEraseTab');
    if(drawTab) drawTab.addEventListener('click', () => { eraseMode = false; paint(); });
    if(eraseTab) eraseTab.addEventListener('click', () => { eraseMode = true; paint(); });
    document.querySelectorAll('[data-pencolor]').forEach(sw => {
      sw.addEventListener('click', () => {
        penColor = sw.dataset.pencolor;
        document.querySelectorAll('[data-pencolor]').forEach(s => s.classList.toggle('active', s.dataset.pencolor === penColor));
      });
    });
    document.querySelectorAll('[data-pensize]').forEach(sw => {
      sw.addEventListener('click', () => {
        penWidth = parseFloat(sw.dataset.pensize);
        document.querySelectorAll('[data-pensize]').forEach(s => s.classList.toggle('active', parseFloat(s.dataset.pensize) === penWidth));
      });
    });
    document.getElementById('mbExport').addEventListener('click', () => exportBoard());
    document.getElementById('mbClear').addEventListener('click', () => {
      if(!board.objects.length && !board.strokes.length){ showToast('Board is already empty'); return; }
      openConfirmModal('Clear everything on this moodboard, including drawings? Export a copy first if you want to keep it.', async () => {
        board.objects = [];
        board.strokes = [];
        selectedId = null;
        await commit();
        paint();
        showToast('Board cleared');
      });
    });
    document.getElementById('mbReset').addEventListener('click', () => {
      centerView();
    });

    function applyTransform(){
      canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
    }
    function clampScale(s){ return Math.max(0.25, Math.min(3, s)); }
    function centerView(){
      const wrapRect = wrap.getBoundingClientRect();
      const fitScale = clampScale(Math.min(1, wrapRect.width / 640));
      view.scale = fitScale;
      view.x = wrapRect.width/2 - 650*fitScale;
      view.y = wrapRect.height/2 - 475*fitScale;
      applyTransform();
    }

    if(!didInitialCenter){
      centerView();
      didInitialCenter = true;
    }
    function zoomAt(cx, cy, targetScale){
      const newScale = clampScale(targetScale);
      const canvasX = (cx - view.x) / view.scale;
      const canvasY = (cy - view.y) / view.scale;
      view.x = cx - canvasX * newScale;
      view.y = cy - canvasY * newScale;
      view.scale = newScale;
      applyTransform();
    }
    function canvasPoint(clientX, clientY){
      const rect = canvas.getBoundingClientRect();
      return {
        x: Math.round(((clientX - rect.left) / view.scale) * 10) / 10,
        y: Math.round(((clientY - rect.top) / view.scale) * 10) / 10,
      };
    }

    function handleCanvasTap(clientX, clientY){
      if(placingText){
        const { x, y } = canvasPoint(clientX, clientY);
        const id = uid();
        addObject({ id, type:'text', text:'', x: Math.max(0,x-90), y: Math.max(0,y-20), w:180, h:44, fontSize:22, color:'#17181a' });
        placingText = false;
        commit().then(() => {
          paint();
          const el = document.querySelector(`[data-textedit="${id}"]`);
          if(el){ el.setAttribute('contenteditable','true'); el.focus(); }
        });
        return;
      }
      if(selectedId){ selectedId = null; paint(); }
    }

    // erasing removes whole strokes that the pointer passes near, live as you drag
    // works like the pen in reverse: only the portion of a line near the eraser point is removed.
    // a hit in the middle of a stroke splits it into two separate strokes either side of the gap.
    function eraseNear(point){
      const threshold = Math.max(14, penWidth * 3);
      let changed = false;
      const newStrokes = [];
      board.strokes.forEach(s => {
        let hitAny = false;
        let run = [];
        const runs = [];
        s.points.forEach(p => {
          if(Math.hypot(p.x - point.x, p.y - point.y) <= threshold){
            hitAny = true;
            if(run.length > 1) runs.push(run);
            run = [];
          } else {
            run.push(p);
          }
        });
        if(run.length > 1) runs.push(run);

        if(!hitAny){
          newStrokes.push(s); // untouched — keep exactly as-is
          return;
        }
        changed = true;
        runs.forEach(r => newStrokes.push({ id: uid(), color: s.color, width: s.width, points: r }));
        // if runs is empty, the whole stroke was within the eraser's reach and is simply dropped
      });
      if(changed){
        board.strokes = newStrokes;
        ink.innerHTML = inkHtml();
      }
      return changed;
    }

    // desktop: mouse-wheel zoom, centered on the cursor
    wrap.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      const rect = wrap.getBoundingClientRect();
      const cx = ev.clientX - rect.left, cy = ev.clientY - rect.top;
      zoomAt(cx, cy, view.scale * (1 - ev.deltaY * 0.0015));
    }, { passive:false });

    // click-drag to pan (desktop mouse or a single touch); two touches pinch-zoom instead.
    // in pen mode, a single touch draws or erases instead of panning; a second touch still pinch-zooms.
    const activePointers = new Map();
    let panState = null;
    let pinchState = null;
    let stroke = null;
    let erasing = false;

    function startPinch(){
      panState = null;
      wrap.classList.remove('panning');
      if(stroke){ stroke = null; }
      erasing = false;
      const pts = [...activePointers.values()];
      pinchState = {
        startDist: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y),
        startScale: view.scale,
        startMid: { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 },
        startView: { x: view.x, y: view.y },
      };
    }

    wrap.addEventListener('pointerdown', (ev) => {
      if(!penMode && ev.target.closest('.mobj')) return; // objects handle their own drag/resize (pen draws over them)
      ev.preventDefault(); // stop the OS/browser from treating this as a system gesture (e.g. Apple Pencil Scribble) partway through
      try{ wrap.setPointerCapture(ev.pointerId); }catch(e){ /* some browsers/synthetic events reject capture; harmless to skip */ }
      activePointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

      if(activePointers.size === 2){ startPinch(); return; }
      if(activePointers.size !== 1) return;

      if(penMode && eraseMode){
        erasing = true;
        eraseNear(canvasPoint(ev.clientX, ev.clientY));
      } else if(penMode){
        const p = canvasPoint(ev.clientX, ev.clientY);
        stroke = { pointerId: ev.pointerId, color: penColor, width: penWidth, points: [p] };
        ink.insertAdjacentHTML('beforeend', `<path id="mbLiveStroke" d="" fill="none" stroke="${penColor}" stroke-width="${penWidth}" stroke-linecap="round" stroke-linejoin="round"/>`);
      } else {
        panState = { pointerId: ev.pointerId, startX: ev.clientX, startY: ev.clientY, startViewX: view.x, startViewY: view.y, moved: false };
        wrap.classList.add('panning');
      }
    });
    wrap.addEventListener('pointermove', (ev) => {
      if(!activePointers.has(ev.pointerId)) return;
      if(stroke || erasing || pinchState) ev.preventDefault();
      activePointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if(pinchState && activePointers.size === 2){
        const pts = [...activePointers.values()];
        const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
        const midX = (pts[0].x+pts[1].x)/2, midY = (pts[0].y+pts[1].y)/2;
        const rect = wrap.getBoundingClientRect();
        const cx = pinchState.startMid.x - rect.left, cy = pinchState.startMid.y - rect.top;
        const newScale = clampScale(pinchState.startScale * (dist / pinchState.startDist));
        const canvasX = (cx - pinchState.startView.x) / pinchState.startScale;
        const canvasY = (cy - pinchState.startView.y) / pinchState.startScale;
        view.scale = newScale;
        view.x = cx - canvasX * newScale + (midX - pinchState.startMid.x);
        view.y = cy - canvasY * newScale + (midY - pinchState.startMid.y);
        applyTransform();
      } else if(erasing){
        eraseNear(canvasPoint(ev.clientX, ev.clientY));
      } else if(stroke && ev.pointerId === stroke.pointerId){
        const p = canvasPoint(ev.clientX, ev.clientY);
        const last = stroke.points[stroke.points.length - 1];
        if(!last || Math.hypot(p.x - last.x, p.y - last.y) >= 2.5){
          stroke.points.push(p);
          const live = document.getElementById('mbLiveStroke');
          if(live) live.setAttribute('d', pathFromPoints(stroke.points));
        }
      } else if(panState && ev.pointerId === panState.pointerId){
        const dx = ev.clientX - panState.startX, dy = ev.clientY - panState.startY;
        if(Math.abs(dx) > 4 || Math.abs(dy) > 4) panState.moved = true;
        view.x = panState.startViewX + dx;
        view.y = panState.startViewY + dy;
        applyTransform();
      }
    });
    async function endPointer(ev){
      activePointers.delete(ev.pointerId);
      if(pinchState && activePointers.size < 2) pinchState = null;
      if(erasing){
        erasing = false;
        await commit();
        return;
      }
      if(stroke && ev.pointerId === stroke.pointerId){
        const pts = stroke.points;
        const live = document.getElementById('mbLiveStroke');
        stroke = null;
        if(pts.length > 1){
          const strokeId = uid();
          if(live){ live.removeAttribute('id'); live.setAttribute('data-stroke', strokeId); } // keep the already-drawn path on screen, just make it permanent
          board.strokes.push({ id: strokeId, color: penColor, width: penWidth, points: pts });
          await commit();
        } else if(live){
          live.remove();
        }
        return;
      }
      if(panState && ev.pointerId === panState.pointerId){
        wrap.classList.remove('panning');
        const wasTap = !panState.moved;
        panState = null;
        if(wasTap) handleCanvasTap(ev.clientX, ev.clientY);
      }
    }
    wrap.addEventListener('pointerup', endPointer);
    wrap.addEventListener('pointercancel', endPointer);

    document.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        board.objects = board.objects.filter(o => o.id !== btn.dataset.del);
        selectedId = null;
        await commit();
        paint();
      });
    });

    document.querySelectorAll('.mobj').forEach(el => {
      const id = el.dataset.obj;
      const obj = board.objects.find(o => o.id === id);
      if(!obj) return;

      // select on tap; text objects enter edit mode on a second tap once already selected
      el.addEventListener('pointerdown', (ev) => {
        if(penMode) return; // let the wrap-level handler draw/erase over this object instead
        if(ev.target.closest('[data-resize]') || ev.target.closest('[data-del]')) return;
        if(obj.type === 'text' && ev.target.closest('[data-textedit]') && ev.target.closest('[data-textedit]').isContentEditable){
          return; // actively editing text — let the field take the click for cursor placement
        }
        ev.stopPropagation();
        if(selectedId !== id){ selectedId = id; paint(); return; }

        ev.preventDefault();
        const startX = ev.clientX, startY = ev.clientY;
        const origX = obj.x, origY = obj.y;
        function onMove(mv){
          let nx = origX + (mv.clientX - startX) / view.scale;
          let ny = origY + (mv.clientY - startY) / view.scale;
          nx = Math.max(0, Math.min(nx, canvas.offsetWidth - obj.w));
          ny = Math.max(0, Math.min(ny, canvas.offsetHeight - obj.h));
          el.style.left = nx + 'px'; el.style.top = ny + 'px';
          obj._dragX = nx; obj._dragY = ny;
        }
        async function onUp(){
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          if(obj._dragX !== undefined){ obj.x = obj._dragX; obj.y = obj._dragY; delete obj._dragX; delete obj._dragY; await commit(); }
        }
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });

      const textEl = el.querySelector('[data-textedit]');
      if(textEl){
        textEl.addEventListener('dblclick', (ev) => {
          ev.stopPropagation();
          textEl.setAttribute('contenteditable', 'true');
          textEl.focus();
        });
        textEl.addEventListener('blur', async () => {
          obj.text = textEl.textContent;
          textEl.setAttribute('contenteditable', 'false');
          await commit();
        });
      }

      const handle = el.querySelector('[data-resize]');
      if(handle){
        handle.addEventListener('pointerdown', (ev) => {
          ev.stopPropagation(); ev.preventDefault();
          const startX = ev.clientX, startY = ev.clientY;
          const origW = obj.w, origH = obj.h;
          function onMove(mv){
            const dx = (mv.clientX - startX) / view.scale;
            const dy = (mv.clientY - startY) / view.scale;
            let nw = Math.max(40, origW + dx);
            let nh;
            if(mv.shiftKey && obj.type === 'image' && obj.aspect){
              nh = Math.max(30, nw / obj.aspect);
            } else {
              nh = Math.max(30, origH + dy);
            }
            el.style.width = nw + 'px'; el.style.height = nh + 'px';
            obj._newW = nw; obj._newH = nh;
          }
          async function onUp(){
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
            if(obj._newW !== undefined){ obj.w = obj._newW; obj.h = obj._newH; delete obj._newW; delete obj._newH; await commit(); }
          }
          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        });
      }
    });
  }

  async function exportBoard(){
    if(!board.objects.length && !board.strokes.length){ showToast("There's nothing on this board yet", true); return; }
    showToast('Preparing export…');
    try{ await document.fonts.ready; }catch(e){ /* fine to proceed without waiting */ }

    const pad = 40;
    const xs = [
      ...board.objects.map(o => o.x), ...board.objects.map(o => o.x + o.w),
      ...board.strokes.flatMap(s => s.points.map(p => p.x)),
    ];
    const ys = [
      ...board.objects.map(o => o.y), ...board.objects.map(o => o.y + o.h),
      ...board.strokes.flatMap(s => s.points.map(p => p.y)),
    ];
    const minX = Math.min(...xs) - pad, minY = Math.min(...ys) - pad;
    const maxX = Math.max(...xs) + pad, maxY = Math.max(...ys) + pad;
    const w = Math.max(200, maxX - minX), h = Math.max(200, maxY - minY);
    const scale = 2;

    const cnv = document.createElement('canvas');
    cnv.width = Math.round(w * scale);
    cnv.height = Math.round(h * scale);
    const ctx = cnv.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);

    function wrapText(text, x, y, maxWidth, lineHeight){
      const paragraphs = (text || '').split('\n');
      let curY = y;
      paragraphs.forEach(para => {
        const words = para.split(' ');
        let line = '';
        words.forEach(word => {
          const test = line ? line + ' ' + word : word;
          if(line && ctx.measureText(test).width > maxWidth){
            ctx.fillText(line, x, curY);
            line = word;
            curY += lineHeight;
          } else {
            line = test;
          }
        });
        ctx.fillText(line, x, curY);
        curY += lineHeight;
      });
    }

    const sorted = board.objects.slice().sort((a,b) => (a.z||0) - (b.z||0));
    for(const o of sorted){
      const ox = o.x - minX, oy = o.y - minY;
      if(o.type === 'image'){
        await new Promise((resolve) => {
          const img = new Image();
          img.onload = () => { ctx.drawImage(img, ox, oy, o.w, o.h); resolve(); };
          img.onerror = resolve;
          img.src = o.src;
        });
      } else {
        ctx.fillStyle = o.color || '#17181a';
        const fontSize = o.fontSize || 22;
        ctx.font = `600 ${fontSize}px Archivo, sans-serif`;
        ctx.textBaseline = 'top';
        wrapText(o.text || '', ox + 2, oy + 2, o.w - 4, Math.round(fontSize * 1.25));
      }
    }
    // ink is an overlay in the app, so it's drawn last here too — on top of everything else
    board.strokes.forEach(s => {
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.width || 4;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      s.points.forEach((p, i) => {
        const px = p.x - minX, py = p.y - minY;
        if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.stroke();
    });

    cnv.toBlob((blob) => {
      if(!blob){ showToast('Export failed', true); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${(step.title || 'moodboard').toLowerCase().replace(/[^a-z0-9]+/g,'-')}-moodboard.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast('Moodboard exported');
    }, 'image/png');
  }

  async function handlePaste(ev){
    if(getRoute().view !== 'moodboard') return;
    const items = [...(ev.clipboardData ? ev.clipboardData.items : [])];
    const imageItem = items.find(it => it.type && it.type.startsWith('image/'));
    if(!imageItem) return;
    ev.preventDefault();
    const file = imageItem.getAsFile();
    if(!file) return;
    try{
      const { dataUrl, w, h } = await processImageFile(file, 1000, 0.82);
      const scale = Math.min(1, 320 / Math.max(w, h));
      addObject({ id: uid(), type:'image', src:dataUrl, aspect: w/h, x: 40, y: 40, w: Math.round(w*scale), h: Math.round(h*scale) });
      await commit();
      paint();
      showToast('Image pasted');
    }catch(e){ showToast('Could not paste that image', true); }
  }
  if(mbPasteHandler) window.removeEventListener('paste', mbPasteHandler);
  mbPasteHandler = handlePaste;
  window.addEventListener('paste', mbPasteHandler);

  app.addEventListener('click', ev => {
    const trigger = ev.target.closest('.dfield');
    if(!trigger) return;
    const rangeWrap = trigger.closest('[data-rangepicker="mb"]');
    if(rangeWrap){
      const triggers = rangeWrap.querySelectorAll('.dfield');
      openDateRangePicker(triggers[0], triggers[1]);
    }
  });
  app.addEventListener('change', async (ev) => {
    const el = ev.target;
    if(el.id === 'mbStart' || el.id === 'mbEnd'){

function insertStepAtPosition(project, newStep, stageKey, position){
  const stageSteps = project.steps.filter(s => s.stage === stageKey);
  if(position === 'start' && stageSteps.length){
    project.steps.splice(project.steps.indexOf(stageSteps[0]), 0, newStep);
  } else if(position && position.startsWith('after:')){
    const idx = project.steps.findIndex(s => s.id === position.slice(6));
    if(idx >= 0){ project.steps.splice(idx + 1, 0, newStep); return; }
    project.steps.push(newStep);
  } else if(stageSteps.length){
    project.steps.splice(project.steps.indexOf(stageSteps[stageSteps.length - 1]) + 1, 0, newStep);
  } else {
    project.steps.push(newStep);
  }
}

function groupConsecutiveDates(dates){
  const sorted = [...dates].sort();
  const groups = [];
  let runStart = null, runEnd = null;
  sorted.forEach(d => {
    if(runStart === null){ runStart = d; runEnd = d; return; }
    const nextDay = new Date(runEnd); nextDay.setDate(nextDay.getDate() + 1);
    if(nextDay.toISOString().slice(0,10) === d){ runEnd = d; }
    else { groups.push([runStart, runEnd]); runStart = d; runEnd = d; }
  });
  if(runStart !== null) groups.push([runStart, runEnd]);
  return groups;
}
function addDaysIso(iso, n){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}
function daysBetweenIso(a, b){
  return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
}
// works forward from the last shoot day through the standard post-production chain, each step
// dated relative to the one before it; the last three steps are anchored backward from delivery,
// so if delivery is too soon to fit the forward chain, it gets pushed out to the earliest date
// that fits everything at the same pacing described for each step.
// post-production ratios (start fraction, end fraction) of the window from the day after the last
// shoot day to delivery — taken from a reference 10-day breakdown, scaling up OR down to fit
// however much (or little) time actually exists between shooting and delivery.
const POST_PRODUCTION_RATIOS = {
  'footage drop': [0, 0.1],
  'davinci file and bins': [0, 0.1],
  'sync audio': [0, 0.1],
  'assembly cut': [0, 0.2],
  'refined cut': [0.2, 0.5],
  'picture lock': [0.4, 0.5],
  'audio': [0.4, 0.7],
  'color correct': [0.4, 0.7],
  'grade': [0.4, 0.7],
  'titles': [0.4, 0.7],
  'review render': [0.6, 0.7],
  'adjustments': [0.7, 0.9],
  'final render': [0.9, 1.0],
};
const AUTO_SCHEDULE_REFERENCE_DAYS = 10; // the reference example the ratios above were taken from
function computeAutoSchedule(project){
  const shootDates = getShootDates(project);
  if(!shootDates.length) return null;
  // footage drop starts the day after the LAST consecutive shooting run finishes — using the same
  // grouping as the Gantt chart, so a later reshoot day after a gap correctly pushes this out
  const shootGroups = groupConsecutiveDates(shootDates);
  const firstShoot = shootGroups[0][0];
  const lastShoot = shootGroups[shootGroups.length - 1][1];
  const footageDropStart = addDaysIso(lastShoot, 1);

  let deliveryDate = project.deliveryDate;
  const noDeliverySet = !deliveryDate;
  if(noDeliverySet) deliveryDate = addDaysIso(footageDropStart, AUTO_SCHEDULE_REFERENCE_DAYS);

  const totalDays = Math.max(1, Math.round((new Date(deliveryDate+'T00:00:00') - new Date(footageDropStart+'T00:00:00')) / 86400000));

  const byTitle = {};
  Object.entries(POST_PRODUCTION_RATIOS).forEach(([title, [s,e]]) => {
    byTitle[title] = [addDaysIso(footageDropStart, Math.round(s*totalDays)), addDaysIso(footageDropStart, Math.round(e*totalDays))];
  });
  byTitle['filling in dit'] = [firstShoot, lastShoot];

  return { deliveryDate, noDeliverySet, totalDays, byTitle };
}
async function applyAutoSchedule(project){
  const plan = computeAutoSchedule(project);
  if(!plan) return { ok:false, reason:'no-shoot-dates' };
  (project.steps || []).forEach(s => {
    const key = (s.title || '').trim().toLowerCase();
    const dates = plan.byTitle[key];
    if(dates){ s.startDate = dates[0]; s.endDate = dates[1]; }
  });
  if(plan.noDeliverySet) project.deliveryDate = plan.deliveryDate;
  touchProject(project);
  const ok = await saveProjects();
  return { ok, noDeliverySet: plan.noDeliverySet, deliveryDate: plan.deliveryDate };
}
// pre-production ratios (start fraction, end fraction) of the window from project start to the
// first shoot day — taken from a reference 10-day breakdown, so any window length scales to match
// the same proportions rather than a fixed day count.
const PRE_PRODUCTION_RATIOS = {
  'client meetings': [0, 1],
  'conceptualising': [0, 0.3],
  'brief': [0, 0.3],
  'budget': [0.2, 0.3],
  'location scout': [0.3, 0.4],
  'boarding': [0.4, 0.8],
  'pre-vis': [0.4, 0.9],
  'shot list': [0.4, 0.9],
  'lighting set ups': [0.4, 0.9],
  'equipment lists': [0.9, 1.0],
};
function computePreProductionSchedule(project){
  if(!project.startDate) return null;
  const shootDates = getShootDates(project);
  if(!shootDates.length) return null;
  const firstShoot = shootDates.reduce((min,d) => d < min ? d : min, shootDates[0]);
  const totalDays = Math.round((new Date(firstShoot+'T00:00:00') - new Date(project.startDate+'T00:00:00')) / 86400000);
  if(totalDays <= 0) return null;
  const byTitle = {};
  Object.entries(PRE_PRODUCTION_RATIOS).forEach(([title, [s,e]]) => {
    byTitle[title] = [addDaysIso(project.startDate, Math.round(s*totalDays)), addDaysIso(project.startDate, Math.round(e*totalDays))];
  });
  return { byTitle, totalDays };
}
async function applyPreProductionSchedule(project){
  const plan = computePreProductionSchedule(project);
  if(!plan) return { ok:false };
  (project.steps || []).forEach(s => {
    const key = (s.title || '').trim().toLowerCase();
    const dates = plan.byTitle[key];
    if(dates){ s.startDate = dates[0]; s.endDate = dates[1]; }
  });
  touchProject(project);
  const ok = await saveProjects();
  return { ok };
}
function openTimelineModal(project, timelineStepId, sideRight){
  closeSidePanels();
  const points = [];
  if(project.startDate) points.push({ rangeStart:project.startDate, rangeEnd:project.startDate, label:'Project start', done:false, type:'start', dotClass:'blank' });
  const shootGroups = groupConsecutiveDates(getShootDates(project));
  let shootInserted = false;
  (project.steps || []).forEach(s => {
    if(s.hidden) return;
    const deadline = stepDeadline(s);
    if(deadline){
      const effDeadline = (s.done && s.completedDate) ? s.completedDate : deadline;
      let rangeStart = s.startDate || effDeadline;
      let rangeEnd = s.endDate || effDeadline;
      let originalEnd = null;
      // finished ahead of schedule: shrink the filled bar/marker to the actual completion date, and
      // keep the original end date as a dashed "ghost" segment — this only needs an end date to have
      // been set, a start date isn't required for it to show.
      if(s.endDate && s.done && s.completedDate && s.completedDate < s.endDate){
        originalEnd = s.endDate;
        rangeEnd = s.completedDate;
        if(!s.startDate) rangeStart = s.completedDate;
      }
      // pushed later than originally committed to: mark where the original end date was
      const delayMarker = (s.originalEndDate && s.endDate && s.endDate > s.originalEndDate) ? s.originalEndDate : null;
      points.push({ rangeStart, rangeEnd, originalEnd, delayMarker, label:s.title||'Step', done:s.done, type:'step', dotClass: stepDotClass(s), stepId:s.id });
    }
    // equipment collection + shoot day rows slot in right where "Shooting day" sits in the step
    // list, rather than being appended after every other step
    if(!shootInserted && (s.title||'').trim().toLowerCase() === 'shooting day'){
      shootInserted = true;
      shootGroups.forEach(([start, end]) => {
        const prep = new Date(start); prep.setDate(prep.getDate() - 1);
        const prepIso = prep.toISOString().slice(0,10);
        points.push({ rangeStart:prepIso, rangeEnd:prepIso, label:'Equipment collection', done:false, type:'prep', dotClass:'blank' });
        points.push({ rangeStart:start, rangeEnd:end, label: start===end ? 'Shoot day' : 'Shoot days', done:false, type:'shoot', dotClass:'blank' });
      });
    }
  });
  if(!shootInserted){
    // no "Shooting day" step in this project's list — fall back to appending at the end
    shootGroups.forEach(([start, end]) => {
      const prep = new Date(start); prep.setDate(prep.getDate() - 1);
      const prepIso = prep.toISOString().slice(0,10);
      points.push({ rangeStart:prepIso, rangeEnd:prepIso, label:'Equipment collection', done:false, type:'prep', dotClass:'blank' });
      points.push({ rangeStart:start, rangeEnd:end, label: start===end ? 'Shoot day' : 'Shoot days', done:false, type:'shoot', dotClass:'blank' });
    });
  }
  if(project.deliveryDate) points.push({ rangeStart:project.deliveryDate, rangeEnd:project.deliveryDate, label:'Delivery', done:false, type:'delivery', dotClass: deadlineDotClass(project.deliveryDate, false) });
  // rows stay in the same order as the step list (not resorted by date) — shoot days/equipment
  // collection and delivery are appended after all steps, matching where they'd naturally sit

  const bg = document.createElement('div');
  bg.className = 'modal-bg' + (sideRight ? ' side-right' : ' side-left');

  if(points.length < 2){
    bg.innerHTML = `
      <div class="modal">
        <h3>Timeline for production</h3>
        <p class="empty small">Add dates to your steps, shoot days, or delivery date to see them plotted here.</p>
        <div class="modal-actions"><button class="btn primary" id="tlClose" style="flex:1;">Close</button></div>
      </div>`;
    presentPanel(bg, timelineStepId);
    bg.querySelector('#tlClose').addEventListener('click', () => bg.remove());
    bg.addEventListener('click', ev => { if(ev.target === bg) bg.remove(); });
    return;
  }

  const earliest = points.reduce((min,p) => p.rangeStart < min ? p.rangeStart : min, points[0].rangeStart);
  const latest = points.reduce((max,p) => {
    const end = p.originalEnd || p.rangeEnd;
    return end > max ? end : max;
  }, points[0].rangeEnd);
  const firstDate = new Date(earliest);
  const lastDate = new Date(latest);
  const totalDays = Math.max(1, Math.round((lastDate - firstDate) / 86400000));
  const pxPerDay = totalDays > 60 ? 20 : totalDays > 20 ? 32 : 48;
  const axisWidth = (totalDays + 1) * pxPerDay;
  const labelEvery = totalDays > 40 ? 7 : totalDays > 15 ? 2 : 1;

  function dayOffset(dateStr){
    return Math.round((new Date(dateStr) - firstDate) / 86400000);
  }

  const todayIso = new Date().toISOString().slice(0,10);
  const todayOffset = dayOffset(todayIso);
  const showToday = todayOffset >= 0 && todayOffset <= totalDays;

  let axisDaysHtml = '';
  for(let d = 0; d <= totalDays; d++){
    const dateObj = new Date(firstDate); dateObj.setDate(dateObj.getDate() + d);
    const showLabel = d % labelEvery === 0;
    axisDaysHtml += `<div class="gantt-axis-day" style="width:${pxPerDay}px;">${showLabel ? esc(fmtDate(dateObj.toISOString().slice(0,10)).replace(',', '')) : ''}</div>`;
  }

  const rowsHtml = points.map((pt, i) => {
    const isBar = pt.rangeStart !== pt.rangeEnd;
    const fill = taskColor(pt.label);
    const statusClass = pt.dotClass && pt.dotClass !== 'blank' ? ' status-' + pt.dotClass : '';
    let trackContent = '';
    if(isBar){
      const barLeft = dayOffset(pt.rangeStart) * pxPerDay;
      const barWidth = (dayOffset(pt.rangeEnd) - dayOffset(pt.rangeStart) + 1) * pxPerDay;
      trackContent += `<span class="gantt-bar${statusClass}" style="left:${barLeft}px; width:${barWidth}px; background:${fill};" title="${esc(fmtDate(pt.rangeStart))} – ${esc(fmtDate(pt.rangeEnd))}"></span>`;
    } else {
      trackContent += `<span class="gantt-marker${statusClass}" style="left:${dayOffset(pt.rangeStart) * pxPerDay + pxPerDay/2}px; background:${fill};" title="${esc(fmtDate(pt.rangeStart))}"></span>`;
    }
    if(pt.originalEnd){
      // starts right where the filled bar/marker ends (mid-day for a point, day-edge for a bar) and
      // runs to the original end date, so it reads as a continuation rather than a separate segment
      const ghostLeft = dayOffset(pt.rangeEnd) * pxPerDay + (isBar ? 0 : pxPerDay/2);
      const ghostWidth = (dayOffset(pt.originalEnd) - dayOffset(pt.rangeEnd) + 1) * pxPerDay - (isBar ? 0 : pxPerDay/2);
      trackContent += `<span class="gantt-bar-ghost" style="left:${ghostLeft}px; width:${ghostWidth}px;" title="Originally scheduled to end ${esc(fmtDate(pt.originalEnd))}"></span>`;
    }
    if(pt.delayMarker){
      // the step was pushed later than first committed to — a tick where the original end date was
      trackContent += `<span class="gantt-delay-marker" style="left:${dayOffset(pt.delayMarker) * pxPerDay + pxPerDay/2}px;" title="Originally due ${esc(fmtDate(pt.delayMarker))}"></span>`;
    }
    return `
    <div class="gantt-row" data-tlpoint="${i}">
      <div class="gantt-row-label">${esc(pt.label)}</div>
      <div class="gantt-row-track" style="width:${axisWidth}px;">${trackContent}</div>
    </div>`;
  }).join('');

  const todayLine = showToday
    ? `<div class="gantt-today-line" style="left:${110 + todayOffset*pxPerDay + pxPerDay/2}px;"><span class="gantt-today-label">Today</span></div>`
    : '';

  function openPanelFor(step){
    if(isBriefStep(step)) openBriefModal(project, step, true);
    else if(isScriptStep(step)) openScriptModal(project, step, true);
    else if(isBudgetStep(step)) openBudgetModal(project, step, true);
    else if(isContractStep(step)) openContractModal(project, step, true);
    else if(isTestsStep(step)) openTestsModal(project, step, true);
    else if(isMoodboardStep(step)) openMoodboardPanel(project, step, true);
    else openStepModal(project, step, null, true);
  }

  bg.innerHTML = `
    <div class="modal gantt-modal">
      <h3>Timeline for production</h3>
      <div class="timeline-hint">${totalDays} day${totalDays===1?'':'s'} from ${esc(fmtDate(earliest))} to ${esc(fmtDate(latest))}</div>
      <div class="gantt-auto-btns">
        ${(project.startDate && getShootDates(project).length) ? `<button class="btn small" id="tlAutoSchedulePre">Auto-schedule pre-production from shoot dates</button>` : ''}
        ${getShootDates(project).length ? `<button class="btn small" id="tlAutoSchedule">Auto-schedule post-production from shoot dates</button>` : ''}
      </div>
      <div class="gantt-body">
        <div class="gantt-inner" style="width:${110 + axisWidth}px;">
          <div class="gantt-axis-row">
            <div class="gantt-axis-spacer"></div>
            <div class="gantt-axis-days">${axisDaysHtml}</div>
          </div>
          <div class="gantt-rows">
            ${rowsHtml}
            ${todayLine}
          </div>
        </div>
      </div>
      <div class="modal-actions"><button class="btn primary" id="tlClose" style="flex:1;">Close</button></div>
    </div>`;
  presentPanel(bg, timelineStepId);
  // scroll today into view on open, so the user isn't dropped at the far left of a long project
  const scrollWrap = bg.querySelector('.gantt-body');
  if(scrollWrap) scrollWrap.scrollLeft = showToday ? Math.max(0, todayOffset*pxPerDay - 100) : 0;
  bg.querySelectorAll('[data-tlpoint]').forEach(row => {
    row.addEventListener('click', () => {
      const pt = points[parseInt(row.dataset.tlpoint, 10)];
      if(pt && pt.stepId){
        const step = (project.steps||[]).find(s => s.id === pt.stepId);
        if(step) openPanelFor(step);
      }
    });
  });
  const autoBtn = bg.querySelector('#tlAutoSchedule');
  if(autoBtn){
    autoBtn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const result = await applyAutoSchedule(project);
      if(result.ok){
        const msg = result.noDeliverySet
          ? `Delivery date set to ${fmtDate(result.deliveryDate)} based on the schedule`
          : 'Post-production dates scaled to fit delivery date';
        showToast(msg);
        bg.remove();
        openTimelineModal(project, timelineStepId, sideRight);
      } else {
        showToast('Save failed', true);
      }
    });
  }
  const autoPreBtn = bg.querySelector('#tlAutoSchedulePre');
  if(autoPreBtn){
    autoPreBtn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const result = await applyPreProductionSchedule(project);
      showToast(result.ok ? 'Pre-production dates set' : 'Save failed', !result.ok);
      if(result.ok){
        bg.remove();
        openTimelineModal(project, timelineStepId, sideRight);
      }
    });
  }
  bg.querySelector('#tlClose').addEventListener('click', () => bg.remove());
  bg.addEventListener('click', ev => { if(ev.target === bg) bg.remove(); });
}

// the default budget every project effectively starts with, before the user ever opens/saves
// the Budget step — used both to seed the Budget panel and so Brief's fee suggestion works
// automatically without requiring a trip through Budget first.
function buildDefaultBudget(project){
  const defaultDays = String(getShootDates(project).length || '');
  const cameraRate = project.projectType === 'wedding' ? '500' : '200';
  const editorItems = project.projectType === 'wedding'
    ? [
        { id: uid(), label:'DIT and assembly edit', days:'1', date:'' },
        { id: uid(), label:'Refined edit', days:'1', date:'' },
        { id: uid(), label:'Audio processing', days:'1', date:'' },
        { id: uid(), label:'Colour correction, Grade and render', days:'1', date:'' },
      ]
    : [
        { id: uid(), label:'DIT and assembly edit', days:'1', date:'' },
        { id: uid(), label:'Refined edit', days:'1', date:'' },
        { id: uid(), label:'Colour correction, Grade and render', days:'1', date:'' },
      ];
  const otherCostRows = project.projectType === 'wedding'
    ? [ { id: uid(), label:'Rentals', amount:'', days:'1', details:'', items:[] } ]
    : [
        { id: uid(), label:'Rentals', amount:'', days:'1', details:'', items:[] },
        { id: uid(), label:'Props', amount:'', days:'1', details:'', items:[] },
        { id: uid(), label:'Costume', amount:'', days:'1', details:'', items:[] },
      ];
  const budget = {
    operators: [
      { id: uid(), role:'Camera ops', details:'', days: '', rate:cameraRate, count:'2', items:[] },
      { id: uid(), role:'Editor', details:'', days:'', rate:'150', count:'1', items: editorItems },
    ],
    rows: otherCostRows,
  };
  const firstOp = budget.operators[0];
  const shootDates = getShootDates(project);
  if(shootDates.length){
    firstOp.items = shootDates.map(d => ({ id: uid(), label:'Shoot day', days:'1', date: d }));
  } else if(defaultDays){
    firstOp.days = defaultDays;
  }
  return budget;
}
// step.budget if it's been saved, otherwise the same default the Budget panel would start from
function getEffectiveBudget(project, budgetStep){
  if(!budgetStep) return null;
  return budgetStep.budget || buildDefaultBudget(project);
}
// drafts a contract from the project's own Brief data — a starting point to review, not a
// finished legal document
function generateContractText(project){
  const briefStep = (project.steps || []).find(isBriefStep);
  const brief = (briefStep && briefStep.briefData) || {};
  const dates = getShootDates(project);
  const dateList = dates.length ? dates.map(d => fmtDate(d)).join(', ') : 'TBC';
  const lines = [
    'PRODUCTION SERVICE AGREEMENT',
    '',
    `Project: ${project.name || ''}`,
    `Client: ${project.client || '[Client name]'}`,
    '',
    'PROJECT SUMMARY',
    brief.summary || '[Add a project summary in the Brief step]',
    '',
    'DELIVERABLES',
    brief.deliverables || '[Add deliverables in the Brief step]',
    '',
    'VISUAL APPROACH',
    brief.visualApproach || '[Add visual approach in the Brief step]',
    '',
    'SHOOT DATE(S)',
    dateList,
    '',
    'DELIVERY DATE',
    project.deliveryDate ? fmtDate(project.deliveryDate) : 'TBC',
    '',
    'FEES',
    brief.fees || '[Add fees in the Brief step, or generate them there from Budget]',
    '',
    'ADDITIONAL DETAILS',
    brief.detail || '',
    '',
    'By signing below, both parties agree to the terms outlined above.',
    '',
    'Client signature: _______________________  Date: _______________',
    '',
    'Production signature: _______________________  Date: _______________',
  ];
  return lines.join('\n');
}
// renders the contract text to a paginated PDF client-side (jsPDF, loaded from the same CDN
// pattern as the xlsx library) — lines that are their own all-caps heading get bolded
function exportContractPdf(project, text){
  if(!text.trim()){ showToast('Nothing to export yet', true); return; }
  if(typeof window.jspdf === 'undefined'){ showToast("Couldn't load the PDF writer — check your connection and try again", true); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const margin = 56;
  const maxWidth = doc.internal.pageSize.getWidth() - margin*2;
  const pageHeight = doc.internal.pageSize.getHeight();
  const lineHeight = 15;
  let y = margin;
  text.split('\n').forEach(rawLine => {
    const trimmed = rawLine.trim();
    const isHeading = !!trimmed && trimmed === trimmed.toUpperCase() && /[A-Z]/.test(trimmed);
    doc.setFont('helvetica', isHeading ? 'bold' : 'normal');
    doc.setFontSize(isHeading ? 12 : 11);
    const wrapped = doc.splitTextToSize(rawLine || ' ', maxWidth);
    wrapped.forEach(wline => {
      if(y > pageHeight - margin){ doc.addPage(); y = margin; }
      doc.text(wline, margin, y);
      y += lineHeight;
    });
    if(isHeading) y += 3;
  });
  doc.save(`${(project.name || 'project').replace(/[^a-z0-9]+/gi,'-')}-contract.pdf`);
}

    return `

  function paint(){

        <h3>Tests</h3>

        <div class="modal-actions">
